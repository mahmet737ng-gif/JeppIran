<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEPPIRAN | New 20 poster review</title><style>body{background:#061525;color:#f0f5fb;font:15px system-ui,Arial;margin:0;padding:22px}h1{font-size:24px}p{color:#accce7}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}figure{margin:0;border:1px solid #244762;border-radius:12px;overflow:hidden;background:#102438}img{display:block;width:100%;height:auto}figcaption{padding:10px;font-size:12px;letter-spacing:.05em}</style></head><body><h1>JEPPIRAN — new 20 illustration review</h1><p>Two batches, original geometry and city icons preserved. These images are illustrative only, not ADC. No airport code is assigned until correct mapping is confirmed.</p><main id="items"></main><script>for(let n=1;n<=20;n++){const id=String(n).padStart(2,'0');const f=document.createElement('figure');const i=document.createElement('img');i.src='new20_'+id+'.webp';i.loading='lazy';i.alt='Poster '+id;const c=document.createElement('figcaption');c.textContent='DESIGN '+id+' · '+(n<11?'FIRST':'SECOND')+' BATCH';f.append(i,c);document.querySelector('#items').append(f)}</script></body></html>
