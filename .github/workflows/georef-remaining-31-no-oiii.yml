name: V2621 georeference 31 pages (Mehrabad frozen)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/georef-remaining-31-no-oiii.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-georef.txt
      - name: Extract source-PDF geometry without modifying any airport
        run: |
          python scripts/diagnose_georef_31_without_oiii.py
          python scripts/diagnose_inset_geometry_31.py
          python scripts/diagnose_31_dash_tracks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V2621-31-source-axis-diagnostics
          path: georef31-diagnostic.json
