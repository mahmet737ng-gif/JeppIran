name: Build isolated JEPPIRAN OIBL OIHH ADC test APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-adc-georef-test.yml'
      - 'web/data/adc-georef-v2621-qa.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jeppiran-adc-qa-v2621
  cancel-in-progress: false

jobs:
  qa-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout current stable code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK platform and signer
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Inject TWO test-only calibrations into an isolated QA build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,json
          from pathlib import Path
          repo=Path('app/src/main/assets')
          original=json.loads((repo/'chart-georef.json').read_text())
          manifest=json.loads((repo/'charts-manifest.json').read_text())
          data=json.loads(Path('web/data/adc-georef-v2621-qa.json').read_text())
          assert data['testOnly'] and len(data['charts'])==2
          assert manifest['version']=='V2621' and data['source']['sha256']==manifest['source_sha256']
          assert original['source']['sha256']==data['source']['sha256']
          assert original['source']['chartDataVersion']=='V2621'
          pages={int(c['page']) for c in original['charts']}
          assert not {118,342}&pages,'Do not replace production georeferences'
          index=json.loads((repo/'charts-current.json').read_text())
          for c in data['charts']:
              page=int(c['page']); icao=c['airport']
              assert (page,icao) in {(118,'OIBL'),(342,'OIHH')}
              assert c['validation']['method']=='aip_and_printed_grid_10m_test_only'
              assert c['validation']['qaTestOnly']
              assert any(x['page']==page and x['airport']==icao and x['chart_number']=='10-9' for x in index)
          modified=copy.deepcopy(original)
          modified['charts']+=data['charts']
          modified['testOnly']='OIBL/OIHH 10 metre QA, NOT FOR ACTUAL NAVIGATION'
          (repo/'chart-georef.json').write_text(json.dumps(modified,ensure_ascii=False,indent=2)+'\n')
          gradle=Path('app/build.gradle.kts')
          g=gradle.read_text()
          assert 'applicationId = "com.tareghmsr.jeppiran"' in g
          gradle.write_text(g.replace('applicationId = "com.tareghmsr.jeppiran"','applicationId = "com.tareghmsr.jeppiran.adctest"'))
          manifest_xml=Path('app/src/main/AndroidManifest.xml')
          xm=manifest_xml.read_text()
          assert 'android:label="JeppIran"' in xm
          manifest_xml.write_text(xm.replace('android:label="JeppIran"','android:label="JEPPIRAN ADC QA"'))
          k=Path('app/src/main/java/com/tareghmsr/jeppiran/ChartGeoreference.kt')
          src=k.read_text()
          match='"single_axis_plus_conformal_scale"'
          assert src.count(match)==1
          k.write_text(src.replace(match, match+',\n            "aip_and_printed_grid_10m_test_only"'))
          notice=repo/'ADC_QA_TEST_ONLY.txt'
          notice.write_text('OIBL page118 / OIHH page342, AIP 10m provisional calibrations. Not for actual navigation. Separate application package.\\n')
          print('QA sources prepared:',len(original['charts']),'untouched records + 2 TEST-ONLY')
          PY
      - name: Run Android tests and build QA APK
        env:
          JEPPIRAN_VERSION_NAME: V2621-ADC-QA1
          JEPPIRAN_VERSION_CODE: 2621999
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Verify package identity and APK signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='com.tareghmsr.jeppiran.adctest'"
          cp "$APK" JEPPIRAN-ADC-QA-V2621.apk
      - name: Publish isolated prerelease only, never overwrite stable JEPPIRAN APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=jeppiran-adc-qa-v2621-1
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease \
              --title "JEPPIRAN OIBL/OIHH ADC calibration TEST only" \
              --notes "Separate Android app ID com.tareghmsr.jeppiran.adctest; only ADC source pages 118 and 342 use experimental AIP/tick 10m calibrations. No other georeference changes. NOT FOR ACTUAL NAVIGATION. Uninstall QA app after test."
          fi
          gh release upload "$TAG" JEPPIRAN-ADC-QA-V2621.apk web/data/adc-georef-v2621-qa.json --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
      - uses: actions/upload-artifact@v4
        with:
          name: JEPPIRAN-ADC-QA-V2621
          path: JEPPIRAN-ADC-QA-V2621.apk
          retention-days: 30
