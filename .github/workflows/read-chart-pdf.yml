name: Build JeppIran Chart Database

on:
  push:
    paths:
      - 'Iran2620.pdf'
      - '.github/workflows/read-chart-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-chart-database:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository with LFS
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf

      - name: Check PDF
        run: |
          ls -lh Iran2620.pdf
          pdfinfo Iran2620.pdf | head -30
          qpdf --version

      - name: Build chart database
        shell: bash
        run: |

          python3 - <<'PY'

          import hashlib
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timezone


          PDF_FILE = "Iran2620.pdf"

          VERSION = "v18"

          RELEASE_TAG = "charts-v18"

          REPOSITORY = "mahmet737ng-gif/JeppIran"

          BASE_URL = (
              "https://github.com/"
              + REPOSITORY
              + "/releases/download/"
              + RELEASE_TAG
              + "/"
          )

          INDEX_FILE = "charts-index.json"

          APP_FILE = "charts-app-v18.json"

          ASSET_DIR = "app/src/main/assets"

          APP_ASSET_FILE = (
              ASSET_DIR
              + "/charts-app-v18.json"
          )

          MANIFEST_ASSET_FILE = (
              ASSET_DIR
              + "/charts-manifest.json"
          )

          BUILD_DIR = "airport-pdfs"


          SUPPORTED_ICAOS = {
              "LTFM",

              "OIAA",
              "OIAM",
              "OIAW",
              "OIBB",
              "OIBK",
              "OIBP",
              "OICC",
              "OICI",
              "OIFM",
              "OIGG",
              "OIHH",
              "OIIE",
              "OIII",
              "OIIP",
              "OIKK",
              "OIMB",
              "OIMM",
              "OIMN",
              "OIMS",
              "OING",
              "OINZ",
              "OISS",
              "OITL",
              "OITR",
              "OITT",
              "OIYY",
              "OIZC",
              "OIZH",

              "OMDB",
              "OOMS",

              "ORBI",
              "ORNI",

              "UDYZ",

              "UGSB",
              "UGTB"
          }


          def clean_spaces(value):

              return re.sub(
                  r"\s+",
                  " ",
                  value
              ).strip()


          def get_lines(text):

              lines = []

              for raw in text.splitlines():

                  line = clean_spaces(
                      raw
                  )

                  if not line:
                      continue

                  upper = line.upper()

                  if (
                      "PRINTED FROM JEPPVIEW FOR WINDOWS"
                      in upper
                  ):
                      continue

                  if (
                      "PRINTED FROM JEPPESEN"
                      in upper
                  ):
                      continue

                  lines.append(
                      line
                  )

              return lines


          def detect_icaos(text):

              upper = text.upper()

              candidates = re.findall(
                  r"\b[A-Z]{4}\b",
                  upper
              )

              result = []

              seen = set()

              for code in candidates:

                  if code not in SUPPORTED_ICAOS:
                      continue

                  if code in seen:
                      continue

                  seen.add(code)

                  result.append(
                      code
                  )

              return result


          def detect_category(text):

              upper = text.upper()


              if re.search(
                  r"\bSTAR\b|STANDARD ARRIVAL",
                  upper
              ):
                  return "STAR"


              if re.search(
                  r"\bSID\b|STANDARD INSTRUMENT DEPARTURE",
                  upper
              ):
                  return "SID"


              if re.search(
                  r"\bAPPROACH\b",
                  upper
              ):
                  return "Approach"


              if re.search(
                  r"\bILS\b|\bLOC\b|\bVOR\b|\bNDB\b|\bRNAV\b|\bRNP\b|\bGLS\b|\bLDA\b|\bSRA\b",
                  upper
              ):

                  if re.search(
                      r"\bRWY\b|\bRUNWAY\b",
                      upper
                  ):
                      return "Approach"


              if re.search(
                  r"AERODROME CHART|AIRPORT CHART|AIRPORT INFORMATION|AERODROME INFORMATION|ADC\b|GROUND CHART|TAXIWAY|APRON",
                  upper
              ):
                  return "Airport"


              return "Other"


          def extract_chart_number(lines):

              patterns = [

                  re.compile(
                      r"\b(\d{1,2}-\d{1,2}[A-Z]?)\b"
                  ),

                  re.compile(
                      r"\b(\d{1,2}-[A-Z]-\d{1,2})\b"
                  ),

                  re.compile(
                      r"\b(\d{1,2}-\d{1,2}-\d{1,2})\b"
                  )
              ]


              for line in lines:

                  upper = line.upper()


                  if (
                      "PRINTED" in upper
                  ):
                      continue


                  for pattern in patterns:

                      match = pattern.search(
                          upper
                      )


                      if match:

                          return match.group(
                              1
                          )


              return ""


          def clean_title_candidate(
              line
          ):

              value = clean_spaces(
                  line
              )

              upper = value.upper()


              if len(value) < 3:
                  return ""


              ignored = [

                  "JEPPESEN",
                  "JEPPVIEW",
                  "COPYRIGHT",
                  "REVISION",
                  "CHANGES",
                  "COMMUNICATIONS",
                  "FREQUENCIES",
                  "NOTES",
                  "LEGEND",
                  "DISTANCE",
                  "ALTITUDE",
                  "HEIGHT",
                  "TRANSITION",
                  "MAGNETIC",
                  "VARIATION"
              ]


              for word in ignored:

                  if word in upper:
                      return ""


              if re.fullmatch(
                  r"[0-9\s./-]+",
                  value
              ):
                  return ""


              return value[:160]


          def extract_airport_name(
              lines
          ):

              for line in lines[:50]:

                  upper = line.upper()

                  if (
                      "AERODROME CHART"
                      in upper
                  ):

                      return "AERODROME CHART"


              for line in lines[:50]:

                  upper = line.upper()

                  if (
                      "AIRPORT CHART"
                      in upper
                  ):

                      return "AIRPORT CHART"


              for line in lines[:50]:

                  upper = line.upper()

                  if (
                      "AERODROME INFORMATION"
                      in upper
                  ):

                      return "AERODROME INFORMATION"


              for line in lines[:50]:

                  upper = line.upper()

                  if (
                      "AIRPORT INFORMATION"
                      in upper
                  ):

                      return "AIRPORT INFORMATION"


              return "AIRPORT CHART"


          def extract_procedure_codes(
              lines
          ):

              results = []

              seen = set()


              bracket_pattern = re.compile(
                  r"\[([A-Z0-9][A-Z0-9.-]{2,20})\]"
              )


              plain_pattern = re.compile(
                  r"\b([A-Z]{2,10})\s+([0-9]{1,2}[A-Z])\b"
              )


              ignored = {
                  "RWY",
                  "ILS",
                  "LOC",
                  "VOR",
                  "NDB",
                  "DME",
                  "RNAV",
                  "RNP",
                  "STAR",
                  "SID"
              }


              for line in lines:

                  upper = line.upper()


                  for code in bracket_pattern.findall(
                      upper
                  ):

                      if code in ignored:
                          continue


                      if code not in seen:

                          seen.add(
                              code
                          )

                          results.append(
                              code
                          )


              if results:

                  return results[:8]


              for line in lines:

                  upper = line.upper()


                  if "RWY" in upper:
                      continue

                  if "AIRPORT" in upper:
                      continue

                  if "AERODROME" in upper:
                      continue


                  matches = plain_pattern.findall(
                      upper
                  )


                  for first, second in matches:

                      if first in ignored:
                          continue


                      value = (
                          f"{first} {second}"
                      )


                      if value in seen:
                          continue


                      seen.add(
                          value
                      )

                      results.append(
                          value
                      )


              return results[:8]


          def extract_approach_name(
              lines
          ):

              patterns = [

                  re.compile(
                      r"\bILS\s+([XYZ])?\s*"
                      r"(?:OR\s+LOC\s+([XYZ])?)?"
                      r"\s+RWY\s+"
                      r"([0-9]{1,2}[LRC]?"
                      r"(?:/[0-9]{1,2}[LRC]?)?)",
                      re.IGNORECASE
                  ),

                  re.compile(
                      r"\bVOR(?:\s+DME)?"
                      r"(?:\s+[A-Z0-9]+)?"
                      r"\s+RWY\s+"
                      r"([0-9]{1,2}[LRC]?"
                      r"(?:/[0-9]{1,2}[LRC]?)?)",
                      re.IGNORECASE
                  ),

                  re.compile(
                      r"\bNDB\s+RWY\s+"
                      r"([0-9]{1,2}[LRC]?"
                      r"(?:/[0-9]{1,2}[LRC]?)?)",
                      re.IGNORECASE
                  ),

                  re.compile(
                      r"\b(RNAV|RNP|GLS|LDA|SRA)"
                      r"(?:\s+\([A-Z0-9]+\))?"
                      r"(?:\s+[A-Z0-9.-]+)*"
                      r"\s+RWY\s+"
                      r"([0-9]{1,2}[LRC]?"
                      r"(?:/[0-9]{1,2}[LRC]?)?)",
                      re.IGNORECASE
                  )
              ]


              for line in lines[:100]:

                  upper = line.upper()


                  match = patterns[0].search(
                      upper
                  )


                  if match:

                      variant1 = (
                          match.group(1)
                      )

                      variant2 = (
                          match.group(2)
                      )

                      runway = (
                          match.group(3)
                      )


                      if variant1:

                          if variant2:

                              return (
                                  f"ILS {variant1} "
                                  f"OR LOC {variant2} "
                                  f"RWY {runway}"
                              )


                          return (
                              f"ILS {variant1} "
                              f"RWY {runway}"
                          )


                      return (
                          f"ILS OR LOC "
                          f"RWY {runway}"
                      )


                  match = patterns[1].search(
                      upper
                  )


                  if match:

                      return clean_spaces(
                          match.group(0)
                      )


                  match = patterns[2].search(
                      upper
                  )


                  if match:

                      return (
                          f"NDB RWY "
                          f"{match.group(1)}"
                      )


                  match = patterns[3].search(
                      upper
                  )


                  if match:

                      return (
                          f"{match.group(1).upper()} "
                          f"RWY "
                          f"{match.group(2)}"
                      )


              return ""


          def extract_other_name(
              lines
          ):

              for line in lines[:50]:

                  candidate =
                      clean_title_candidate(
                          line
                      )


                  if not candidate:
                      continue


                  if re.match(
                      r"^(PAGE|CHART)\s+\d+$",
                      candidate,
                      re.IGNORECASE
                  ):
                      continue


                  return candidate


              return ""


          def build_chart_name(
              category,
              lines,
              chart_number
          ):

              if category == "Airport":

                  return extract_airport_name(
                      lines
                  )


              if category in (
                  "STAR",
                  "SID"
              ):

                  procedures =
                      extract_procedure_codes(
                          lines
                      )


                  if procedures:

                      return ", ".join(
                          procedures
                      )


                  if chart_number:

                      return (
                          f"{category} "
                          f"{chart_number}"
                      )


                  return (
                      f"{category} CHART"
                  )


              if category == "Approach":

                  approach =
                      extract_approach_name(
                          lines
                      )


                  if approach:

                      return approach


                  if chart_number:

                      return (
                          f"APPROACH "
                          f"{chart_number}"
                      )


                  return "APPROACH CHART"


              other =
                  extract_other_name(
                      lines
                  )


              if other:

                  return other


              if chart_number:

                  return (
                      f"OTHER "
                      f"{chart_number}"
                  )


              return "OTHER CHART"


          pdfinfo =
              subprocess.check_output(
                  [
                      "pdfinfo",
                      PDF_FILE
                  ],
                  text=True,
                  errors="replace"
              )


          match =
              re.search(
                  r"^Pages:\s+(\d+)",
                  pdfinfo,
                  re.MULTILINE
              )


          if not match:

              raise SystemExit(
                  "Could not determine PDF page count"
              )


          total_pages =
              int(
                  match.group(1)
              )


          chart_rows = []

          airport_pages = {}


          for page in range(
              1,
              total_pages + 1
          ):

              result =
                  subprocess.run(
                      [
                          "pdftotext",
                          "-layout",
                          "-f",
                          str(page),
                          "-l",
                          str(page),
                          PDF_FILE,
                          "-"
                      ],
                      capture_output=True,
                      text=True,
                      errors="replace"
                  )


              raw_text =
                  result.stdout


              lines =
                  get_lines(
                      raw_text
                  )


              icaos =
                  detect_icaos(
                      raw_text
                  )


              category =
                  detect_category(
                      raw_text
                  )


              chart_number =
                  extract_chart_number(
                      lines
                  )


              name =
                  build_chart_name(
                      category,
                      lines,
                      chart_number
                  )


              primary_icao =
                  icaos[0] if icaos else ""


              row = {

                  "page":
                      page,

                  "icao":
                      primary_icao,

                  "airport":
                      primary_icao,

                  "category":
                      category,

                  "chart_number":
                      chart_number,

                  "name":
                      name,

                  "pdf_page":
                      0
              }


              chart_rows.append(
                  row
              )


              if (
                  primary_icao in
                  SUPPORTED_ICAOS
              ):

                  airport_pages.setdefault(
                      primary_icao,
                      []
                  ).append(
                      page
                  )


          os.makedirs(
              BUILD_DIR,
              exist_ok=True
          )


          local_page_maps = {}


          for icao in sorted(
              airport_pages.keys()
          ):

              pages_for_airport =
                  sorted(
                      airport_pages[icao]
                  )


              local_page_maps[icao] = {

                  global_page:
                      local_index + 1

                  for local_index, global_page
                  in enumerate(
                      pages_for_airport
                  )
              }


              page_list =
                  ",".join(
                      str(page)
                      for page in
                      pages_for_airport
                  )


              output_pdf =
                  os.path.join(
                      BUILD_DIR,
                      f"{icao}.pdf"
                  )


              print(
                  f"Building {icao}.pdf "
                  f"with {len(pages_for_airport)} pages"
              )


              subprocess.run(
                  [
                      "qpdf",
                      "--empty",
                      "--pages",
                      PDF_FILE,
                      page_list,
                      "--",
                      output_pdf
                  ],
                  check=True
              )


              check =
                  subprocess.run(
                      [
                          "qpdf",
                          "--check",
                          output_pdf
                      ],
                      capture_output=True,
                      text=True
                  )


              if (
                  check.returncode != 0
              ):

                  print(
                      check.stdout
                  )

                  print(
                      check.stderr
                  )

                  raise SystemExit(
                      "qpdf validation failed for "
                      + icao
                  )


          for row in chart_rows:

              icao =
                  row["icao"]


              global_page =
                  row["page"]


              row["pdf_page"] =
                  local_page_maps.get(
                      icao,
                      {}
                  ).get(
                      global_page,
                      0
                  )


          charts_by_airport = {}


          for row in chart_rows:

              icao =
                  row["icao"]


              if not icao:
                  continue


              charts_by_airport.setdefault(
                  icao,
                  []
              ).append(
                  dict(row)
              )


          for icao in charts_by_airport:

              charts_by_airport[
                  icao
              ].sort(
                  key=lambda item:
                  item["pdf_page"]
              )


          generated_at =
              datetime.now(
                  timezone.utc
              ).isoformat()


          database = {

              "version":
                  VERSION,

              "source":
                  PDF_FILE,

              "generated_at":
                  generated_at,

              "pages":
                  total_pages,

              "charts":
                  chart_rows
          }


          with open(
              INDEX_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  database,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          with open(
              APP_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  database,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          os.makedirs(
              ASSET_DIR,
              exist_ok=True
          )


          with open(
              APP_ASSET_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  database,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          manifest_airports = {}


          for icao in sorted(
              airport_pages.keys()
          ):

              output_pdf =
                  os.path.join(
                      BUILD_DIR,
                      f"{icao}.pdf"
                  )


              size =
                  os.path.getsize(
                      output_pdf
                  )


              digest =
                  hashlib.sha256()


              with open(
                  output_pdf,
                  "rb"
              ) as f:

                  while True:

                      block =
                          f.read(
                              1024 * 1024
                          )


                      if not block:
                          break


                      digest.update(
                          block
                      )


              manifest_airports[
                  icao
              ] = {

                  "file":
                      f"{icao}.pdf",

                  "url":
                      BASE_URL +
                      f"{icao}.pdf",

                  "sha256":
                      digest.hexdigest(),

                  "size":
                      size,

                  "pages":
                      len(
                          airport_pages[icao]
                      ),

                  "global_pages":
                      airport_pages[icao]
              }


          manifest = {

              "version":
                  VERSION,

              "release_tag":
                  RELEASE_TAG,

              "base_url":
                  BASE_URL,

              "source":
                  PDF_FILE,

              "generated_at":
                  generated_at,

              "airports":
                  manifest_airports
          }


          with open(
              MANIFEST_ASSET_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  manifest,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print()
          print("=" * 70)
          print("JEPPIRAN V18 DATABASE")
          print("=" * 70)

          print(
              "Source pages:",
              total_pages
          )

          print(
              "Chart rows:",
              len(chart_rows)
          )

          print(
              "Airports:",
              len(manifest_airports)
          )

          print()

          for icao in sorted(
              manifest_airports.keys()
          ):

              item =
                  manifest_airports[icao]


              print(
                  icao,
                  ":",
                  item["pages"],
                  "pages,",
                  item["size"],
                  "bytes"
              )

          print()

          print(
              "Generated:",
              APP_FILE
          )

          print(
              "Generated:",
              APP_ASSET_FILE
          )

          print(
              "Generated:",
              MANIFEST_ASSET_FILE
          )

          print("=" * 70)

          PY


      - name: Validate generated database
        shell: bash
        run: |

          test -f charts-app-v18.json

          test -f app/src/main/assets/charts-app-v18.json

          test -f app/src/main/assets/charts-manifest.json

          test -d airport-pdfs


          python3 - <<'PY'

          import json
          import os


          with open(
              "charts-app-v18.json",
              "r",
              encoding="utf-8"
          ) as f:

              database =
                  json.load(
                      f
                  )


          with open(
              "app/src/main/assets/charts-manifest.json",
              "r",
              encoding="utf-8"
          ) as f:

              manifest =
                  json.load(
                      f
                  )


          charts =
              database.get(
                  "charts",
                  []
              )


          if not charts:

              raise SystemExit(
                  "Chart database is empty"
              )


          if (
              database.get(
                  "version"
              )
              !=
              "v18"
          ):

              raise SystemExit(
                  "Wrong database version"
              )


          if (
              manifest.get(
                  "version"
              )
              !=
              "v18"
          ):

              raise SystemExit(
                  "Wrong manifest version"
              )


          airports =
              manifest.get(
                  "airports",
                  {}
              )


          if not airports:

              raise SystemExit(
                  "No airport PDFs generated"
              )


          for icao, item in airports.items():

              path =
                  os.path.join(
                      "airport-pdfs",
                      item["file"]
                  )


              if not os.path.isfile(
                  path
              ):

                  raise SystemExit(
                      "Missing "
                      + path
                  )


              if (
                  os.path.getsize(
                      path
                  ) <= 0
              ):

                  raise SystemExit(
                      "Empty PDF "
                      + path
                  )


          print(
              "Validated",
              len(charts),
              "chart rows."
          )


          print(
              "Validated",
              len(airports),
              "airport PDFs."
          )

          PY


      - name: Create or replace chart release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        shell: bash

        run: |

          TAG="charts-v18"


          if gh release view \
              "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1; then

            echo "Deleting existing release $TAG"

            gh release delete \
              "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --yes \
              --cleanup-tag

          fi


          gh release create \
            "$TAG" \
            airport-pdfs/*.pdf \
            --repo "$GITHUB_REPOSITORY" \
            --title "JeppIran Chart Data v18" \
            --notes "Per-airport JeppIran chart PDFs generated from Iran2620.pdf."


      - name: Commit generated database
        shell: bash

        run: |

          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            charts-index.json \
            charts-app-v18.json \
            app/src/main/assets/charts-app-v18.json \
            app/src/main/assets/charts-manifest.json


          if git diff --cached --quiet; then

            echo "No database changes."

          else

            git commit \
              -m "Build JeppIran chart database v18"

            git push

          fi
