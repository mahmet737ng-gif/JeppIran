name: Refresh Web Weather Cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-web-weather.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: web-weather-cache
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Fetch METAR and TAF from NOAA
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          manifest = json.loads(pathlib.Path("app/src/main/assets/charts-manifest.json").read_text(encoding="utf-8"))
          icaos = sorted(manifest.get("airports", {}).keys())
          stations = {icao: {"metar": "", "taf": ""} for icao in icaos}

          def load_previous():
              url = "https://raw.githubusercontent.com/mahmet737ng-gif/JeppIran/wx-cache/wx-live.json"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "JEPPIRAN-WX-Cache/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = json.load(r)
                  for icao, row in data.get("stations", {}).items():
                      if icao in stations:
                          stations[icao]["metar"] = str(row.get("metar") or "")
                          stations[icao]["taf"] = str(row.get("taf") or "")
              except Exception as exc:
                  print("No previous cache:", exc)

          def fetch(kind):
              ids = urllib.parse.quote(",".join(icaos), safe=",")
              url = f"https://aviationweather.gov/api/data/{kind}?ids={ids}&format=json"
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "JEPPIRAN-WX-Cache/1.0",
                      "Accept": "application/json"
                  }
              )
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.load(r)

          load_previous()

          for kind in ("metar", "taf"):
              try:
                  rows = fetch(kind)
                  print(kind, "records:", len(rows) if isinstance(rows, list) else 0)
                  if not isinstance(rows, list):
                      continue
                  for row in rows:
                      icao = str(row.get("icaoId") or row.get("station") or row.get("id") or "").upper()
                      if icao not in stations:
                          continue
                      if kind == "metar":
                          raw = row.get("rawOb") or row.get("rawText") or row.get("raw_text") or ""
                      else:
                          raw = row.get("rawTAF") or row.get("rawTaf") or row.get("rawText") or row.get("raw_text") or ""
                      if raw:
                          stations[icao][kind] = str(raw).strip()
              except Exception as exc:
                  print("NOAA", kind, "fetch failed; retaining previous cache:", exc)

          output = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "stations": stations
          }
          pathlib.Path("/tmp/wx-live.json").write_text(
              json.dumps(output, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8"
          )
          print("Cached stations:", sum(1 for row in stations.values() if row["metar"] or row["taf"]))
          PY

      - name: Publish lightweight wx-cache branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/wx-publish
          mkdir -p /tmp/wx-publish
          cp /tmp/wx-live.json /tmp/wx-publish/wx-live.json
          cd /tmp/wx-publish
          git init -b wx-cache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wx-live.json
          git commit -m "Refresh JEPPIRAN web weather cache"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin wx-cache
