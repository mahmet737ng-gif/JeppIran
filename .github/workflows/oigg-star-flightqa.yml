name: OIGG STAR 307 308 source fit simulator QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/oigg_star_source_fit.py'
      - 'web/data/oigg-star-flightqa-v2621.json'
      - 'web/tests/oigg-local-warp.test.cjs'
      - 'web/tests/oigg-star-flightqa.test.cjs'
      - 'web/tests/georef-retention.test.cjs'
      - 'web/app.js'
      - '.github/workflows/oigg-star-flightqa.yml'
permissions:
  contents: read
jobs:
  source-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyMuPDF==1.26.6' 'numpy==2.3.5'
      - run: node --check web/app.js
      - run: node --test web/tests/oigg-star-flightqa.test.cjs web/tests/oigg-local-warp.test.cjs web/tests/georef-retention.test.cjs
      - run: python scripts/oigg_star_source_fit.py
      - name: Protect all existing OIGG/OIII models
        run: cmp web/data/chart-georef.json app/src/main/assets/chart-georef.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oigg-star307-308-source-qa
          path: review-assets/oigg-star-source-fit.json
          if-no-files-found: warn
