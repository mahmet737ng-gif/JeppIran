name: Fix PdfViewer Float Types

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix remaining Float type error
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/src/main/java/com/tareghmsr/jeppiran/PdfViewerActivity.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          pattern = re.compile(
              r"""
              (\.contains\s*\(\s*)
              localX
              \s*,\s*
              localY
              (\s*\))
              """,
              re.MULTILINE | re.VERBOSE
          )

          matches = list(
              pattern.finditer(text)
          )

          print(
              "Found target blocks:",
              len(matches)
          )

          if len(matches) != 1:
              raise SystemExit(
                  "Expected exactly one localX/localY contains block, "
                  "but found "
                  + str(len(matches))
              )

          replacement = (
              r"\1"
              "localX.toFloat(),"
              "\n"
              "                            localY.toFloat()"
              r"\2"
          )

          new_text = pattern.sub(
              replacement,
              text,
              count=1
          )

          path.write_text(
              new_text,
              encoding="utf-8"
          )

          print(
              "PdfViewerActivity.kt updated successfully."
          )
          PY

      - name: Verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/tareghmsr/jeppiran/PdfViewerActivity.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          if "localX.toFloat()" not in text:
              raise SystemExit(
                  "localX.toFloat() was not found."
              )

          if "localY.toFloat()" not in text:
              raise SystemExit(
                  "localY.toFloat() was not found."
              )

          print(
              "Float conversion verification passed."
          )
          PY

      - name: Show diff
        shell: bash
        run: |
          git diff -- \
            app/src/main/java/com/tareghmsr/jeppiran/PdfViewerActivity.kt

      - name: Commit fix
        shell: bash
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/java/com/tareghmsr/jeppiran/PdfViewerActivity.kt

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit \
            -m "Fix PdfViewer float conversion"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git rm \
            ".github/workflows/fix-pdf-float.yml"

          git commit \
            -m "Remove temporary float fixer"

          git push origin HEAD:main
