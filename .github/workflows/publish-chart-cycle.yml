name: Publish JeppIran Chart Cycle

on:
  workflow_dispatch:
    inputs:
      source_pdf:
        description: "PDF file in repository, e.g. Iran2621.pdf"
        required: false
        default: ""
      data_version:
        description: "Optional data version, e.g. V2621"
        required: false
        default: ""
      cycle:
        description: "Optional cycle, e.g. 2621"
        required: false
        default: ""
  push:
    paths:
      - "Iran*.pdf"

permissions:
  contents: write

concurrency:
  group: jeppiran-chart-cycle
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install PyMuPDF==1.26.6 numpy==2.3.5

      - name: Resolve chart cycle
        id: cycle
        shell: bash
        env:
          INPUT_SOURCE: ${{ github.event.inputs.source_pdf }}
          INPUT_VERSION: ${{ github.event.inputs.data_version }}
          INPUT_CYCLE: ${{ github.event.inputs.cycle }}
        run: |
          set -euo pipefail

          SOURCE="$INPUT_SOURCE"
          if [ -z "$SOURCE" ]; then
            SOURCE=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E "^Iran[^/]*\.pdf$" | head -n 1 || true)
          fi
          if [ -z "$SOURCE" ]; then
            SOURCE=$(ls -1t Iran*.pdf 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$SOURCE" ] || [ ! -f "$SOURCE" ]; then
            echo "No source PDF found"
            exit 1
          fi

          CYCLE="$INPUT_CYCLE"
          if [ -z "$CYCLE" ]; then
            CYCLE=$(basename "$SOURCE" .pdf | sed "s/^Iran//")
          fi

          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            if echo "$CYCLE" | grep -Eq "^[0-9]{4}$"; then
              VERSION="V$CYCLE"
            else
              VERSION="$CYCLE"
            fi
          fi

          TAG="charts-$VERSION"

          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract source PDF text
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="${{ steps.cycle.outputs.source }}"
          rm -rf pdf-text
          mkdir -p pdf-text
          PAGES=$(pdfinfo "$SOURCE" | awk '/Pages:/ {print $2}')
          test "$PAGES" -gt 0
          for page in $(seq 1 "$PAGES"); do
            pdftotext -f "$page" -l "$page" -layout "$SOURCE" "pdf-text/page-$page.txt"
          done

      - name: Rebuild chart classification
        env:
          JEPPIRAN_DATA_VERSION: ${{ steps.cycle.outputs.version }}
        run: |
          python scripts/build_base_index.py --pdf-text pdf-text --output charts-index-v9.json
          python scripts/name_charts_v12.py
          python scripts/classify_charts_v16.py
          python scripts/build_charts_final.py

      - name: Build airport PDFs and manifest
        run: |
          python scripts/build_chart_cycle.py \
            --pdf "${{ steps.cycle.outputs.source }}" \
            --charts charts-current-final.json \
            --version "${{ steps.cycle.outputs.version }}" \
            --cycle "${{ steps.cycle.outputs.cycle }}" \
            --release-tag "${{ steps.cycle.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --out-dir cycle-build \
            --previous-manifest app/src/main/assets/charts-manifest.json

      - name: Build per-chart cycle changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_chart_changes.py \
            --current-charts cycle-build/charts-current.json \
            --current-airports-dir cycle-build/airports \
            --previous-charts app/src/main/assets/charts-current.json \
            --previous-manifest app/src/main/assets/charts-manifest.json \
            --changed-airports cycle-build/changed-airports.json \
            --version "${{ steps.cycle.outputs.version }}" \
            --source "${{ steps.cycle.outputs.source }}" \
            --official chart-changes-final.json \
            --output cycle-build/chart-changes.json

      - name: Rebuild chart georeferencing
        run: |
          python scripts/extract_chart_georef.py \
            --pdf "${{ steps.cycle.outputs.source }}" \
            --index cycle-build/charts-current.json \
            --output cycle-build/chart-georef.json \
            --audit cycle-build/georef-audit.json \
            --manifest cycle-build/manifest.json \
            --previous-georef app/src/main/assets/chart-georef.json \
            --data-version "${{ steps.cycle.outputs.version }}" \
            --cycle "${{ steps.cycle.outputs.cycle }}" \
            --disable-independent-check

      - name: Validate bundle
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("cycle-build/manifest.json").read_text())
          charts = json.loads(Path("cycle-build/charts-current.json").read_text())
          georef = json.loads(Path("cycle-build/chart-georef.json").read_text())
          changes = json.loads(Path("cycle-build/chart-changes.json").read_text())
          assert manifest["version"]
          assert manifest["release_tag"]
          assert manifest["airports"]
          assert len(charts) > 0
          assert georef["source"]["chartDataVersion"] == manifest["version"]
          assert changes["chartDataVersion"] == manifest["version"]
          pages = [int(c["page"]) for c in charts]
          assert len(pages) == len(set(pages))
          assert all(int(c["pdf_page"]) > 0 for c in charts)
          print("Validated", len(charts), "charts across", len(manifest["airports"]), "airports")
          PY

      - name: Publish airport PDFs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.cycle.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "JeppIran Chart Data ${{ steps.cycle.outputs.version }}" --notes "Automated JEPPIRAN chart-cycle release."
          fi
          gh release upload "$TAG" cycle-build/airports/*.pdf --clobber

      - name: Atomically publish current metadata
        shell: bash
        env:
          VERSION: ${{ steps.cycle.outputs.version }}
        run: |
          set -euo pipefail
          cp cycle-build/manifest.json app/src/main/assets/charts-manifest.json
          cp cycle-build/charts-current.json app/src/main/assets/charts-current.json
          cp cycle-build/chart-georef.json app/src/main/assets/chart-georef.json
          cp cycle-build/chart-changes.json app/src/main/assets/chart-changes.json
          cp cycle-build/changed-airports.json app/src/main/assets/changed-airports.json

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          match = re.fullmatch(r"V(\d{4})", version)
          if not match:
              raise SystemExit("App version must use VYYNN format, e.g. V2621")

          version_code = int(match.group(1))
          path = Path("app/build.gradle.kts")
          source = path.read_text(encoding="utf-8")
          source = re.sub(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {version_code}',
              source,
              count=1,
          )
          source = re.sub(
              r'versionName\s*=\s*"[^"]+"',
              f'versionName = "{version}"',
              source,
              count=1,
          )
          path.write_text(source, encoding="utf-8")
          print("App version set to", version, "code", version_code)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/charts-manifest.json app/src/main/assets/charts-current.json app/src/main/assets/chart-georef.json app/src/main/assets/chart-changes.json app/src/main/assets/changed-airports.json app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "Metadata is already current."
          else
            git commit -m "Publish chart cycle ${{ steps.cycle.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Upload cycle report
        uses: actions/upload-artifact@v4
        with:
          name: JeppIran-cycle-${{ steps.cycle.outputs.version }}
          path: |
            cycle-build/manifest.json
            cycle-build/changed-airports.json
            cycle-build/georef-audit.json
            cycle-build/chart-changes.json
