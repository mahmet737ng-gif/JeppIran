name: Build isolated JEPPIRAN Birjand OIMB ADC test APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-birjand-adc-test.yml'
      - 'web/data/birjand-adc-v2621-qa.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jeppiran-birjand-adc-qa-v2621
  cancel-in-progress: false

jobs:
  build-birjand-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout stable source without modifying main
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK platform and signing tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Add Birjand provisional GCP only to isolated build files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,json
          from pathlib import Path
          root=Path('app/src/main/assets')
          current=json.loads((root/'chart-georef.json').read_text())
          manifest=json.loads((root/'charts-manifest.json').read_text())
          index=json.loads((root/'charts-current.json').read_text())
          qa=json.loads(Path('web/data/birjand-adc-v2621-qa.json').read_text())
          assert qa['testOnly'] and qa['version']==2 and len(qa['charts'])==1
          assert qa['source']['sha256']==manifest['source_sha256']==current['source']['sha256']
          assert manifest['version']==qa['source']['chartDataVersion']==current['source']['chartDataVersion']=='V2621'
          assert manifest['pages']==qa['source']['pageCount']==1654
          target=qa['charts'][0]
          assert target['page']==561 and target['airport']=='OIMB' and target['chartKey']=='OIMB|AIRPORT|10-9|AIRPORT DIAGRAM CHART (ADC)'
          assert target['validation']['qaTestOnly'] and target['validation']['method']=='aip_and_printed_grid_10m_test_only'
          assert target['validation']['maxAipLeaveOneOutMeters']<=10.0
          assert len(target['points'])==11 and sum(p.get('controlType')=='AIP' for p in target['points'])==7
          c=next(x for x in index if x['page']==561)
          assert c['airport']=='OIMB' and c['category']=='Airport' and c['chart_number']=='10-9'
          assert manifest['airports']['OIMB']['global_pages'][c['pdf_page']-1]==561
          assert not any(int(item['page'])==561 for item in current['charts']),'Never replace a live georeference'
          modified=copy.deepcopy(current)
          modified['charts'].append(target)
          modified['testOnly']='Birjand OIMB ADC 561 provisional test; NOT FOR ACTUAL NAVIGATION'
          (root/'chart-georef.json').write_text(json.dumps(modified,ensure_ascii=False,indent=2)+'\n')
          gradle=Path('app/build.gradle.kts')
          code=gradle.read_text()
          key='applicationId = "com.tareghmsr.jeppiran"'
          assert code.count(key)==1
          gradle.write_text(code.replace(key,'applicationId = "com.tareghmsr.jeppiran.birjandqa"'))
          axml=Path('app/src/main/AndroidManifest.xml')
          manifest_xml=axml.read_text()
          assert 'android:label="JeppIran"' in manifest_xml
          axml.write_text(manifest_xml.replace('android:label="JeppIran"','android:label="JEPPIRAN BIRJAND QA"'))
          f=Path('app/src/main/java/com/tareghmsr/jeppiran/ChartGeoreference.kt')
          src=f.read_text()
          needle='"single_axis_plus_conformal_scale"'
          assert src.count(needle)==1
          f.write_text(src.replace(needle,needle+',\n            "aip_and_printed_grid_10m_test_only"'))
          (root/'BIRJAND_ADC_QA_ONLY.txt').write_text('EXPERIMENTAL OIMB ADC page561. 10m provisional threshold, NOT FOR ACTUAL NAVIGATION.\n')
          print('Isolated test prepared: one OIMB ADC, no other georef/FSX/X-Plane changes')
          PY
      - name: Run tests and assemble Birjand isolated APK
        env:
          JEPPIRAN_VERSION_NAME: V2621-OIMB-QA1
          JEPPIRAN_VERSION_CODE: 2621561
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Verify signed APK and separate application ID
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "package: name='com.tareghmsr.jeppiran.birjandqa'"
          cp "$apk" JEPPIRAN-BIRJAND-ADC-QA-V2621.apk
      - name: Publish isolated test prerelease (never replace production APK)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=jeppiran-birjand-adc-qa-v2621-1
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --prerelease \
              --title "JEPPIRAN Birjand OIMB ADC TEST only V2621" \
              --notes "Separately installable test application ID com.tareghmsr.jeppiran.birjandqa. Only source page 561 OIMB ADC has provisional AIP 10m GCP georeference. Existing production georef and FSX/X-Plane bridges unchanged. Not for actual navigation."
          gh release upload "$tag" JEPPIRAN-BIRJAND-ADC-QA-V2621.apk web/data/birjand-adc-v2621-qa.json --clobber
          gh release view "$tag" --json assets --jq '.assets[].name'
      - uses: actions/upload-artifact@v4
        with:
          name: JEPPIRAN-BIRJAND-ADC-QA-V2621
          path: JEPPIRAN-BIRJAND-ADC-QA-V2621.apk
          retention-days: 30
