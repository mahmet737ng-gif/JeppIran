name: V2621 owner landmark georeference diagnosis (OIII frozen)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-landmark-georef-11.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyMuPDF==1.26.6' 'numpy==2.3.5'
      - run: python scripts/diagnose_owner_landmark_georef.py
      - run: python scripts/calculate_owner_landmark_georef.py
      - name: Publish quantitative QA report only (no unvalidated georefs)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B qa-owner-landmarks origin/main
          python scripts/calculate_owner_landmark_georef.py
          git add docs/georeferencing/V2621_OWNER_11_LANDMARK_QA.json
          git diff --cached --quiet || (git commit -m 'qa(georef): publish original PDF anchored validation results without OIII modification' && git push origin HEAD:main)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jeppiran-11-owner-source-landmark-qa
          path: /tmp/jeppiran-owner11-landmark-diagnostic.json
          if-no-files-found: ignore
