name: V2621 owner landmark georeference diagnosis (OIII frozen)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-landmark-georef-11.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyMuPDF==1.26.6'
      - run: python scripts/diagnose_owner_landmark_georef.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jeppiran-11-owner-source-landmark-qa
          path: /tmp/jeppiran-owner11-landmark-diagnostic.json
          if-no-files-found: ignore
