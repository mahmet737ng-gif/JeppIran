name: Deploy iPad Web App
# V2621 additive non-OIII georeference refresh. Preserve every OIII/Mehrabad reference and locked chart UI.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/offline-auto-sync.test.cjs'
      - 'tests/profile-clocks-validity.test.cjs'
      - 'tests/home-navigation-v2621.test.cjs'
      - 'tests/chart-display-names-v2621.test.cjs'
      - 'tests/airport-chart-audit-v2621.test.cjs'
      - 'scripts/verify_new20_public_web.cjs'
      - 'scripts/verify_airport_carousel_r3_browser.cjs'
      - 'scripts/verify_airport_carousel_real_browser.cjs'
      - 'scripts/verify_ipad_chart_category_swipe.cjs'
      - 'tests/airport-briefings-prefetch-v2621.test.cjs'
      - 'web/airport-briefings-preload.js'
      - 'web/notam-service.js'
      - 'web/preview/airport-carousel-r13-fixed/**'
      - 'web/data/chart-briefing-titles-v2621.json'
      - 'scripts/build_carousel_chart_previews.py'
      - 'scripts/build_chart_point_search_index.py'
      - 'web/preview/airport-carousel-r13-fixed/**'
      - 'scripts/verify_notam_profile_zoom_browser.cjs'
      - 'scripts/verify_profile_validity_browser.cjs'
      - 'scripts/verify_chart_swipes_browser.cjs'
      - 'scripts/build_offline_manifest.py'
      - 'scripts/georef_preservation.py'
      - 'tests/test_georef_preservation.py'
      - 'scripts/build_oiie_*.py'
      - 'scripts/verify_oiie_runway_axes_browser.cjs'
      - 'scripts/build_web_admin_test.py'
      - 'scripts/admin-test-controls.js'
      - 'scripts/admin-qa-home.js'
      - 'scripts/admin-qa-home.css'
      - 'scripts/verify_admin_home_browser.cjs'
      - 'tests/admin-qa-preview.test.cjs'
      - 'scripts/build_airport_profiles.py'
      - 'scripts/build_airport_runways.py'
      - 'app/src/main/assets/airport-runways.json'
      - 'app/src/main/assets/charts-current.json'
      - 'app/src/main/assets/charts-manifest.json'
      - 'app/src/main/assets/enroute-manifest.json'
      - 'app/src/main/assets/chart-georef.json'
      - 'app/src/main/assets/chart-changes.json'
      - 'app/src/main/assets/changed-airports.json'
      - 'app/src/main/res/drawable-nodpi/airport_card_*.webp'
      - '.github/workflows/deploy-ipad-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel a nearly completed Pages deployment when unrelated chart/QA
# commits arrive; queue the newest pending run instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Ensure OICI 207/209 georeferencing remains disabled before release
        run: |
          node --check web/app.js
          node --check web/oici-route-only-v2621.mjs
          node --test tests/oici-route-only-v2621.test.cjs

      - name: Block Web publication if ANY approved georeference disappeared or changed
        run: |
          python3 -m unittest discover -s tests -p 'test_georef_preservation.py'
          python3 scripts/georef_preservation.py --baseline-ref HEAD^

      - name: Validate LTFM TAXI connector topology (simulator QA)
        run: node scripts/test_ltfm_unnamed_connectors.cjs

      - name: Enforce owner-locked CDFA layout
        run: node --test tests/cdfa-ui-locked-v2621.test.cjs

      - name: Enforce owner-locked iPad chart gestures and appearance
        run: node --test tests/ipad-chart-ui-locked-v2621.test.cjs

      - name: Check Charts Back navigation and fullscreen Home removal
        run: node --test tests/home-navigation-v2621.test.cjs

      - name: Verify 78-airport METAR/NOTAM startup cache and approved display names
        run: |
          node --check web/airport-briefings-preload.js
          node --check web/notam-service.js
          node --check web/preview/airport-carousel-r13-fixed/app.js
          node --test tests/airport-briefings-prefetch-v2621.test.cjs

      - name: Verify exact V2621 apron and airport ground plate display-only names
        run: node --test tests/chart-display-names-v2621.test.cjs

      - name: Verify 10 airport chart corrections retain original chart sources
        run: node --test tests/airport-chart-audit-v2621.test.cjs

      - name: Verify airport UTC/local clocks and terminal/enroute currency safeguards
        run: |
          node --check web/app.js
          node --test tests/profile-clocks-validity.test.cjs
          node --test tests/chart-airport-profiles.test.cjs

      - name: Enforce owner-locked aircraft marker and constant screen size
        run: node --test tests/aircraft-marker-locked.test.cjs

      - name: Verify aircraft marker size in Chrome before publishing
        run: |
          npm install --prefix "$RUNNER_TEMP/jeppiran-browser-qa" --no-audit --no-fund --package-lock=false playwright@1.58.2
          export NODE_PATH="$RUNNER_TEMP/jeppiran-browser-qa/node_modules"
          export JEPPIRAN_CHROME_BIN="$(command -v google-chrome)"
          test -n "$JEPPIRAN_CHROME_BIN"
          node scripts/verify_aircraft_marker_browser.cjs
          node scripts/verify_airport_carousel_browser.cjs
          node scripts/verify_airport_carousel_r2_browser.cjs
          node scripts/verify_airport_carousel_r3_browser.cjs
          node scripts/verify_airport_carousel_r4_browser.cjs
          node scripts/verify_airport_carousel_r5_classic_browser.cjs
          node scripts/verify_classic_charts_default_browser.cjs

      - name: Verify additive OICK V2 source georeferencing
        run: node --test web/tests/oick-v2-georef.test.cjs

      - name: Verify OIGG STAR source-locked flight QA
        run: node --test web/tests/oigg-star-flightqa.test.cjs

      - name: Test three new OIIE original-PDF SID/ILS simulator geometries
        run: node --test web/tests/oiie-missing-sid-ils-flightqa.test.cjs

      - name: Verify locked Ahwaz-style airport profile layout for all airports
        run: node --test web/tests/approved-airport-profile-layout.test.cjs

      - name: Validate METAR flight-rule category thresholds and safe unknown state
        run: node --test web/tests/metar-flight-categories.test.cjs

      - name: Verify owner-approved profile images fit without cropping
        run: node --test web/tests/airport-profile-poster-fit.test.cjs

      - name: Validate runway length and width from Jeppesen Airport Information for all 78 airports
        run: node --test web/tests/airport-runway-dimensions.test.cjs

      - name: Verify reversible OIII side-panel experiment
        run: node --test web/tests/airport-profile-side-panel-experiment.test.cjs

      - name: Verify OIII floating information-bar experiment and rollback isolation
        run: |
          node --check web/airport-profile-topbar-experiment.js
          node --test web/tests/airport-profile-topbar-experiment.test.cjs

      - name: Verify all owner-locked airport profile poster hashes when installed
        run: python3 scripts/verify_owner_locked_profile_posters.py

      - name: Build 50 text-free airport poster DISPLAY images from immutable sources
        run: |
          python3 -m pip install --break-system-packages --disable-pip-version-check Pillow==11.3.0 opencv-python-headless==4.11.0.86
          python3 scripts/build_textfree_airport_posters.py
          python3 scripts/build_textfree_airport_posters.py --check

      - name: Verify all twenty newly published poster WebPs against SHA256 manifest
        run: node --test web/tests/new20-posters-integrity.test.cjs

      - name: Validate all 13 approved V3 city/airport composites
        run: node --test web/tests/airport-poster-v3-assets.test.cjs

      - name: Build SHA-versioned poster cache registry for current images
        run: python3 scripts/build_airport_poster_precache_manifest.py

      - name: Check new twenty approved decorative airport assignments and old image locks
        run: node --test web/tests/new20-profile-assignment.test.cjs

      - name: Verify Saqez identity and persistent poster download contract
        run: node --test web/tests/airport-poster-offline-cache.test.cjs

      - name: Enforce fixed full poster viewport for all 50 airport profiles
        run: node --test web/tests/airport-profile-viewport-fit.test.cjs

      - name: Validate live vector-clear poster text
        run: node --test web/tests/live-airport-poster-caption.test.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare synchronized web assets
        run: |
          mkdir -p web/data web/airport-images web/charts web/vendor
          cp app/src/main/assets/charts-current.json web/data/charts-current.json
          cp app/src/main/assets/charts-manifest.json web/data/charts-manifest.json
          cp app/src/main/assets/enroute-manifest.json web/data/enroute-manifest.json
          cp app/src/main/assets/chart-georef.json web/data/chart-georef.json
          cp app/src/main/assets/chart-changes.json web/data/chart-changes.json
          cp app/src/main/assets/changed-airports.json web/data/changed-airports.json
          python3 scripts/build_airport_profiles.py --output web/data/airport-profiles.json
          python3 scripts/build_airport_runways.py --output web/data/airport-runways.json
          cp app/src/main/res/drawable-nodpi/airport_card_*.webp web/airport-images/
          curl -fL --retry 4 --retry-all-errors https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs -o web/vendor/pdf.min.mjs
          curl -fL --retry 4 --retry-all-errors https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs -o web/vendor/pdf.worker.min.mjs

          python3 - <<'PY'
          import json
          import pathlib
          import shutil
          import time
          import urllib.request

          manifest_path = pathlib.Path("app/src/main/assets/charts-manifest.json")
          out_dir = pathlib.Path("web/charts")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          downloaded = 0
          total_bytes = 0
          for icao, info in manifest.get("airports", {}).items():
              url = info.get("url")
              filename = info.get("file") or f"{icao}.pdf"
              if not url:
                  raise RuntimeError(f"No chart URL for {icao}")

              target = out_dir / filename
              print(f"Downloading {icao}: {filename}")
              last_error = None

              for attempt in range(1, 5):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "JEPPIRAN-Pages-Builder/1.0"}
                      )
                      with urllib.request.urlopen(req, timeout=120) as src, target.open("wb") as dst:
                          shutil.copyfileobj(src, dst)
                      if target.stat().st_size < 1024:
                          raise RuntimeError(f"Downloaded file is unexpectedly small: {target.stat().st_size} bytes")
                      downloaded += 1
                      total_bytes += target.stat().st_size
                      last_error = None
                      break
                  except Exception as exc:
                      last_error = exc
                      print(f"Attempt {attempt}/4 failed for {filename}: {exc}")
                      if target.exists():
                          target.unlink()
                      time.sleep(attempt * 2)

              if last_error is not None:
                  raise RuntimeError(f"Failed to download {filename}: {last_error}")

          print(f"Bundled {downloaded} airport PDFs ({total_bytes / 1048576:.1f} MiB).")
          PY

      - name: Generate lightweight previews for all 78 airports from real charts
        run: |
          python3 -m pip install --disable-pip-version-check pymupdf==1.26.5
          python3 scripts/build_carousel_chart_previews.py
          python3 scripts/build_carousel_chart_previews.py --verify

      - name: Index searchable published V2621 waypoints by exact PDF chart page
        run: |
          python3 scripts/build_chart_point_search_index.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          index=json.loads(Path("web/data/chart-point-index-v2621.json").read_text())
          charts=json.loads(Path("web/data/charts-current.json").read_text())
          valid={str(c["page"]) for c in charts}
          assert index["cycle"]=="2621"
          assert len(index["pages"])>100, "Too few searchable PDF pages"
          assert set(index["pages"]).issubset(valid), "Unmapped chart in fix search index"
          print("PASS waypoint search index",len(index["pages"]),"chart pages")
          PY

      - name: Verify real Carousel chart rendering and geometry after PDF generation
        run: |
          export NODE_PATH="$RUNNER_TEMP/jeppiran-browser-qa/node_modules"
          export JEPPIRAN_CHROME_BIN="$(command -v google-chrome)"
          node scripts/verify_airport_carousel_real_browser.cjs
          node scripts/verify_ipad_chart_category_swipe.cjs

      - name: Extract source-backed OIIE runway and apron geometry candidates
        run: |
          python3 -m pip install --disable-pip-version-check pymupdf==1.26.5 shapely==2.1.2 networkx==3.5 scikit-image==0.25.2 scipy==1.16.2
          python3 scripts/build_oiie_pdf_ground_evidence.py \
            --pdf web/charts/OIIE.pdf \
            --output web/data/taxi-surveys/OIIE-native-vectors-v2621.json
          python3 scripts/build_oiie_page_portal_candidates.py \
            --source web/data/taxi-surveys/OIIE-native-vectors-v2621.json \
            --output web/data/taxi-surveys/OIIE-page-portal-candidates-v2621.json
          python3 scripts/build_oiie_real_source_ink_graph.py \
            --pdf web/charts/OIIE.pdf \
            --vectors web/data/taxi-surveys/OIIE-native-vectors-v2621.json \
            --out web/data/taxi-surveys/OIIE-source-ink-graph-v2621.json
          python3 scripts/build_oiie_apron_source_corridors.py \
            --pdf web/charts/OIIE.pdf \
            --vectors web/data/taxi-surveys/OIIE-native-vectors-v2621.json \
            --out web/data/taxi-surveys/OIIE-source-apron-corridors-v2621.json
          python3 scripts/build_oiie_passenger_source_corridors.py \
            --pdf web/charts/OIIE.pdf \
            --vectors web/data/taxi-surveys/OIIE-native-vectors-v2621.json \
            --out web/data/taxi-surveys/OIIE-source-passenger-corridors-v2621.json
          python3 scripts/build_oiie_adc_pavement_islands.py \
            --pdf web/charts/OIIE.pdf \
            --out web/data/taxi-surveys/OIIE-adc-pavement-islands-v2621.json
          python3 scripts/build_oiie_runway_axes.py \
            --pdf web/charts/OIIE.pdf \
            --output web/data/taxi-surveys/OIIE-runway-axes-v2621.json
          python3 scripts/build_oiie_stand_coordinates_qa.py \
            --pdf web/charts/OIIE.pdf \
            --output web/data/taxi-surveys/OIIE-stand-coordinate-audit-v2621.json
          python3 scripts/build_oiie_stand_label_georeg.py \
            --table web/data/taxi-surveys/OIIE-stand-coordinate-audit-v2621.json \
            --output web/data/taxi-surveys/OIIE-stand-label-registration-v2621.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('web/data/taxi-surveys/OIIE-native-vectors-v2621.json')
          data=json.loads(p.read_text())
          assert data['airport']=='OIIE' and data['cycle']=='2621'
          assert len(data['pages'])==3
          assert set(data['pages']['383']['regions'])=={'CARGO','SALAM'}
          assert data['verifiedTaxiEdges']==data['verifiedRunwayGates']==0
          ink=json.loads(Path('web/data/taxi-surveys/OIIE-source-ink-graph-v2621.json').read_text())
          assert ink['sourceMatchedStandCount']==103
          assert ink['regions']['CARGO']['directedInkConnected']==420
          assert ink['regions']['SALAM']['directedInkConnected']==380
          assert ink['regions']['PASSENGER']['directedInkConnected']==3660
          assert ink['approvedPhysicalTaxiRoutes']==0 and ink['routeable']==False
          curved=json.loads(Path('web/data/taxi-surveys/OIIE-source-apron-corridors-v2621.json').read_text())
          assert curved['directedOriginalCurvedCorridorCases']==800
          assert len(curved['sourceCorridors']['CARGO']['routes'])==420
          assert len(curved['sourceCorridors']['SALAM']['routes'])==380
          assert curved['approvedADCPagePortals']==curved['approvedRunwayHoldShorts']==0
          assert curved['readyForFullAirportRouting'] is False
          passenger=json.loads(Path('web/data/taxi-surveys/OIIE-source-passenger-corridors-v2621.json').read_text())
          assert passenger['originalAirportPdfSha256']==data['inputPdfSha256']
          assert passenger['sourceMatchedStandCount']==62
          assert passenger['sourceCorridorConnectedStandCount']==59
          assert passenger['unmatchedStandIds']==['ST403','ST405','ST407']
          assert passenger['directedOriginalCurvedCorridorCases']==3422
          assert passenger['approvedPagePortals']==passenger['approvedRunwayHoldShorts']==0
          assert not passenger['readyForFullAirportRouting']
          islands=json.loads(Path("web/data/taxi-surveys/OIIE-adc-pavement-islands-v2621.json").read_text())
          assert islands['distinctApronIslandIds']['PASSENGER']==islands['distinctApronIslandIds']['CARGO']
          assert islands['distinctApronIslandIds']['SALAM']!=islands['distinctApronIslandIds']['CARGO']
          assert islands['approvedCrossRunwayLinks']==0 and islands['publishedRunwayCrossingPermissionRequired']
          assert not data['allowNavigation']
          seam=json.loads(Path("web/data/taxi-surveys/OIIE-page-portal-candidates-v2621.json").read_text())
          assert seam["approvedPhysicalPortals"]==0 and not seam["allowAutomaticTaxiRouting"]
          assert seam["candidateCount"]>0
          axis=json.loads(Path('web/data/taxi-surveys/OIIE-runway-axes-v2621.json').read_text())
          assert [r['physicalId'] for r in axis['runways']]==['11L_29R','11R_29L']
          assert all(r['physicalRunwayAxisVerified'] and r['relativeLengthErrorPct']<1 for r in axis['runways'])
          assert axis['approvedStandRunwayRoutes']==axis['approvedRunwayGates']==0
          assert not axis['safeForNavigation']
          table=json.loads(Path('web/data/taxi-surveys/OIIE-stand-coordinate-audit-v2621.json').read_text())
          assert table['entryCount']==49 and not table['suitableForStandNoseRouting']
          assert sum(i['code']=='PRINTED_CARGO_LONGITUDE_CONFLICTS_WITH_20_9C_GRID' for i in table['issues'])==4
          labels=json.loads(Path('web/data/taxi-surveys/OIIE-stand-label-registration-v2621.json').read_text())
          assert labels['count']==103 and labels['approvedStandRoutes']==0
          assert set(['ST301','ST302','ST303','ST321']).issubset(labels['suspectPublishedINSStandIds'])
          assert all(not e['sourcePointIsParkingNose'] and not e['routeable'] for e in labels['positions'])
          print('PASS native source evidence generated (NO unreviewed route promotion)')
          PY

      - name: Verify native two-way runway-only route contract
        run: node web/tests/taxi-oiie-runway-axes.test.cjs web/data/taxi-surveys/OIIE-runway-axes-v2621.json
      - name: Verify all 20 newly assigned poster images actually render in airport profiles in real Chrome
        run: |
          export NODE_PATH="$RUNNER_TEMP/jeppiran-browser-qa/node_modules"
          export JEPPIRAN_CHROME_BIN="$(command -v google-chrome)"
          node scripts/verify_new20_profile_browser.cjs

      - name: Verify city landmarks and text-free poster header for sample airports in Chrome
        run: |
          export NODE_PATH="$RUNNER_TEMP/jeppiran-browser-qa/node_modules"
          export JEPPIRAN_CHROME_BIN="$(command -v google-chrome)"
          node scripts/verify_profile_scenery_browser.cjs
          node scripts/verify_notam_profile_zoom_browser.cjs

      - name: Verify visible airport chart validity in real Chrome
        run: |
          export NODE_PATH="$RUNNER_TEMP/jeppiran-browser-qa/node_modules"
          export JEPPIRAN_CHROME_BIN="$(command -v google-chrome)"
          node scripts/verify_profile_validity_browser.cjs

      - name: Verify reversible chart swipes and live finger-follow transition in real Chrome
        run: |
          export NODE_PATH="$RUNNER_TEMP/jeppiran-browser-qa/node_modules"
          export JEPPIRAN_CHROME_BIN="$(command -v google-chrome)"
          node scripts/verify_chart_swipes_browser.cjs

      - name: Verify OIIE runway-only routes and locked-out stand gates in real Chrome
        run: |
          export NODE_PATH="$RUNNER_TEMP/jeppiran-browser-qa/node_modules"
          export JEPPIRAN_CHROME_BIN="$(command -v google-chrome)"
          node scripts/verify_oiie_runway_axes_browser.cjs

      - name: Validate offline PWA scripts
        run: |
          node --check web/offline-manager.js
          node --check web/service-worker.js
          node --test tests/offline-auto-sync.test.cjs

      - name: Generate complete on-device offline package
        run: python3 scripts/build_offline_manifest.py

      - name: Verify offline package before publication
        run: python3 scripts/build_offline_manifest.py --check

      - name: Build isolated Admin QA test website
        run: |
          python3 scripts/build_web_admin_test.py
          node --check web/admin-console/admin-test-controls.js
          node --check web/admin-console/admin-qa-home.js
          node --test tests/admin-qa-preview.test.cjs
          node --check web/admin-console/app.js
          node --check web/admin-console/offline-manager.js
          node --check web/admin-console/service-worker.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import unquote
          d=Path("web/admin-console")
          m=json.loads((d/"offline-assets.json").read_text())
          assert m["pdfs"] and len(m["pdfs"]) >= 70
          assert all((d/unquote(x["url"][2:])).exists() for x in m["assets"]+m["pdfs"] if x["url"] != "./")
          assert 'JEPPIRAN_TEST_ADMIN = true' in (d/"index.html").read_text()
          assert d.name=="admin-console"
          assert 'admin-test-controls.js' in (d/"index.html").read_text()
          assert 'admin-qa-home.js?v=2' in (d/"index.html").read_text()
          assert 'admin-qa-home.css?v=2' in (d/"index.html").read_text()
          assert 'id="adminQaHomeBtn"' in (d/"admin-qa-home.js").read_text() or 'tile.id="adminQaHomeBtn"' in (d/"admin-qa-home.js").read_text()
          assert 'key.startsWith("jeppiran-test-pwa-")' in (d/"service-worker.js").read_text()
          assert 'key.startsWith("jeppiran-pwa-")' in Path("web/service-worker.js").read_text()
          assert 'jeppiran-test-offline-meta-v2' in (d/"offline-manager.js").read_text()
          print("Admin QA preview is isolated, includes all charts, and passes smoke checks.")
          PY

      - name: Verify Admin dashboard with real Chrome
        run: |
          export NODE_PATH="$RUNNER_TEMP/jeppiran-browser-qa/node_modules"
          export JEPPIRAN_CHROME_BIN="$(command -v google-chrome)"
          node scripts/verify_admin_home_browser.cjs

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
          name: jeppiran-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: jeppiran-pages-${{ github.run_id }}-${{ github.run_attempt }}
          # Github Pages sometimes stays in updating_pages >10m despite
          # successful package upload; avoid the action's 600000ms default abort.
          timeout: 1200000

      - name: Smoke-test live GitHub Pages — every new poster and profile mapping
        env:
          JEPPIRAN_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify_new20_public_web.cjs

