name: Deploy iPad Web App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-ipad-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare synchronized web assets
        run: |
          mkdir -p web/data web/airport-images
          cp app/src/main/assets/charts-current.json web/data/charts-current.json
          cp app/src/main/assets/charts-manifest.json web/data/charts-manifest.json
          cp app/src/main/assets/chart-georef.json web/data/chart-georef.json
          cp app/src/main/res/drawable-nodpi/airport_card_*.webp web/airport-images/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
