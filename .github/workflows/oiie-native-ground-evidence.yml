name: OIIE Native Ground Geometry Extraction QA
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_oiie_pdf_ground_evidence.py"
      - "scripts/build_oiie_runway_axes.py"
      - "scripts/build_oiie_stand_coordinates_qa.py"
      - "scripts/build_oiie_stand_label_georeg.py"
      - "scripts/build_oiie_page_portal_candidates.py"
      - "web/taxi-oiie-stages456.js"
      - "web/tests/taxi-oiie-runway-axes.test.cjs"
      - ".github/workflows/oiie-native-ground-evidence.yml"
permissions:
  contents: read
jobs:
  source-extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native PDF vector parser
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.5
      - name: Download matching V2621 Imam airport chart PDF
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,urllib.request
          m=json.loads(pathlib.Path("app/src/main/assets/charts-manifest.json").read_text())
          assert str(m["cycle"])=="2621"
          info=m["airports"]["OIIE"]
          u=info["url"]
          req=urllib.request.Request(u,headers={"User-Agent":"JEPPIRAN-OIIE-Source-QA"})
          with urllib.request.urlopen(req,timeout=120) as r:
              b=r.read()
          assert hashlib.sha256(b).hexdigest()==info["sha256"],"OIIE PDF source hash mismatch"
          pathlib.Path("/tmp/OIIE.pdf").write_bytes(b)
          print("Verified V2621 airport PDF",len(b),"bytes")
          PY
      - name: Extract page-specific original vector geometry
        run: python scripts/build_oiie_pdf_ground_evidence.py --pdf /tmp/OIIE.pdf --output /tmp/oiie-v2621-native-evidence.json
      - name: Generate PDF seam candidates between independent OIIE regions
        run: python scripts/build_oiie_page_portal_candidates.py --source /tmp/oiie-v2621-native-evidence.json --output /tmp/oiie-v2621-portal-candidates.json
      - name: Require unreviewed portal candidates to remain non-routeable
        run: |
          python - <<'PY'
          import json
          d=json.load(open("/tmp/oiie-v2621-portal-candidates.json"))
          assert d["candidateCount"]>0 and d["approvedPhysicalPortals"]==0
          assert not d["allowAutomaticTaxiRouting"]
          assert all(not c["physicalContactReviewed"] and not c["legalTaxiPortal"] for c in d["candidates"])
          print("PASS source endpoint seam candidate isolation")
          PY
      - name: Verify original OIIE runway polygon axes against published lengths
        run: python scripts/build_oiie_runway_axes.py --pdf /tmp/OIIE.pdf --output /tmp/oiie-v2621-runway-axes.json
      - name: Verify native two-way runway-only route contract
        run: node web/tests/taxi-oiie-runway-axes.test.cjs /tmp/oiie-v2621-runway-axes.json
      - name: Assert only the two runway axes pass QA
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/oiie-v2621-runway-axes.json'))
          assert [r['physicalId'] for r in d['runways']]==['11L_29R','11R_29L']
          assert all(r['physicalRunwayAxisVerified'] and r['relativeLengthErrorPct']<1 for r in d['runways'])
          assert d['approvedStandRunwayRoutes']==0 and d['approvedRunwayGates']==0
          assert not d['safeForNavigation'] and not d['holdShortPositionSurveyed']
          print('PASS two PDF-native, dimensional-reviewed runway axes; no false taxi entries')
          PY
      - name: Parse published OIIE stand coordinate groups and flag Cargo conflicts
        run: python scripts/build_oiie_stand_coordinates_qa.py --pdf /tmp/OIIE.pdf --output /tmp/oiie-v2621-stand-coordinate-audit.json
      - name: Cross-reference all 103 original chart stand labels to regional grids
        run: |
          python scripts/build_oiie_stand_label_georeg.py \
            --table /tmp/oiie-v2621-stand-coordinate-audit.json \
            --output /tmp/oiie-v2621-stand-label-registration.json
      - name: Check chart label georeg does not imply actual stand nose position
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/oiie-v2621-stand-label-registration.json'))
          assert d['count']==103 and len(d['positions'])==103
          assert d['reviewedStandLeadCount']==d['approvedStandRoutes']==0
          assert set(['ST301','ST302','ST303','ST321']).issubset(d['suspectPublishedINSStandIds'])
          assert all(not x['sourcePointIsParkingNose'] and not x['routeable'] for x in d['positions'])
          print("PASS: original 103 stand labels georeferenced without inferred stand leads")
          PY
      - name: Verify printed table remains separate from individual stand nose routing
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/oiie-v2621-stand-coordinate-audit.json'))
          assert d["entryCount"]==49 and d["suitableForStandNoseRouting"] is False
          assert d["autoCorrectCargoTypographicValues"] is False
          assert sum(i["code"]=="PRINTED_CARGO_LONGITUDE_CONFLICTS_WITH_20_9C_GRID" for i in d["issues"])==4
          assert all(e["unverifiedStandNose"] for e in d["entries"])
          print("PASS: source-rounded stand coordinate groups do not become routeable nodes")
          PY
      - name: Reject false automatically approved centerlines and runway gates
        run: |
          python - <<'PY'
          import json
          s=json.load(open('/tmp/oiie-v2621-native-evidence.json'))
          assert s['airport']=='OIIE' and s['cycle']=='2621'
          assert len(s['pages'])==3 and all(s['pages'][p]['candidateVectorStrokes']>100 for p in ('380','382','383'))
          assert set(s['pages']['383']['regions'])=={'CARGO','SALAM'}
          assert s['verifiedTaxiEdges']==s['verifiedRunwayGates']==0
          assert not s['allowNavigation'] and not s['allowAutomaticRoutePromotion']
          print("PASS source-native extraction: 3 pages, four independent regions, 0 unsafely approved routes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: OIIE-V2621-native-geometry-review
          path: |
            /tmp/oiie-v2621-native-evidence.json
            /tmp/oiie-v2621-portal-candidates.json
            /tmp/oiie-v2621-runway-axes.json
            /tmp/oiie-v2621-stand-coordinate-audit.json
            /tmp/oiie-v2621-stand-label-registration.json
          retention-days: 14
