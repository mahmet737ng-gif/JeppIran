name: Android R8 fresh bundle cache QA

on:
  push:
    branches: [feature/android-r8-refresh-assets]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-android-r7:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Bundle local WebView assets from the real application sources
        run: |
          node --check web/app.js
          node --check web/preview/airport-carousel-r5/app.js
          grep -q 'last_apk_version' app/src/main/java/com/tareghmsr/jeppiran/MobileWebActivity.kt
          grep -q 'Cache-Control' app/src/main/java/com/tareghmsr/jeppiran/MobileWebActivity.kt
          python3 scripts/build_android_local_web.py
          python3 scripts/build_android_local_web.py --verify-only
      - name: Test production-package Android mode in headless Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/jeppiran-r7-browser" --no-audit --no-fund --package-lock=false playwright@1.58.2
          export NODE_PATH="$RUNNER_TEMP/jeppiran-r7-browser/node_modules"
          export JEPPIRAN_CHROME_BIN="$(command -v google-chrome)"
          node scripts/verify_android_r7_connected_browser.cjs
          node scripts/verify_airport_carousel_r5_classic_browser.cjs
      - name: Build test-signed production-identifier APK, no release
        env:
          JEPPIRAN_VERSION_CODE: '262565'
          JEPPIRAN_VERSION_NAME: '29.4-qa'
        run: |
          gradle testDebugUnitTest assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Publish QA APK as isolated workflow artifact, never an app update
        uses: actions/upload-artifact@v4
        with:
          name: JeppIran-R8-Fresh-Bundle-QA-Only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 10
