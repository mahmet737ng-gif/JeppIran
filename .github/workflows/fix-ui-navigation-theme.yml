name: Fix UI Navigation Theme and Airport Names

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix application UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re


          ROOT = Path(
              "app/src/main/java/com/tareghmsr/jeppiran"
          )


          MAIN_FILE = ROOT / "MainActivity.kt"
          CHARTS_FILE = ROOT / "ChartsActivity.kt"
          AIRPORT_FILE = ROOT / "AirportChartsActivity.kt"
          VIEWER_FILE = ROOT / "PdfViewerActivity.kt"
          SETTINGS_FILE = ROOT / "SettingsActivity.kt"
          SPLASH_FILE = ROOT / "SplashActivity.kt"
          REPOSITORY_FILE = ROOT / "ChartRepository.kt"


          ACTIVITY_FILES = [
              MAIN_FILE,
              CHARTS_FILE,
              AIRPORT_FILE,
              VIEWER_FILE,
              SETTINGS_FILE,
              SPLASH_FILE,
          ]


          def read(path):
              return path.read_text(
                  encoding="utf-8"
              )


          def write(path, value):
              path.write_text(
                  value,
                  encoding="utf-8"
              )


          def ensure_import(
              value,
              import_line,
              anchor
          ):
              if import_line in value:
                  return value

              if anchor not in value:
                  raise SystemExit(
                      "Import anchor not found: "
                      + anchor
                  )

              return value.replace(
                  anchor,
                  import_line + "\n" + anchor,
                  1
              )


          print("=" * 70)
          print("JEPPIRAN UI FIX")
          print("=" * 70)


          # ==================================================
          # 1. Convert Activities to AppCompatActivity
          # ==================================================

          for path in ACTIVITY_FILES:
              value = read(path)

              value = value.replace(
                  "import androidx.activity.ComponentActivity",
                  "import androidx.appcompat.app.AppCompatActivity"
              )

              value = re.sub(
                  r"\bComponentActivity\(\)",
                  "AppCompatActivity()",
                  value
              )

              write(
                  path,
                  value
              )

              print(
                  "Activity fixed:",
                  path.name
              )


          # ==================================================
          # 2. Make Splash use the saved theme
          # ==================================================

          value = read(
              SPLASH_FILE
          )

          if "ThemeManager.apply(" not in value:
              marker = (
                  "    override fun onCreate(\n"
                  "        savedInstanceState: Bundle?\n"
                  "    ) {\n"
              )

              if marker not in value:
                  raise SystemExit(
                      "Splash onCreate marker not found."
                  )

              insertion = (
                  marker
                  + "\n"
                  + "        ThemeManager.apply(\n"
                  + "            this\n"
                  + "        )\n"
              )

              value = value.replace(
                  marker,
                  insertion,
                  1
              )

              write(
                  SPLASH_FILE,
                  value
              )

              print(
                  "Splash theme initialization added."
              )
          else:
              print(
                  "Splash theme initialization already exists."
              )


          # ==================================================
          # 3. Fix AirportChartsActivity double-parent issue
          # ==================================================

          value = read(
              AIRPORT_FILE
          )

          start_marker = (
              "        portraitCategoryScroll ="
          )

          end_marker = (
              "        if (\n"
              "            landscape\n"
              "        ) {"
          )

          start_index = value.find(
              start_marker
          )

          if start_index < 0:
              raise SystemExit(
                  "Airport category scroll block not found."
              )

          end_index = value.find(
              end_marker,
              start_index
          )

          if end_index < 0:
              raise SystemExit(
                  "Airport landscape marker not found."
              )

          replacement_lines = [
              "        val landscape =",
              "            resources.configuration.orientation ==",
              "                Configuration.ORIENTATION_LANDSCAPE",
              "",
              "",
              "        if (",
              "            landscape",
              "        ) {",
              "",
              "            landscapeCategoryScroll =",
              "                ScrollView(",
              "                    this",
              "                ).apply {",
              "",
              "                    isVerticalScrollBarEnabled =",
              "                        false",
              "",
              "                    overScrollMode =",
              "                        ScrollView.OVER_SCROLL_IF_CONTENT_SCROLLS",
              "",
              "                    addView(",
              "                        categoryContainer,",
              "                        ViewGroup.LayoutParams(",
              "                            ViewGroup.LayoutParams.MATCH_PARENT,",
              "                            ViewGroup.LayoutParams.WRAP_CONTENT",
              "                        )",
              "                    )",
              "                }",
              "",
              "        } else {",
              "",
              "            portraitCategoryScroll =",
              "                HorizontalScrollView(",
              "                    this",
              "                ).apply {",
              "",
              "                    isHorizontalScrollBarEnabled =",
              "                        false",
              "",
              "                    overScrollMode =",
              "                        HorizontalScrollView.OVER_SCROLL_IF_CONTENT_SCROLLS",
              "",
              "                    addView(",
              "                        categoryContainer,",
              "                        ViewGroup.LayoutParams(",
              "                            ViewGroup.LayoutParams.WRAP_CONTENT,",
              "                            ViewGroup.LayoutParams.MATCH_PARENT",
              "                        )",
              "                    )",
              "                }",
              "        }",
              "",
          ]

          replacement = "\n".join(
              replacement_lines
          )

          value = (
              value[:start_index]
              + replacement
              + value[end_index:]
          )

          write(
              AIRPORT_FILE,
              value
          )

          print(
              "Airport double-parent setup fixed."
          )


          # ==================================================
          # 4. Fix airport names
          # ==================================================

          value = read(
              REPOSITORY_FILE
          )


          airport_names = {
              "LTFM": ("ISTANBUL AIRPORT", "ISTANBUL"),
              "OIAA": ("ABADAN AIRPORT", "ABADAN"),
              "OIAM": ("MAHSHAHR AIRPORT", "MAHSHAHR"),
              "OIAW": ("AHWAZ AIRPORT", "AHWAZ"),
              "OIBB": ("BUSHEHR AIRPORT", "BUSHEHR"),
              "OIBK": ("KISH ISLAND", "KISH ISLAND"),
              "OIBP": ("ASALOUYEH AIRPORT", "ASALOUYEH"),
              "OICC": ("KERMANSHAH AIRPORT", "KERMANSHAH"),
              "OICI": ("ILAM AIRPORT", "ILAM"),
              "OIFM": ("ISFAHAN AIRPORT", "ISFAHAN"),
              "OIGG": ("RASHT AIRPORT", "RASHT"),
              "OIHH": ("HAMADAN AIRPORT", "HAMADAN"),
              "OIIE": ("IMAM KHOMEINI INTERNATIONAL", "TEHRAN"),
              "OIII": ("MEHRABAD INTERNATIONAL", "TEHRAN"),
              "OIIP": ("KARAJ AIRPORT", "KARAJ"),
              "OIKK": ("KERMAN AIRPORT", "KERMAN"),
              "OIMB": ("BIRJAND AIRPORT", "BIRJAND"),
              "OIMM": ("MASHHAD INTERNATIONAL", "MASHHAD"),
              "OIMN": ("BOJNURD AIRPORT", "BOJNURD"),
              "OIMS": ("SABZEVAR AIRPORT", "SABZEVAR"),
              "OING": ("GORGAN AIRPORT", "GORGAN"),
              "OINZ": ("SARI AIRPORT", "SARI"),
              "OISS": ("SHIRAZ INTERNATIONAL", "SHIRAZ"),
              "OITL": ("ARDABIL AIRPORT", "ARDABIL"),
              "OITR": ("URMIA AIRPORT", "URMIA"),
              "OITT": ("TABRIZ INTERNATIONAL", "TABRIZ"),
              "OIYY": ("YAZD AIRPORT", "YAZD"),
              "OIZC": ("CHABAHAR AIRPORT", "CHABAHAR"),
              "OIZH": ("ZAHEDAN INTERNATIONAL", "ZAHEDAN"),
              "OMDB": ("DUBAI INTERNATIONAL", "DUBAI"),
              "OOMS": ("MUSCAT INTERNATIONAL", "MUSCAT"),
              "ORBI": ("BAGHDAD INTERNATIONAL", "BAGHDAD"),
              "ORNI": ("NAJAF INTERNATIONAL", "NAJAF"),
              "UDYZ": ("ZVARTNOTS INTERNATIONAL", "YEREVAN"),
              "UGSB": ("BATUMI INTERNATIONAL", "BATUMI"),
              "UGTB": ("TBILISI INTERNATIONAL", "TBILISI"),
          }


          for icao, (airport_name, city) in airport_names.items():

              pattern = re.compile(
                  r"""
                  AirportInfo\(
                      \s*"%s"\s*,\s*
                      "[^"]*"\s*,\s*
                      "[^"]*"\s*
                  \)
                  """
                  % re.escape(icao),
                  re.MULTILINE | re.VERBOSE
              )

              replacement = (
                  "AirportInfo(\n"
                  '                    "' + icao + '",\n'
                  '                    "' + airport_name + '",\n'
                  '                    "' + city + '"\n'
                  "                )"
              )

              value, count = pattern.subn(
                  replacement,
                  value,
                  count=1
              )

              if count == 0:
                  raise SystemExit(
                      "Airport entry not found: "
                      + icao
                  )


          write(
              REPOSITORY_FILE,
              value
          )


          print(
              "Airport names updated."
          )


          # ==================================================
          # 5. Verify important fixes
          # ==================================================

          airport_text = read(
              AIRPORT_FILE
          )

          charts_text = read(
              CHARTS_FILE
          )

          viewer_text = read(
              VIEWER_FILE
          )

          repository_text = read(
              REPOSITORY_FILE
          )


          for path in ACTIVITY_FILES:

              value = read(path)

              if "ComponentActivity" in value:
                  raise SystemExit(
                      path.name
                      + " still contains ComponentActivity."
                  )

              if "AppCompatActivity" not in value:
                  raise SystemExit(
                      path.name
                      + " is missing AppCompatActivity."
                  )


          if (
              "repository.airportName"
              in airport_text
          ):
              raise SystemExit(
                  "AirportChartsActivity still uses repository.airportName."
              )


          if (
              "repository.city"
              in airport_text
          ):
              raise SystemExit(
                  "AirportChartsActivity still uses repository.city."
              )


          if (
              "ScrollView.LayoutParams"
              in airport_text
          ):
              raise SystemExit(
                  "AirportChartsActivity still contains ScrollView.LayoutParams."
              )


          if (
              "HorizontalScrollView.LayoutParams"
              in airport_text
          ):
              raise SystemExit(
                  "AirportChartsActivity still contains HorizontalScrollView.LayoutParams."
              )


          if (
              "ScrollView.LayoutParams"
              in charts_text
          ):
              raise SystemExit(
                  "ChartsActivity still contains ScrollView.LayoutParams."
              )


          if (
              "HorizontalScrollView.LayoutParams"
              in viewer_text
          ):
              raise SystemExit(
                  "PdfViewerActivity still contains HorizontalScrollView.LayoutParams."
              )


          if (
              "repository.airport("
              in viewer_text
          ):
              raise SystemExit(
                  "PdfViewerActivity still uses repository.airport()."
              )


          if (
              "onRequestPermissionsResult"
              in viewer_text
          ):
              raise SystemExit(
                  "Old onRequestPermissionsResult still exists."
              )


          if (
              '"OIBK",\n                    "KISH ISLAND",\n'
              not in repository_text
          ):
              raise SystemExit(
                  "OIBK was not set to KISH ISLAND."
              )


          if "import android.view.ViewGroup" not in airport_text:
              raise SystemExit(
                  "AirportChartsActivity is missing ViewGroup import."
              )


          if "import android.view.ViewGroup" not in charts_text:
              raise SystemExit(
                  "ChartsActivity is missing ViewGroup import."
              )


          if "import android.view.ViewGroup" not in viewer_text:
              raise SystemExit(
                  "PdfViewerActivity is missing ViewGroup import."
              )


          print()
          print(
              "Activity inheritance: OK"
          )

          print(
              "Airport navigation fix: OK"
          )

          print(
              "Theme compatibility: OK"
          )

          print(
              "Airport names: OK"
          )

          print(
              "OIBK = KISH ISLAND: OK"
          )

          print()
          print("=" * 70)
          print("ALL FIXES VERIFIED")
          print("=" * 70)
          PY

      - name: Show changes
        shell: bash
        run: |
          git status --short

          echo
          git diff --stat

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/java/com/tareghmsr/jeppiran/MainActivity.kt \
            app/src/main/java/com/tareghmsr/jeppiran/ChartsActivity.kt \
            app/src/main/java/com/tareghmsr/jeppiran/AirportChartsActivity.kt \
            app/src/main/java/com/tareghmsr/jeppiran/PdfViewerActivity.kt \
            app/src/main/java/com/tareghmsr/jeppiran/SettingsActivity.kt \
            app/src/main/java/com/tareghmsr/jeppiran/SplashActivity.kt \
            app/src/main/java/com/tareghmsr/jeppiran/ChartRepository.kt

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit \
            -m "Fix UI navigation theme and airport names"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git rm \
            ".github/workflows/fix-ui-navigation-theme.yml"

          git commit \
            -m "Remove temporary UI fixer workflow"

          git push origin HEAD:main
