name: Publish OICI V2621 georefs for simulator flight QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-oici-flightqa.yml'
      - 'scripts/publish_oici_v2621_georef.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: jeppiran-oici-v2621-georef-flight-qa
  cancel-in-progress: false

jobs:
  source-lock-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyMuPDF and geometric QA requirements
        run: python -m pip install -r scripts/requirements-georef.txt
      - name: Verify exact PDF chart grids, independent named controls and boxed NOT TO SCALE
        run: python scripts/publish_oici_v2621_georef.py
      - name: Run add-only asset and approval checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          a=Path('app/src/main/assets/chart-georef.json').read_bytes()
          b=Path('web/data/chart-georef.json').read_bytes()
          assert a==b
          data=json.loads(a)
          report=json.loads(Path('docs/georeferencing/V2621_OICI_ADC_RNAV_ILS_FLIGHT_QA.json').read_text())
          assert len(data['charts'])==report['currentCount']
          by={int(c['page']):c for c in data['charts']}
          assert set((208,210,211,212,213,214))<=set(by)
          assert all(by[p]['validation']['flightTestOnly'] and by[p]['validation']['notApprovedForNavigation'] for p in (208,210,211,212,213,214))
          assert all(by[p]['airport']=='OICI' for p in (208,210,211,212,213,214))
          print('Source-checked Ilam six-page simulator QA release ready.')
          PY
      - name: Commit only additive V2621 OICI georeferences
        id: release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/chart-georef.json web/data/chart-georef.json docs/georeferencing/V2621_OICI_ADC_RNAV_ILS_FLIGHT_QA.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git diff --cached --check
            git commit -m "release(georef): enable six OICI ADC RNAV ILS simulator QA maps; preserve all originals"
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch native offline Android and web builds
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-ipad-web.yml --ref main
          gh workflow run build-apk.yml --ref main
          echo 'Both live web and local Android builds dispatched'
