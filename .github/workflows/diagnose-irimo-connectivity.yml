name: Diagnose IRIMO public connectivity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_irimo_connectivity.py'
      - '.github/workflows/diagnose-irimo-connectivity.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Test direct and public relay routes without authentication
        run: python3 scripts/diagnose_irimo_connectivity.py
# Read-only network diagnostic; no live data published.
