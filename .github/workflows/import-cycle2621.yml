name: Import JEPPIRAN cycle 2621

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Import approved cycle 2621 commit and LFS assets
        shell: bash
        run: |
          set -euo pipefail
          package_url="https://github.com/mahmet737ng-gif/JeppIran/releases/download/cycle2621-staging/jeppiran-cycle2621-stage.tar.gz"
          curl -fL --retry 3 --retry-delay 2 -o /tmp/cycle2621-stage.tar.gz "$package_url"
          mkdir -p /tmp/cycle2621-stage
          tar -xzf /tmp/cycle2621-stage.tar.gz -C /tmp/cycle2621-stage
          bundle_dir=/tmp/cycle2621-stage/jeppiran-cycle2621-stage
          git bundle verify "$bundle_dir/cycle2621.bundle"
          git fetch "$bundle_dir/cycle2621.bundle" refs/heads/main:refs/remotes/import/main
          GIT_LFS_SKIP_SMUDGE=1 git switch -C main refs/remotes/import/main
          cp "$bundle_dir/files/Iran2621.pdf" Iran2621.pdf
          rm -rf web/data/charts
          mkdir -p web/data
          cp -a "$bundle_dir/files/web/data/charts" web/data/charts
          git add Iran2621.pdf web/data/charts
          git diff --cached --quiet || { echo "LFS package verification failed"; exit 1; }
          git lfs push origin main
          git push origin main
