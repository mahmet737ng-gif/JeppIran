name: Safely publish JEPPIRAN chart cycle 2621
# Retry 3: reconcile proven unchanged procedure metadata before carrying georeferencing.

on:
  push:
    branches:
      - release/cycle2621-safe
    paths:
      - .github/workflows/import-cycle2621.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: jeppiran-cycle2621-safe
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout latest main, preserving FSX and application changes
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - name: Install source PDF processors and LFS
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils git-lfs
          python -m pip install "PyMuPDF==1.26.6" "numpy==2.3.5"
          git lfs install --local

      - name: Prepare and publish only validated V2621 chart data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/release/cycle2621-safe:refs/remotes/origin/release/cycle2621-safe
          git show origin/release/cycle2621-safe:scripts/publish_cycle2621_safely.sh > /tmp/publish2621.sh
          bash /tmp/publish2621.sh

      - name: Request fresh iPad web deployment
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "Deploy iPad Web App" --ref main || echo "Web deployment requires follow-up check"
