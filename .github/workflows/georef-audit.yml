name: Audit JeppIran Chart Georeferencing

on:
  push:
    paths:
      - 'Iran2620.pdf'
      - '.github/workflows/georef-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 1

      - name: Install PDF and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils

      - name: Inspect PDF geospatial metadata and coordinate text
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          PDF = Path("Iran2620.pdf")
          OUT = Path("georef-audit")
          OUT.mkdir(exist_ok=True)

          if not PDF.exists() or PDF.stat().st_size < 1000:
              raise SystemExit("Iran2620.pdf is missing or invalid")

          pdfinfo = subprocess.check_output(
              ["pdfinfo", str(PDF)],
              text=True,
              errors="replace"
          )

          pages = 0
          page_size = ""
          for line in pdfinfo.splitlines():
              if line.startswith("Pages:"):
                  pages = int(line.split(":", 1)[1].strip())
              elif line.startswith("Page size:"):
                  page_size = line.split(":", 1)[1].strip()

          # ------------------------------------------------------------
          # First and most important test:
          # Does the source PDF already contain GeoPDF registration?
          #
          # ISO GeoPDF commonly stores a Viewport / Measure / GPTS / LPTS
          # relationship. Legacy GeoPDF files may use a different encoding.
          # ------------------------------------------------------------

          qdf = OUT / "source-qdf.pdf"
          subprocess.run(
              [
                  "qpdf",
                  "--qdf",
                  "--object-streams=disable",
                  "--stream-data=uncompress",
                  str(PDF),
                  str(qdf)
              ],
              check=True
          )

          raw = qdf.read_text(
              encoding="latin-1",
              errors="ignore"
          )

          geo_terms = {
              "Viewport": len(re.findall(r"/Type\\s*/Viewport", raw)),
              "Measure": len(re.findall(r"/Type\\s*/Measure", raw)),
              "GEO": len(re.findall(r"/Subtype\\s*/GEO", raw)),
              "GPTS": len(re.findall(r"/GPTS\\b", raw)),
              "LPTS": len(re.findall(r"/LPTS\\b", raw)),
              "GCS": len(re.findall(r"/GCS\\b", raw)),
              "LGIDict": len(re.findall(r"/Type\\s*/LGIDict", raw)),
          }

          has_geopdf = (
              geo_terms["GPTS"] > 0 and
              geo_terms["LPTS"] > 0 and
              geo_terms["GEO"] > 0
          )

          with open(OUT / "geopdf-metadata-snippet.txt", "w", encoding="utf-8") as f:
              for term in ["/GPTS", "/LPTS", "/Viewport", "/Measure", "/GCS", "/LGIDict"]:
                  f.write("\n===== " + term + " =====\n")
                  count = 0
                  for match in re.finditer(re.escape(term), raw):
                      start = max(0, match.start() - 500)
                      end = min(len(raw), match.end() + 1000)
                      f.write(raw[start:end])
                      f.write("\n")
                      count += 1
                      if count >= 5:
                          break

          # ------------------------------------------------------------
          # Second test:
          # Extract text with bounding boxes. This gives us page-space
          # coordinates for printed latitude/longitude labels.
          # ------------------------------------------------------------

          bbox_xml = OUT / "coordinates-bbox.xml"
          with open(bbox_xml, "w", encoding="utf-8") as out:
              subprocess.run(
                  [
                      "pdftotext",
                      "-bbox-layout",
                      "-enc", "UTF-8",
                      str(PDF),
                      "-"
                  ],
                  check=True,
                  stdout=out
              )

          # Coordinate formats intentionally cover common aviation-chart
          # forms without assuming a single notation.
          coord_patterns = [
              re.compile(
                  r"^(?P<deg>\\d{1,3})[°º](?P<min>\\d{1,2})[\\'′](?P<sec>\\d{1,2}(?:[.,]\\d+)?)?[\\\"″]?(?P<hem>[NSEW])$",
                  re.I
              ),
              re.compile(
                  r"^(?P<deg>\\d{1,3})[°º](?P<min>\\d{1,2}(?:[.,]\\d+)?)[\\'′]?(?P<hem>[NSEW])$",
                  re.I
              ),
              re.compile(
                  r"^(?P<deg>\\d{1,3})[\\s_-]+(?P<min>\\d{1,2})[\\s_-]+(?P<sec>\\d{1,2}(?:[.,]\\d+)?)[\\s_-]*(?P<hem>[NSEW])$",
                  re.I
              ),
              re.compile(
                  r"^(?P<deg>\\d{1,3}(?:[.,]\\d+)?)[\\s]*(?P<hem>[NSEW])$",
                  re.I
              ),
          ]

          def parse_coord(token):
              token = token.strip().replace("−", "-")
              token = token.replace(",", ".")
              token = token.replace(" ", "")
              for pattern in coord_patterns:
                  m = pattern.match(token)
                  if not m:
                      continue
                  d = float(m.group("deg"))
                  mnt = float(m.groupdict().get("min") or 0)
                  sec = float(m.groupdict().get("sec") or 0)
                  hem = m.group("hem").upper()
                  value = d + mnt / 60.0 + sec / 3600.0
                  if hem in ("S", "W"):
                      value = -value
                  if hem in ("N", "S") and value < -90:
                      return None
                  if hem in ("E", "W") and abs(value) > 180:
                      return None
                  return {
                      "value": value,
                      "hemisphere": hem,
                      "raw": token
                  }
              return None

          tree = ET.parse(bbox_xml)
          root = tree.getroot()

          candidates = []
          page_number = 0

          # pdftotext bbox XML uses page/word bounding boxes in PDF points.
          for page in root.iter():
              if page.tag.endswith("page"):
                  page_number += 1
                  page_width = float(page.attrib.get("width", 0))
                  page_height = float(page.attrib.get("height", 0))

                  for word in page.iter():
                      if not word.tag.endswith("word"):
                          continue

                      text = "".join(word.itertext()).strip()
                      parsed = parse_coord(text)
                      if parsed is None:
                          continue

                      x0 = float(word.attrib.get("xMin", 0))
                      y0 = float(word.attrib.get("yMin", 0))
                      x1 = float(word.attrib.get("xMax", x0))
                      y1 = float(word.attrib.get("yMax", y0))

                      candidates.append({
                          "page": page_number,
                          "page_width": page_width,
                          "page_height": page_height,
                          "x0": x0,
                          "y0": y0,
                          "x1": x1,
                          "y1": y1,
                          "x": (x0 + x1) / 2.0,
                          "y": (y0 + y1) / 2.0,
                          "coordinate": parsed["value"],
                          "hemisphere": parsed["hemisphere"],
                          "raw": parsed["raw"],
                      })

          with open(OUT / "coordinate-candidates.json", "w", encoding="utf-8") as f:
              json.dump(candidates, f, ensure_ascii=False, indent=2)

          by_page = {}
          for item in candidates:
              by_page.setdefault(str(item["page"]), []).append(item)

          report = {
              "source": str(PDF),
              "pages": pages,
              "page_size": page_size,
              "geopdf_detected": has_geopdf,
              "geopdf_terms": geo_terms,
              "coordinate_candidate_count": len(candidates),
              "pages_with_coordinate_candidates": len(by_page),
              "pages": {
                  page: {
                      "count": len(items),
                      "items": items[:50]
                  }
                  for page, items in by_page.items()
              }
          }

          with open(OUT / "georef-audit.json", "w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)

          with open(OUT / "README.txt", "w", encoding="utf-8") as f:
              f.write(
                  "JeppIran georeferencing audit\\n"
                  "===============================\\n\\n"
                  f"Pages: {pages}\\n"
                  f"Page size: {page_size}\\n"
                  f"GeoPDF registration detected: {has_geopdf}\\n"
                  f"Coordinate candidates: {len(candidates)}\\n"
                  f"Pages containing candidates: {len(by_page)}\\n\\n"
                  "IMPORTANT: printed latitude/longitude text is only a candidate "
                  "source. It must be tied to page-space positions and validated "
                  "before an aircraft marker is enabled.\\n"
              )

          print(json.dumps(report, ensure_ascii=False, indent=2)[:12000])
          PY

      - name: Upload georeferencing audit
        uses: actions/upload-artifact@v4
        with:
          name: JeppIran-georef-audit
          path: georef-audit/
