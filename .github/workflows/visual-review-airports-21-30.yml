name: Source PDF large-format visual audit | airports 21-30
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/visual-review-airports-21-30.yml']
permissions:
  contents: write
concurrency:
  group: v2621-visual-audit-third-batch
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyMuPDF==1.26.6'
      - name: Check V2621 source and render ALL 53 excluded-but-map-reviewable charts at large size
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, base64, re
          from pathlib import Path
          import fitz
          manifest=json.loads(Path('web/data/charts-manifest.json').read_text())
          rows={x['page']:x for x in json.loads(Path('web/data/charts-current.json').read_text())}
          batch=json.loads(Path('docs/georeferencing/V2621_AIRPORTS_21_30_REPORT.json').read_text())
          pdf=Path('Iran2621.pdf')
          assert pdf.stat().st_size>1000000
          assert hashlib.sha256(pdf.read_bytes()).hexdigest()==manifest['source_sha256']==batch['source']['sha256']
          doc=fitz.open(pdf)
          assert len(doc)==manifest['pages']==1654
          selected=[x for x in batch['excluded'] if x['status']!='no_graticule']
          assert len(selected)==53, len(selected)
          root=Path('review-assets/v2621-airports-21-30')
          root.mkdir(parents=True,exist_ok=True)
          results=[]
          for i,item in enumerate(selected):
            n=int(item['page'])
            page=doc[n-1]
            row=rows[n]
            assert row['airport']==item['airport']
            pix=page.get_pixmap(matrix=fitz.Matrix(2.5,2.5),colorspace=fitz.csRGB,alpha=False)
            img=pix.tobytes('jpeg',jpg_quality=78)
            name=f'{n:04d}_{row["airport"]}'
            (root/(name+'.jpg.b64.txt')).write_text(base64.b64encode(img).decode('ascii'))
            # Physical screenshot files are included in the workflow artifact;
            # base64 text copies allow direct visual reading via GitHub connector.
            (root/(name+'.jpg')).write_bytes(img)
            fulltext=page.get_text('text')
            nt_boxes=[list(map(lambda x:round(float(x),2),box))
              for box in page.search_for('NOT TO SCALE')]
            grids=re.findall(r'(?<!\d)(?:\d{2,3}-\d{2}(?:\.\d+)?)(?!\d)',fulltext)
            results.append({'page':n,'airport':row['airport'],'category':row['category'],
              'chartName':row['name'],'status':item['status'],'reason':item['reason'],
              'imagePixels':[pix.width,pix.height],'imageBytes':len(img),
              'notToScaleTextBoxes':nt_boxes,'printedGridLabels':sorted(set(grids)),
              'headerText':fulltext[:1500], 'fullTextLength':len(fulltext)})
            print(n,row['airport'],item['status'],'NTS',len(nt_boxes),'grid',len(grids),'image',len(img),flush=True)
          (root/'index.json').write_text(json.dumps(results,indent=2,ensure_ascii=False))
          assert len(results)==53
          PY
      - name: Upload large-format JPEGs and measured textual index
        uses: actions/upload-artifact@v4
        with:
          name: jeppiran-v2621-batch3-53-large-format-page-review
          path: |
            review-assets/v2621-airports-21-30/*.jpg
            review-assets/v2621-airports-21-30/index.json
          retention-days: 30
      - name: Keep encoded previews isolated on a temporary audit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c audit/v2621-airports-21-30-large-visual
          git add review-assets/v2621-airports-21-30/*.txt review-assets/v2621-airports-21-30/index.json
          git commit -m 'QA: 53 high-resolution source chart previews for visual inspection'
          git push origin HEAD:refs/heads/audit/v2621-airports-21-30-large-visual
