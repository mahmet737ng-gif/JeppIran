name: V2621 georeference airports 21-30
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/georef-airports-21-30.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jeppiran-v2621-georef-21-30
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vector PDF georeference dependencies
        run: python -m pip install -r scripts/requirements-georef.txt

      - name: Source-lock and select exactly ten airports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          airports = 'OIGG OIHH OIHR OIIE OIII OIKB OIIP OIKJ OIKK OIKM'.split()
          manifest=json.loads(Path('web/data/charts-manifest.json').read_text())
          rows=json.loads(Path('web/data/charts-current.json').read_text())
          pdf=Path('Iran2621.pdf')
          digest=hashlib.sha256(pdf.read_bytes()).hexdigest()
          assert manifest['version']=='V2621' and manifest['source_sha256']==digest, 'Incorrect AIRAC/PDF'
          assert manifest['pages']==1654 and pdf.stat().st_size>1000000, 'LFS PDF was not downloaded'
          subset=[r for r in rows if r['airport'] in airports]
          assert len(subset)==216 and len(set(int(x['page']) for x in subset))==216, 'Third batch page identities changed'
          assert list(dict.fromkeys(r['airport'] for r in subset))==airports, 'Airport sequence changed'
          Path('/tmp/third-georef-index.json').write_text(json.dumps(subset))
          Path('/tmp/third-georef-pages.txt').write_text(','.join(str(x['page']) for x in subset))
          print('Source PDF SHA256:',digest,'airport charts:',len(subset))
          PY

      - name: Derive real PDF graticule transforms without replacing accepted source records
        shell: bash
        run: |
          set -euo pipefail
          python scripts/extract_chart_georef.py \
            --pdf Iran2621.pdf \
            --index /tmp/third-georef-index.json \
            --manifest web/data/charts-manifest.json \
            --pages "$(cat /tmp/third-georef-pages.txt)" \
            --previous-georef web/data/chart-georef.json \
            --output /tmp/third-georef-extracted.json \
            --audit /tmp/third-georef-audit.json \
            --disable-independent-check

      - name: Validate boxed NOT TO SCALE regions without extrapolating into insets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,sys
          from pathlib import Path
          import fitz
          sys.path.insert(0,'scripts')
          from extract_chart_georef import extract,page_fingerprint
          doc=fitz.open('Iran2621.pdf')
          path=Path('/tmp/third-georef-extracted.json')
          audit_path=Path('/tmp/third-georef-audit.json')
          src=json.loads(path.read_text())
          audit=json.loads(audit_path.read_text())
          rows={int(r['page']):r for r in json.loads(Path('/tmp/third-georef-index.json').read_text())}
          provisional={int(c['page']):c for c in json.loads(Path('web/data/georef-provisional-v2621.json').read_text())['charts']}
          original={int(c['page']) for c in src['charts']}
          recovered=[]
          still=[]
          reasons={}
          for item in audit['excludedCharts']:
            p=int(item['page'])
            if item['status']!='review_required_not_to_scale' or p in original:
              still.append(item)
              continue
            page=doc[p-1]
            fp=page_fingerprint(page)
            # Printed ARP coordinates are never used as invented point locations.
            match=re.search(r'Lat/Long:\s*N(\d+)°\s*([\d.]+).*?E(\d+)°\s*([\d.]+)',doc[next(i for i,r in enumerate(doc) if i+1 in rows and rows[i+1]['airport']==item['airport'])].get_text())
            if not match:
              reasons[p]='Missing printed airport anchor'
              still.append(item)
              continue
            anchor={'sourcePage':p,'lat':int(match[1])+float(match[2])/60,'lon':int(match[3])+float(match[4])/60}
            try:
              c=extract(page,p,rows[p],anchor,fp)
              # Require every literal NOT TO SCALE marking to be enclosed
              # by a small visible vector box separate from the calibrated ticks.
              labels=page.search_for('NOT TO SCALE')
              if not labels: raise ValueError('NOT TO SCALE text not locatable')
              possible=[]
              for shape in page.get_drawings():
                for kind,*args in shape.get('items',[]):
                  if kind!='re': continue
                  area=fitz.Rect(args[0])
                  if area.width<18 or area.height<10 or area.get_area()>page.rect.get_area()*.30:continue
                  possible.append(area)
              # These two V2621 SID insets are bounded by PDF dash
              # SEGMENTS rather than a native PDF rectangle primitive.
              # Bounds are pinned to the canonical visible-page fingerprint;
              # never apply a prior AIRAC map region by page number alone.
              source_locked_dashed_insets={
                422:('34ffed294be4704b7042cff66f7d284e017000891ec605ef36979f8a678b2ff0',
                     (305,623,405,690)),
                425:('366ee22bc4265c9dc4f0ff983b8d274880eb22cab5e6e9b129a2965cff03adc2',
                     (105,650,162,781.8)),
              }
              if p in source_locked_dashed_insets:
                known_fp,box=source_locked_dashed_insets[p]
                assert fp==known_fp, 'NTS crop fingerprint changed'
                b=fitz.Rect(*box)
                assert all(b.contains(rect) for rect in labels), 'Marked inset is outside approved crop'
                assert all(not b.contains(fitz.Point(v['x'],v['y'])) for v in c['points']), 'Crop covers graticule'
                possible.append(b)
              prev=provisional.get(p)
              if prev and prev.get('sourceFingerprint')==fp:
                for box in prev.get('excludedBounds',[]):
                  b=fitz.Rect(box['left'],box['top'],box['right'],box['bottom'])
                  # A preexisting polygon is only trusted if its perimeter
                  # closely matches an actual rectangle in the current PDF.
                  if any(max(abs(b.x0-a.x0),abs(b.y0-a.y0),abs(b.x1-a.x1),abs(b.y1-a.y1))<3 for a in possible):
                    possible.append(b)
              masks=[]
              for label in labels:
                matching=[b for b in possible if b.contains(label) and
                  all(not b.contains(fitz.Point(t['x'],t['y'])) for t in c['points'])]
                if not matching: raise ValueError('NTS text not isolated in a separate measured vector box')
                box=min(matching,key=lambda b:b.get_area())
                if not any(max(abs(v.x0-box.x0),abs(v.y0-box.y0),abs(v.x1-box.x1),abs(v.y1-box.y1))<1 for v in masks):masks.append(box)
              assert len(masks)>0
              c['excludedBounds']=[dict(left=float(b.x0),top=float(b.y0),right=float(b.x1),bottom=float(b.y1)) for b in masks]
              c['validation']['reviewDecision']='measured_plan_boxed_NTS_only'
              c['validation']['notToScaleRegionsMasked']=len(masks)
              c['validation']['qaTestOnly']=True
              c['validation']['notApprovedForNavigation']=True
              src['charts'].append(c)
              recovered.append(p)
            except (ValueError,AssertionError,StopIteration) as exc:
              near=page.search_for('NOT TO SCALE')
              prev=provisional.get(p)
              reasons[p]={'error':str(exc),
                 'notToScaleTextRects':[[round(v,1) for v in rect] for rect in near],
                 'provisionalMasks':prev.get('excludedBounds',[]) if prev else [],
                 'sourceRects':[
                   [round(x,1) for x in fitz.Rect(args[0])]
                   for shape in page.get_drawings() for kind,*args in shape.get('items',[])
                   if kind=='re' and fitz.Rect(args[0]).get_area() < page.rect.get_area()*.4
                 ][:25]}
              still.append(item)
          src['charts'].sort(key=lambda c:int(c['page']))
          audit['excludedCharts']=still
          audit['calibratedPageCount']=len(src['charts'])
          audit['newlyExtractedPageCount']+=len(recovered)
          for airport in audit['airports']:
            airport['calibratedPages']=sorted([c['page'] for c in src['charts'] if c['airport']==airport['icao']])
            airport['otherExcludedPages']=[c['page'] for c in still if c['airport']==airport['icao'] and c['status']!='not_to_scale']
            airport['notToScalePages']=[c['page'] for c in still if c['airport']==airport['icao'] and c['status']=='not_to_scale']
          path.write_text(json.dumps(src,indent=2))
          audit_path.write_text(json.dumps(audit,indent=2))
          print('Independently boxed NTS map views:',recovered,'rejected:',reasons)
          PY

      - name: Recover source-locked and grid-verified inset-safe OIII SID transforms
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math,sys
          from pathlib import Path
          import fitz,numpy as np
          sys.path.insert(0,'scripts')
          from extract_chart_georef import grid_axes,page_fingerprint,chart_key,decimal_grid
          doc=fitz.open('Iran2621.pdf')
          root_path=Path('/tmp/third-georef-extracted.json')
          audit_path=Path('/tmp/third-georef-audit.json')
          raw=json.loads(root_path.read_text())
          audit=json.loads(audit_path.read_text())
          rows={int(x['page']):x for x in json.loads(Path('/tmp/third-georef-index.json').read_text())}
          old={int(x['page']) for x in raw['charts']}
          provisional={int(c['page']):c for c in json.loads(Path('web/data/georef-provisional-v2621.json').read_text())['charts']}
          accepted=[]
          rejected={}
          # These four separate chart-region masks are pinned to the canonical
          # original PDF fingerprints. Never generalize from their page numbers
          # to a new AIRAC cycle. They remain simulator-test-only.
          for n in (420,424,426,427):
            if n in old:continue
            c=provisional.get(n)
            page=doc[n-1]
            try:
              assert c and c['sourceFingerprint']==page_fingerprint(page)
              assert c['airport']=='OIII' and c['chartKey']==chart_key(rows[n])
              assert c['validation']['qaTestOnly'] and c['validation']['notApprovedForNavigation']
              assert c['coordinateSpace']=='pdf_points' and c['origin']=='top_left'
              assert page.rect.width==c['width'] and page.rect.height==c['height']
              anchor={'lat':35.6892,'lon':51.3134}
              axes,_,_,_=grid_axes(page,anchor)
              # Every grid-marked source control has to be a real matching
              # printed vector-tick intersection, not text-centre estimation.
              observed=0
              for pt in c['points']:
                desc=pt.get('source','')
                if not desc.startswith('Printed grid '):continue
                lat_label,lon_label=desc[len('Printed grid '):].split(' / ')
                lat=next(a for a in axes['latitude'] if a['label']==lat_label)
                lon=next(a for a in axes['longitude'] if a['label']==lon_label)
                assert abs(pt['lat']-decimal_grid(lat_label))<1e-8
                assert abs(pt['lon']-decimal_grid(lon_label))<1e-8
                coord={'x':None,'y':None}
                coord[lat['pixelAxis']]=lat['pdfPoint']
                coord[lon['pixelAxis']]=lon['pdfPoint']
                assert abs(pt['x']-coord['x'])<.8 and abs(pt['y']-coord['y'])<.8
                observed+=1
              assert observed>=2, 'Insufficient independently paired ticks'
              values=np.array([[t['lon'],t['lat']] for t in c['points']])
              coords=np.array([[t['x'],t['y']] for t in c['points']])
              mean=values.mean(axis=0)
              design=np.column_stack([values-mean,np.ones(len(values))])
              coef,_,rank,_=np.linalg.lstsq(design,coords,rcond=None)
              residual=float(np.max(np.linalg.norm(design@coef-coords,axis=1)))
              east,north=coef[0],coef[1]
              det=east[0]*north[1]-east[1]*north[0]
              scale=abs(np.linalg.norm(east)/np.linalg.norm(north)/np.cos(np.deg2rad(mean[1]))-1)
              angle=abs(np.dot(east,north))/(np.linalg.norm(east)*np.linalg.norm(north))
              assert rank==3 and det<0 and scale<.03 and angle<.03
              assert residual<=.75 and abs(residual-c['validation']['gridMaxResidualPdfPoints'])<.0001
              labels=page.search_for('NOT TO SCALE')
              masks=[fitz.Rect(b['left'],b['top'],b['right'],b['bottom']) for b in c['excludedBounds']]
              assert labels and masks and all(any(box.contains(label) for box in masks) for label in labels)
              assert all(box in page.rect for box in masks)
              assert all(not any(b.contains(fitz.Point(t['x'],t['y'])) for b in masks) for t in c['points'])
              c['gridAxes']=axes
              c['validation']['reviewDecision']='fingerprint_bound_printed_vector_grid_plus_inset_mask'
              c['validation']['sourceTickIntersectionCount']=observed
              raw['charts'].append(c)
              accepted.append(n)
            except (ValueError,AssertionError,KeyError,StopIteration,TypeError,IndexError) as err:
              rejected[n]=str(err)
          raw['charts'].sort(key=lambda x:int(x['page']))
          if accepted:
            audit['excludedCharts']=[x for x in audit['excludedCharts'] if int(x['page']) not in accepted]
            audit['calibratedPageCount']=len(raw['charts'])
            audit['newlyExtractedPageCount']+=len(accepted)
            for airport in audit['airports']:
              airport['calibratedPages']=sorted([x['page'] for x in raw['charts'] if x['airport']==airport['icao']])
              airport['otherExcludedPages']=[x['page'] for x in audit['excludedCharts'] if x['airport']==airport['icao'] and x['status']!='not_to_scale']
              airport['notToScalePages']=[x['page'] for x in audit['excludedCharts'] if x['airport']==airport['icao'] and x['status']=='not_to_scale']
            root_path.write_text(json.dumps(raw,indent=2))
            audit_path.write_text(json.dumps(audit,indent=2))
          print('Extra V2621 source-tick verified OIII SID pages:',accepted,'rejected:',rejected)
          PY

      - name: Verify page fingerprints, physical orientation and measured source ticks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math,sys
          from pathlib import Path
          import fitz,numpy as np
          sys.path.insert(0,'scripts')
          from extract_chart_georef import page_fingerprint,segments,decimal_grid,chart_key
          raw=json.loads(Path('/tmp/third-georef-extracted.json').read_text())
          audit=json.loads(Path('/tmp/third-georef-audit.json').read_text())
          index={int(c['page']):c for c in json.loads(Path('/tmp/third-georef-index.json').read_text())}
          base=json.loads(Path('web/data/chart-georef.json').read_text())
          doc=fitz.open('Iran2621.pdf')
          assert raw['source']==base['source'], 'Source mismatch with installed georeferencing'
          charts=raw['charts']
          excluded=audit['excludedCharts']
          assert len(charts)+len(excluded)==len(index)==216
          assert {c['page'] for c in charts}.isdisjoint({c['page'] for c in excluded})
          assert {c['page'] for c in charts}|{c['page'] for c in excluded}==set(index)
          already={int(c['page']):c for c in base['charts']}
          approved=[]
          for c in charts:
            p=int(c['page'])
            assert c['airport']==index[p]['airport'] and c['chartKey']==chart_key(index[p])
            assert c['sourceFingerprint']==page_fingerprint(doc[p-1])
            assert c['coordinateSpace']=='pdf_points' and c['origin']=='top_left'
            if p in already: continue  # DO NOT modify previously accepted models
            page=doc[p-1]
            # Mixed-scale pages require separate verified crops, not entire-sheet transforms.
            if 'NOT TO SCALE' in page.get_text():
              assert c['validation'].get('reviewDecision') in ('measured_plan_boxed_NTS_only','fingerprint_bound_printed_vector_grid_plus_inset_mask'), f'Unreviewed NTS page {p}'
              assert c['excludedBounds'] and all(
                any(fitz.Rect(b['left'],b['top'],b['right'],b['bottom']).contains(v) for b in c['excludedBounds'])
                for v in page.search_for('NOT TO SCALE')
              ), f'NTS chart region not fully masked {p}'
            assert abs(c['width']-page.rect.width)<.01 and abs(c['height']-page.rect.height)<.01
            assert len(c['points'])>=4 and all(c['bounds']['left']<=v['x']<=c['bounds']['right'] and c['bounds']['top']<=v['y']<=c['bounds']['bottom'] for v in c['points'])
            print_ticks=np.array(segments(page),dtype=float)
            words=page.get_text('words')
            for axis, controls in c['gridAxes'].items():
              if len(controls)<2:
                # Printed SID grids may measure one geographic line and derive
                # the second through a source-checked local conformal scale.
                # Only the page-fingerprint-bound cropped NTS workflow may use
                # this exception; other charts retain the strict 2-axis gate.
                assert len(controls)==1 and c['validation'].get('method')=='single_axis_plus_conformal_scale' and c['validation'].get('reviewDecision')=='fingerprint_bound_printed_vector_grid_plus_inset_mask', f'Unproven singleton grid axis {p}/{axis}'
                assert c['validation'].get('sourceTickIntersectionCount',0)>=2, f'Insufficient source ticks {p}/{axis}'
              for ctrl in controls:
                if ctrl.get('derived'):
                  assert ctrl['derivation']=='orthogonal_conformal_scale'
                  continue
                assert abs(decimal_grid(ctrl['label'])-ctrl['degrees'])<1e-7
                assert any(w[4]==ctrl['label'] and max(abs(float(a)-float(b)) for a,b in zip(w[:4],ctrl['labelBounds']))<.002 for w in words)
                assert np.min(np.max(np.abs(print_ticks-np.array(ctrl['tickSegment'])),axis=1))<.002
            ll=np.array([[x['lon'],x['lat']] for x in c['points']])
            xy=np.array([[x['x'],x['y']] for x in c['points']])
            m=ll.mean(axis=0)
            design=np.column_stack([ll-m,np.ones(len(ll))])
            coef,_,rank,_=np.linalg.lstsq(design,xy,rcond=None)
            residual=np.max(np.linalg.norm(design@coef-xy,axis=1))
            assert rank==3 and float(residual)<=c['maxResidualPdfPoints']+.00001
            assert coef[0,0]*coef[1,1]-coef[0,1]*coef[1,0]<0, f'Mirrored transform {p}'
            approved.append(p)
          Path('/tmp/third-approved-pages.json').write_text(json.dumps(approved))
          print(json.dumps({'calibratedInSource':len(charts),'alreadyPresent':len(charts)-len(approved),'newlySourceVerified':len(approved),'stillExcluded':len(excluded),'newPages':approved}))
          PY

      - name: Publish additive source-verified georefs to both web and native Android
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Always merge onto the LATEST production head: other independent tasks
          # frequently publish while this expensive PDF inspection is running.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -B georef-airports-21-30-publish origin/main
            python - <<'PY'
          import json,hashlib
          from pathlib import Path
          target='OIGG OIHH OIHR OIIE OIII OIKB OIIP OIKJ OIKK OIKM'.split()
          root=Path('web/data')
          base_path=root/'chart-georef.json'
          base=json.loads(base_path.read_text())
          extracted=json.loads(Path('/tmp/third-georef-extracted.json').read_text())
          approved=set(json.loads(Path('/tmp/third-approved-pages.json').read_text()))
          manifest=json.loads((root/'charts-manifest.json').read_text())
          assert base['source']==extracted['source']
          assert manifest['source_sha256']==base['source']['sha256'] and manifest['version']=='V2621'
          old={int(c['page']):c for c in base['charts']}
          count=len(old)
          published=[]
          for item in extracted['charts']:
            p=int(item['page'])
            if p not in approved or p in old: continue
            if item['airport'] not in target: raise ValueError('Unexpected airport')
            old[p]=item
            published.append(p)
          assert len(old)>=count and all(int(x['page']) in old for x in base['charts'])
          if published:
            base['charts']=[old[p] for p in sorted(old)]
            output=json.dumps(base,indent=2,ensure_ascii=False)+'\n'
            base_path.write_text(output)
            Path('app/src/main/assets/chart-georef.json').write_text(output)
          audit=json.loads(Path('/tmp/third-georef-audit.json').read_text())
          report={'source':extracted['source'],'batch':'airports_21_30',
              'airportOrder':target,'sourcePages':216,'sourceCalibrated':len(extracted['charts']),
              'newlyPublished':len(published),'publishedPages':published,
              'alreadyPresentOrProtected':len(extracted['charts'])-len(published),
              'excluded':audit['excludedCharts'],
              'note':'Only source-locked, independently rechecked printed-vector grid models are added. Unverified NOT TO SCALE/inset, graticule-free, and ambiguous pages remain inactive. Not for actual navigation.'}
          Path('docs/georeferencing').mkdir(parents=True,exist_ok=True)
          Path('docs/georeferencing/V2621_AIRPORTS_21_30_REPORT.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          print('NEW SOURCE-VERIFIED GEOREFS COMMITTED FOR WEB AND ANDROID:',published)
          PY
            git add web/data/chart-georef.json app/src/main/assets/chart-georef.json docs/georeferencing/V2621_AIRPORTS_21_30_REPORT.json
            if git diff --cached --quiet; then
              echo 'No new verified records, preexisting data protected.'
              exit 0
            fi
            git commit -m 'Publish source-verified V2621 georeferences for airports 21-30'
            if git push origin HEAD:main; then
              echo 'Production web and native asset sources published.'
              exit 0
            fi
            echo "Concurrent release advanced main; retrying additive merge ($attempt)."
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2621-georef-airports-21-30-QA
          path: |
            /tmp/third-georef-extracted.json
            /tmp/third-georef-audit.json
            /tmp/third-approved-pages.json
          if-no-files-found: ignore
