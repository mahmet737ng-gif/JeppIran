name: Fix JeppIran Kotlin Compilation Errors

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-kotlin:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix Kotlin source files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re


          ROOT = Path(
              "app/src/main/java/com/tareghmsr/jeppiran"
          )


          AIRPORT_FILE = ROOT / "AirportChartsActivity.kt"
          CHARTS_FILE = ROOT / "ChartsActivity.kt"
          VIEWER_FILE = ROOT / "PdfViewerActivity.kt"


          def read(path):
              return path.read_text(
                  encoding="utf-8"
              )


          def write(path, text):
              path.write_text(
                  text,
                  encoding="utf-8"
              )


          def replace_regex(
              text,
              pattern,
              replacement,
              description
          ):
              new_text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  flags=re.MULTILINE
              )

              print(
                  description,
                  "->",
                  count,
                  "replacement(s)"
              )

              return new_text


          def ensure_import(
              text,
              import_line,
              anchor
          ):
              if import_line in text:
                  return text

              return text.replace(
                  anchor,
                  import_line + "\n" + anchor,
                  1
              )


          # ==================================================
          # AirportChartsActivity.kt
          # ==================================================

          text = read(
              AIRPORT_FILE
          )


          text = replace_regex(
              text,
              r"""repository\s*\.\s*airportName\s*\(\s*icao\s*\)""",
              "ChartRepository.airportName(icao)",
              "AirportChartsActivity airportName"
          )


          text = replace_regex(
              text,
              r"""repository\s*\.\s*city\s*\(\s*icao\s*\)""",
              "ChartRepository.city(icao)",
              "AirportChartsActivity city"
          )


          # Fix HorizontalScrollView first.
          text = text.replace(
              "HorizontalScrollView.LayoutParams",
              "ViewGroup.LayoutParams"
          )


          # Fix normal ScrollView params.
          text = text.replace(
              "ScrollView.LayoutParams",
              "ViewGroup.LayoutParams"
          )


          text = ensure_import(
              text,
              "import android.view.ViewGroup",
              "import android.view.View"
          )


          write(
              AIRPORT_FILE,
              text
          )


          # ==================================================
          # ChartsActivity.kt
          # ==================================================

          text = read(
              CHARTS_FILE
          )


          text = text.replace(
              "ScrollView.LayoutParams",
              "ViewGroup.LayoutParams"
          )


          text = ensure_import(
              text,
              "import android.view.ViewGroup",
              "import android.view.Gravity"
          )


          write(
              CHARTS_FILE,
              text
          )


          # ==================================================
          # PdfViewerActivity.kt
          # ==================================================

          text = read(
              VIEWER_FILE
          )


          # Repository airport lookup must use the companion object.
          text = replace_regex(
              text,
              r"""repository\s*\.\s*airport\s*\(\s*currentIcao\s*\)""",
              "ChartRepository.airport(currentIcao)",
              "PdfViewerActivity airport lookup"
          )


          # Fix HorizontalScrollView params.
          text = text.replace(
              "HorizontalScrollView.LayoutParams",
              "ViewGroup.LayoutParams"
          )


          # Ensure ViewGroup import.
          text = ensure_import(
              text,
              "import android.view.ViewGroup",
              "import android.view.View"
          )


          # --------------------------------------------------
          # Replace old runtime permission callback completely.
          # --------------------------------------------------

          permission_pattern = re.compile(
              r"""
              \n\s*
              override\s+fun\s+onRequestPermissionsResult\s*
              \(
                  \s*requestCode\s*:\s*Int\s*,\s*
                  permissions\s*:\s*Array<out\s+String>\s*,\s*
                  grantResults\s*:\s*IntArray\s*
              \)
              \s*\{
              .*?
              \n\s*\}
              \s*
              (?=\n\s*(?:private|override|fun|companion|class|object)\b)
              """,
              flags=re.DOTALL | re.VERBOSE
          )


          text, permission_count = permission_pattern.subn(
              "\n",
              text,
              count=1
          )


          print(
              "Old permission callback removed:",
              permission_count
          )


          # --------------------------------------------------
          # Add Activity Result API import.
          # --------------------------------------------------

          text = ensure_import(
              text,
              "import androidx.activity.result.contract.ActivityResultContracts",
              "import androidx.activity.ComponentActivity"
          )


          # --------------------------------------------------
          # Remove old ActivityCompat permission request.
          # The GPS launcher will replace it.
          # --------------------------------------------------

          request_pattern = re.compile(
              r"""
              \s*ActivityCompat\.requestPermissions\s*
              \(
                  \s*this\s*,\s*
                  arrayOf\s*
                  \(
                      \s*Manifest\.permission\s*
                      \.\s*ACCESS_FINE_LOCATION\s*,\s*
                      Manifest\.permission\s*
                      \.\s*ACCESS_COARSE_LOCATION
                  \s*\)\s*,\s*
                  GPS_PERMISSION_REQUEST
              \s*\)
              """,
              flags=re.DOTALL | re.VERBOSE
          )


          text, request_count = request_pattern.subn(
              """
              locationPermissionLauncher.launch(
                  arrayOf(
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  )
              )
              """,
              text,
              count=1
          )


          print(
              "Old permission request replaced:",
              request_count
          )


          # --------------------------------------------------
          # Add Activity Result launcher property.
          # --------------------------------------------------

          launcher_code = """
          private val locationPermissionLauncher =
              registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { result ->

                  val granted =
                      result.values.any {
                          it
                      }

                  if (granted) {

                      startGps()

                  } else {

                      updateGpsText(
                          "GPS: permission denied"
                      )
                  }
              }


          """


          if (
              "private val locationPermissionLauncher"
              not in text
          ):

              marker = "class PdfViewerActivity :\n    ComponentActivity() {\n"

              if marker not in text:

                  raise SystemExit(
                      "PdfViewerActivity class marker not found"
                  )

              text = text.replace(
                  marker,
                  marker + "\n" + launcher_code,
                  1
              )


          # --------------------------------------------------
          # Convert text hit-test coordinates to Float.
          # --------------------------------------------------

          text = replace_regex(
              text,

              r"""measureTextBounds\(\s*item\s*\)\.contains\(\s*
                  localX\s*,\s*
                  localY\s*
              \)""",

              """measureTextBounds(
                            item
                        ).contains(
                            localX.toFloat(),
                            localY.toFloat()
                        )""",

              "PdfViewerActivity localX/localY Float conversion"
          )


          write(
              VIEWER_FILE,
              text
          )


          # ==================================================
          # Verification
          # ==================================================

          print()
          print("=" * 70)
          print("VERIFYING KOTLIN FILES")
          print("=" * 70)


          airport_text = read(
              AIRPORT_FILE
          )

          charts_text = read(
              CHARTS_FILE
          )

          viewer_text = read(
              VIEWER_FILE
          )


          # These old references must no longer exist.
          forbidden = [

              (
                  "AirportChartsActivity",
                  r"repository\s*\.\s*airportName"
              ),

              (
                  "AirportChartsActivity",
                  r"repository\s*\.\s*city"
              ),

              (
                  "AirportChartsActivity",
                  r"ScrollView\.LayoutParams"
              ),

              (
                  "AirportChartsActivity",
                  r"HorizontalScrollView\.LayoutParams"
              ),

              (
                  "ChartsActivity",
                  r"ScrollView\.LayoutParams"
              ),

              (
                  "PdfViewerActivity",
                  r"repository\s*\.\s*airport\s*\("
              ),

              (
                  "PdfViewerActivity",
                  r"HorizontalScrollView\.LayoutParams"
              ),

              (
                  "PdfViewerActivity",
                  r"onRequestPermissionsResult"
              ),

              (
                  "PdfViewerActivity",
                  r"Array<out\s+String>"
              ),
          ]


          checks = {
              "AirportChartsActivity": airport_text,
              "ChartsActivity": charts_text,
              "PdfViewerActivity": viewer_text,
          }


          for file_name, pattern in forbidden:

              content = checks[file_name]

              if re.search(
                  pattern,
                  content
              ):

                  raise SystemExit(
                      file_name
                      + " still contains forbidden pattern: "
                      + pattern
                  )


          required_imports = [

              (
                  "AirportChartsActivity",
                  "import android.view.ViewGroup"
              ),

              (
                  "ChartsActivity",
                  "import android.view.ViewGroup"
              ),

              (
                  "PdfViewerActivity",
                  "import android.view.ViewGroup"
              ),

              (
                  "PdfViewerActivity",
                  "import androidx.activity.result.contract.ActivityResultContracts"
              ),
          ]


          for file_name, required in required_imports:

              content = checks[file_name]

              if required not in content:

                  raise SystemExit(
                      file_name
                      + " is missing import: "
                      + required
                  )


          if (
              "private val locationPermissionLauncher"
              not in viewer_text
          ):

              raise SystemExit(
                  "GPS permission launcher was not created"
              )


          print(
              "AirportChartsActivity.kt: OK"
          )

          print(
              "ChartsActivity.kt: OK"
          )

          print(
              "PdfViewerActivity.kt: OK"
          )

          print()
          print(
              "All source fixes verified."
          )

          print("=" * 70)
          PY


      - name: Show changes
        shell: bash
        run: |
          echo "Git status:"
          git status --short

          echo
          echo "Diff summary:"
          git diff --stat


      - name: Commit fixes
        shell: bash
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            app/src/main/java/com/tareghmsr/jeppiran/AirportChartsActivity.kt \
            app/src/main/java/com/tareghmsr/jeppiran/ChartsActivity.kt \
            app/src/main/java/com/tareghmsr/jeppiran/PdfViewerActivity.kt


          if git diff --cached --quiet; then
            echo "No source changes detected."
            exit 0
          fi


          git commit \
            -m "Fix Kotlin compilation errors"


          git fetch origin main


          git rebase origin/main


          git push origin HEAD:main
