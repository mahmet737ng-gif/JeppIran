name: Fix JeppIran Kotlin Compilation Errors

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-kotlin:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix Kotlin source files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re


          FILES = {
              "airport":
                  Path(
                      "app/src/main/java/com/tareghmsr/jeppiran/AirportChartsActivity.kt"
                  ),

              "charts":
                  Path(
                      "app/src/main/java/com/tareghmsr/jeppiran/ChartsActivity.kt"
                  ),

              "viewer":
                  Path(
                      "app/src/main/java/com/tareghmsr/jeppiran/PdfViewerActivity.kt"
                  ),
          }


          def replace_regex(
              text,
              pattern,
              replacement,
              description
          ):
              new_text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  flags=re.MULTILINE
              )

              if count == 0:
                  raise SystemExit(
                      "Required code not found: "
                      + description
                  )

              print(
                  "Fixed:",
                  description,
                  "matches:",
                  count
              )

              return new_text


          # ==================================================
          # AirportChartsActivity.kt
          # ==================================================

          path = FILES["airport"]

          text = path.read_text(
              encoding="utf-8"
          )


          # repository.airportName(icao)
          text = replace_regex(
              text,

              r"""repository\s*\.\s*airportName\s*\(\s*icao\s*\)""",

              """ChartRepository.airportName(icao)""",

              "AirportChartsActivity airportName"
          )


          # repository.city(icao)
          text = replace_regex(
              text,

              r"""repository\s*\.\s*city\s*\(\s*icao\s*\)""",

              """ChartRepository.city(icao)""",

              "AirportChartsActivity city"
          )


          # ScrollView.LayoutParams -> FrameLayout.LayoutParams
          text = replace_regex(
              text,

              r"""ScrollView\.LayoutParams""",

              """FrameLayout.LayoutParams""",

              "AirportChartsActivity ScrollView LayoutParams"
          )


          # HorizontalScrollView.LayoutParams -> FrameLayout.LayoutParams
          text = replace_regex(
              text,

              r"""HorizontalScrollView\.LayoutParams""",

              """FrameLayout.LayoutParams""",

              "AirportChartsActivity HorizontalScrollView LayoutParams"
          )


          # Make sure FrameLayout is imported.
          if (
              "import android.widget.FrameLayout"
              not in text
          ):
              text = text.replace(
                  "import android.widget.HorizontalScrollView",
                  "import android.widget.FrameLayout\n"
                  "import android.widget.HorizontalScrollView"
              )


          path.write_text(
              text,
              encoding="utf-8"
          )


          # ==================================================
          # ChartsActivity.kt
          # ==================================================

          path = FILES["charts"]

          text = path.read_text(
              encoding="utf-8"
          )


          # ScrollView.LayoutParams -> FrameLayout.LayoutParams
          text = replace_regex(
              text,

              r"""ScrollView\.LayoutParams""",

              """FrameLayout.LayoutParams""",

              "ChartsActivity ScrollView LayoutParams"
          )


          if (
              "import android.widget.FrameLayout"
              not in text
          ):
              text = text.replace(
                  "import android.widget.EditText",
                  "import android.widget.FrameLayout\n"
                  "import android.widget.EditText"
              )


          path.write_text(
              text,
              encoding="utf-8"
          )


          # ==================================================
          # PdfViewerActivity.kt
          # ==================================================

          path = FILES["viewer"]

          text = path.read_text(
              encoding="utf-8"
          )


          # repository.airport(currentIcao)
          text = replace_regex(
              text,

              r"""repository\s*\.\s*airport\s*\(\s*currentIcao\s*\)""",

              """ChartRepository.airport(currentIcao)""",

              "PdfViewerActivity airport lookup"
          )


          # HorizontalScrollView.LayoutParams
          text = replace_regex(
              text,

              r"""HorizontalScrollView\.LayoutParams""",

              """FrameLayout.LayoutParams""",

              "PdfViewerActivity HorizontalScrollView LayoutParams"
          )


          # Permission callback type.
          text = replace_regex(
              text,

              r"""Array<out\s+String>""",

              """Array<String>""",

              "PdfViewerActivity permission array"
          )


          # Double -> Float for text hit testing.
          text = replace_regex(
              text,

              r"""(\.contains\(\s*\n?\s*)localX(\s*,\s*)localY(\s*\))""",

              r"""\1localX.toFloat()\2localY.toFloat()\3""",

              "PdfViewerActivity text bounds Float conversion"
          )


          if (
              "import android.widget.FrameLayout"
              not in text
          ):
              text = text.replace(
                  "import android.widget.EditText",
                  "import android.widget.FrameLayout\n"
                  "import android.widget.EditText"
              )


          path.write_text(
              text,
              encoding="utf-8"
          )


          # ==================================================
          # FINAL CHECK
          # ==================================================

          print()
          print("=" * 70)
          print("FINAL SOURCE CHECK")
          print("=" * 70)


          airport_text = FILES["airport"].read_text(
              encoding="utf-8"
          )

          charts_text = FILES["charts"].read_text(
              encoding="utf-8"
          )

          viewer_text = FILES["viewer"].read_text(
              encoding="utf-8"
          )


          forbidden = [
              (
                  "AirportChartsActivity",
                  r"repository\s*\.\s*airportName",
                  airport_text
              ),

              (
                  "AirportChartsActivity",
                  r"repository\s*\.\s*city",
                  airport_text
              ),

              (
                  "AirportChartsActivity",
                  r"ScrollView\.LayoutParams",
                  airport_text
              ),

              (
                  "AirportChartsActivity",
                  r"HorizontalScrollView\.LayoutParams",
                  airport_text
              ),

              (
                  "ChartsActivity",
                  r"ScrollView\.LayoutParams",
                  charts_text
              ),

              (
                  "PdfViewerActivity",
                  r"repository\s*\.\s*airport",
                  viewer_text
              ),

              (
                  "PdfViewerActivity",
                  r"HorizontalScrollView\.LayoutParams",
                  viewer_text
              ),

              (
                  "PdfViewerActivity",
                  r"Array<out\s+String>",
                  viewer_text
              ),
          ]


          for name, pattern, content in forbidden:

              if re.search(
                  pattern,
                  content
              ):
                  raise SystemExit(
                      name
                      + " still contains forbidden pattern: "
                      + pattern
                  )


          print()
          print(
              "AirportChartsActivity.kt: OK"
          )

          print(
              "ChartsActivity.kt: OK"
          )

          print(
              "PdfViewerActivity.kt: OK"
          )

          print()
          print(
              "All Kotlin source fixes completed successfully."
          )

          print("=" * 70)
          PY


      - name: Show changes
        shell: bash
        run: |
          echo "Changed files:"
          git status --short

          echo
          echo "Diff summary:"
          git diff --stat


      - name: Commit fixes
        shell: bash
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            app/src/main/java/com/tareghmsr/jeppiran/AirportChartsActivity.kt \
            app/src/main/java/com/tareghmsr/jeppiran/ChartsActivity.kt \
            app/src/main/java/com/tareghmsr/jeppiran/PdfViewerActivity.kt


          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi


          git commit \
            -m "Fix Kotlin compilation errors"


          git fetch origin main


          git rebase origin/main


          git push origin HEAD:main


      - name: Remove temporary fixer
        shell: bash
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git rm \
            ".github/workflows/fix-kotlin-errors.yml"


          git commit \
            -m "Remove temporary Kotlin fixer workflow"


          git push origin HEAD:main
