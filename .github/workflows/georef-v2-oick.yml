name: JEPPIRAN V2 OICK Georeferencing QA
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/georef-v2-*'
    paths:
      - scripts/georef_engine_v2.py
      - tests/test_georef_engine_v2.py
      - docs/georeferencing/controls-v2-oick.json
      - .github/workflows/georef-v2-oick.yml
permissions:
  contents: read
jobs:
  oick-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-georef.txt
      - name: Verify V2 algorithm, residual tests, and masks
        run: python -m unittest discover -s tests -p test_georef_engine_v2.py -v
      - name: Verify protected chart reference parity
        run: cmp web/data/chart-georef.json app/src/main/assets/chart-georef.json
      - name: Run original V2621 source OICK diagnosis
        run: python scripts/georef_engine_v2.py --airport OICK --output review-assets/georef-v2-oick-qa.json
      - name: Render four OICK source charts for PDF-vector review
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          import fitz
          doc=fitz.open("Iran2621.pdf")
          target=Path("review-assets/oick-v2-source-pages")
          target.mkdir(parents=True,exist_ok=True)
          subset=fitz.open()
          for selected in (218,219,221,223):
              subset.insert_pdf(doc,from_page=selected-1,to_page=selected-1)
          subset.save(str(target/"OICK-original-vector-source-pages.pdf"))
          for pn in (218,219,221,223):
              p=doc[pn-1]
              image=p.get_pixmap(matrix=fitz.Matrix(2.5,2.5),alpha=False)
              image.save(str(target/("OICK-"+str(pn)+".png")))
              words=p.get_text("words")
              grid=[{"label":w[4],"rect":[round(float(x),2) for x in w[:4]]} for w in words if re.fullmatch(r"[0-9]{2,3}-[0-9]{2}(?:\.[0-9]+)?",w[4])]
              keys=[{"label":w[4],"rect":[round(float(x),2) for x in w[:4]]} for w in words if any(x in w[4].upper() for x in ("VOR","KHD","NOTSA","ARP","THR","DME","NDB","RWY","NOT"))]
              payload={"page":pn,"width":p.rect.width,"height":p.rect.height,"grid":grid,"keyWords":keys,
                      "notToScaleRects":[list(map(float,r)) for r in p.search_for("NOT TO SCALE")]}
              (target/("OICK-"+str(pn)+".json")).write_text(json.dumps(payload,indent=2))
              print("OICK_PDF_SOURCE",json.dumps({"page":pn,"graticuleLabels":len(grid),"landmarkMentions":len(keys),
                    "notToScaleLabels":len(payload["notToScaleRects"])}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jeppiran-v2-oick-source-pages
          path: review-assets/oick-v2-source-pages/
          if-no-files-found: warn
      - name: Verify source data did not change
        run: git diff --exit-code -- web/data/chart-georef.json app/src/main/assets/chart-georef.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jeppiran-v2-oick-qa-report
          path: review-assets/georef-v2-oick-qa.json
          if-no-files-found: warn
