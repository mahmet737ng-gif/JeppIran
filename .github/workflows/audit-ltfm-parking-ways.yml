name: Audit Actual LTFM Parking Position Ways
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_ltfm_osm_parking_leads.py
      - scripts/build_ltfm_stand_lead_geometries.cjs
      - scripts/build_ltfm_chart_taxi_egress_routes.cjs
      - .github/workflows/audit-ltfm-parking-ways.yml
permissions:
  contents: write
concurrency:
  group: ltfm-osm-parking-ways
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Use source-audited original OSM parking ways or refresh when missing
        run: |
          set -euo pipefail
          if python - <<'PY'
          import json
          d=json.load(open('web/data/taxi-parking-ways/LTFM.json'))
          assert d['airport']=='LTFM'
          assert d['stats']['allOsmParkingWays']>=700
          assert d['stats']['exactGraphJoinedStandWays']>=450
          assert d['source']['license']=='ODbL 1.0'
          print('Reuse existing source-audited original OSM way geometry:',d['stats'])
          PY
          then
            echo 'Source data already validated for cycle 2621; skip unreliable live Overpass servers.'
          else
            python scripts/fetch_ltfm_osm_parking_leads.py web/data/taxi-networks/LTFM.json web/data/taxi-stand-registry/LTFM.json web/data/taxi-parking-ways/LTFM.json
          fi
      - name: Create physically connected stand source lines from exact OSM node IDs
        run: |
          node scripts/build_ltfm_stand_lead_geometries.cjs
      - name: Trace connected physical OSM source way paths to Jeppesen-published taxiway names
        run: |
          node scripts/build_ltfm_chart_taxi_egress_routes.cjs
      - name: Reject interpolated or falsely approved parking paths
        run: |
          python - <<'PY'
          import json
          p=json.load(open('web/data/taxi-parking-ways/LTFM.json'))
          assert p['airport']=='LTFM' and p['cycle']=='2621'
          assert not p['routingApproved'] and not p['verifiedForNavigation']
          for name,ways in p['matchedStandWayGeometries'].items():
              for w in ways:
                  assert not w['routingApproved'] and not w['pushbackGeometryJeppesenVerified']
                  assert bool(w['sharedTaxiGraphNodes'])==w['exactGraphNodeJoin']
                  assert len(w['geometry'])==len(w['osmNodes'])
          q=json.load(open('web/data/taxi-stand-leads/LTFM.json'))
          assert q['stats']['exactJoinedStandIdentifiers']>=350
          assert q['stats']['allRegisteredStandIdentifiers']==379
          assert q['stats']['standsWithSingleConnectedSourceVariant']>=215
          assert q['stats']['JeppesenApprovedPushbackRoutes']==0
          for stand in q['stands'].values():
              assert not stand['routingApproved']
              for v in stand['sourceParkingLeadVariants']:
                  assert not v['routingApproved']
                  if v.get('geometryContinuous'):
                      assert v['sourceNodeIds'][-1]==v['exactTaxiGraphJoinNode']
          z=json.load(open('web/data/taxi-stand-egress-routes/LTFM.json'))
          assert z['stats']['knownStandNames']==379
          assert z['stats']['standsWithSourceContinuousPathToPublishedNamedTaxiway']>=300
          assert z['stats']['operationallyVerifiedPushbacks']==0
          assert any(w['publishedTargetTaxiway']=='T5' for w in z['stands']['D3']['physicalMappedSourcePaths'])
          assert all(not w['approvedForNavigation'] for item in z['stands'].values() for w in item['physicalMappedSourcePaths'])
          print('Verified source OSM parking ways:',p['stats'],'centerlines:',q['stats'],'source routes:',z['stats'])
          PY
      - name: Publish only official OSM original parking way coordinates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp web/data/taxi-parking-ways/LTFM.json /tmp/ltfm-parking-ways.json
          cp web/data/taxi-stand-leads/LTFM.json /tmp/ltfm-stand-leads.json
          cp web/data/taxi-stand-egress-routes/LTFM.json /tmp/ltfm-stand-egress-routes.json
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p web/data/taxi-parking-ways web/data/taxi-stand-leads web/data/taxi-stand-egress-routes
            cp /tmp/ltfm-parking-ways.json web/data/taxi-parking-ways/LTFM.json
            cp /tmp/ltfm-stand-leads.json web/data/taxi-stand-leads/LTFM.json
            cp /tmp/ltfm-stand-egress-routes.json web/data/taxi-stand-egress-routes/LTFM.json
            git add web/data/taxi-parking-ways/LTFM.json web/data/taxi-stand-leads/LTFM.json web/data/taxi-stand-egress-routes/LTFM.json
            git diff --cached --quiet && exit 0
            git commit -m 'data(taxi): audit real OSM parking-position ways and exact topology joins [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
