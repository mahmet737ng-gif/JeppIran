name: SIM Relay EMQX Live WSS MQTT QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/app.js'
      - 'scripts/verify_sim_relay_emqx.py'
      - '.github/workflows/sim-relay-emqx-qa.yml'
permissions:
  contents: read
jobs:
  live-relay-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MQTT interoperability client
        run: python -m pip install --disable-pip-version-check paho-mqtt==2.1.0
      - name: Verify HTTPS web-app broker matches source configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path("web/app.js").read_text()
          assert 'new WebSocket("wss://broker.emqx.io:8084/mqtt",["mqtt"])' in app
          assert 'ws.send(mqttConnectPacket(clientId,""));' in app
          print("PASS matched anonymous MQTT client and EMQX WSS path")
          PY
      - name: Live MQTT 3.1.1 WSS-subscribe and TLS-publish
        run: python scripts/verify_sim_relay_emqx.py
