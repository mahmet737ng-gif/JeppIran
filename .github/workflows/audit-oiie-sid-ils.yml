name: OIIE Missing SID ILS Original PDF Geometry Audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_oiie_missing_sid_ils.py'
      - '.github/workflows/audit-oiie-sid-ils.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyMuPDF==1.26.6' 'numpy==2.3.5'
      - run: python scripts/audit_oiie_missing_sid_ils.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oiie-missing-sid-ils-source
          path: review-assets/oiie-georef-vector-qa
