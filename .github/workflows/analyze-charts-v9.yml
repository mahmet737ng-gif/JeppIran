name: Analyze Iran Airport Charts V13

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  analyze:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout repository with Git LFS
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # ============================================================
      # 2. Install Poppler
      # ============================================================
      - name: Install Poppler
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      # ============================================================
      # 3. Verify PDF
      # ============================================================
      - name: Verify PDF
        shell: bash
        run: |
          echo "========================================"
          echo "VERIFY PDF"
          echo "========================================"

          ls -lh Iran2620.pdf

          echo ""
          pdfinfo Iran2620.pdf | head -30

      # ============================================================
      # 4. Extract all PDF pages
      # ============================================================
      - name: Extract PDF text
        shell: bash
        run: |
          echo "========================================"
          echo "EXTRACTING PDF TEXT"
          echo "========================================"

          rm -rf pdf-text
          mkdir -p pdf-text

          TOTAL=$(pdfinfo Iran2620.pdf | awk '/Pages:/ {print $2}')

          echo "Total pages: $TOTAL"

          for PAGE in $(seq 1 "$TOTAL"); do

            pdftotext \
              -f "$PAGE" \
              -l "$PAGE" \
              -layout \
              Iran2620.pdf \
              "pdf-text/page-${PAGE}.txt"

          done

          echo ""
          echo "Extraction complete."

          echo "Extracted files:"
          find pdf-text -type f | wc -l

      # ============================================================
      # 5. Run V9 classifier
      # ============================================================
      - name: Run V9 classifier
        shell: bash
        run: |
          echo "========================================"
          echo "RUNNING V9 CLASSIFIER"
          echo "========================================"

          python - <<'PY'
          import json
          import os
          import re

          PDF_DIR = "pdf-text"

          COUNTRY_PREFIXES = {
              "OI": "Iran",
              "OR": "Iraq",
              "OM": "United Arab Emirates",
              "OO": "Oman",
              "LT": "Turkey",
              "UD": "Armenia",
              "UG": "Georgia",
          }

          FALSE_ICAO = {
              "ONLY",
              "ONTO",
              "OPIS",
              "THIS",
              "THE",
              "FROM",
              "WITH",
              "USED",
              "PAGE",
          }

          def clean(text):
              return re.sub(r"\s+", " ", text).strip()

          def read_page(page):
              path = os.path.join(
                  PDF_DIR,
                  f"page-{page}.txt"
              )

              try:
                  with open(
                      path,
                      "r",
                      encoding="utf-8",
                      errors="ignore"
                  ) as f:
                      return f.read()
              except Exception:
                  return ""

          def find_airport(text):
              upper = text.upper()

              pattern = re.compile(
                  r"\b((?:OI|OR|OM|OO|LT|UD|UG)[A-Z]{2})\s*/\s*[A-Z]{3}\b"
              )

              for match in pattern.finditer(upper):

                  icao = match.group(1)

                  if icao not in FALSE_ICAO:
                      return icao

              return None

          def detect_chart_number(text):

              upper = text.upper()

              patterns = [
                  r"\b10-[0-9]{1,2}[A-Z]?\b",
                  r"\b11-[0-9]{1,2}[A-Z]?\b",
                  r"\b12-[0-9]{1,2}[A-Z]?\b",
                  r"\b13-[0-9]{1,2}[A-Z]?\b",
                  r"\b14-[0-9]{1,2}[A-Z]?\b",
                  r"\b15-[0-9]{1,2}[A-Z]?\b",
                  r"\b16-[0-9]{1,2}[A-Z]?\b",
                  r"\b17-[0-9]{1,2}[A-Z]?\b",
              ]

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      upper
                  )

                  if match:
                      return match.group(0)

              return ""

          def classify(text):

              upper = text.upper()

              chart_number = detect_chart_number(text)

              # Explicit STAR
              if ".STAR." in upper:
                  return "STAR"

              # Explicit SID
              if ".SID." in upper:
                  return "SID"

              # Jeppesen chart number rules

              if chart_number.startswith("10-2"):
                  return "STAR"

              if chart_number.startswith("10-3"):
                  return "SID"

              if chart_number.startswith("10-9"):
                  return "Airport"

              # 10-1 / 10-1R = general/radar/etc.
              if chart_number.startswith("10-1"):
                  return "Other"

              # Approach families
              if re.match(
                  r"^(11|13|14|15|16|17)-",
                  chart_number
              ):
                  return "Approach"

              # Strong textual approach indicators
              approach_terms = [
                  "INSTRUMENT APPROACH",
                  "ACFT EXECUTING INSTRUMENT APPROACH",
                  "MISSED APPROACH",
              ]

              for term in approach_terms:
                  if term in upper:
                      return "Approach"

              # Airport information
              airport_terms = [
                  "AIRPORT INFORMATION",
                  "AERODROME INFORMATION",
                  "AIRPORT CHART",
                  "AERODROME CHART",
              ]

              for term in airport_terms:
                  if term in upper:
                      return "Airport"

              return "Unknown"

          pages = {}

          total_pages = len(
              [
                  name
                  for name in os.listdir(PDF_DIR)
                  if name.endswith(".txt")
              ]
          )

          current_airport = None

          for page in range(
              1,
              total_pages + 1
          ):

              text = read_page(page)

              if not text:
                  continue

              airport = find_airport(text)

              if airport:
                  current_airport = airport

              category = classify(text)

              # Context repair
              if not airport:
                  airport = current_airport

              pages[str(page)] = {
                  "page": page,
                  "airport": airport,
                  "category": category,
                  "chart_number": detect_chart_number(text),
                  "text": text,
              }

          with open(
              "charts-index-v9.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  pages,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("V9 pages:", len(pages))
          print()

          counts = {}

          for item in pages.values():

              category = item["category"]

              counts[category] = (
                  counts.get(category, 0) + 1
              )

          print("V9 COUNTS")

          for category, count in sorted(
              counts.items()
          ):
              print(
                  f"{category}: {count}"
              )

          PY

      # ============================================================
      # 6. Run V12 naming
      # ============================================================
      - name: Run V12 naming
        shell: bash
        run: |
          echo "========================================"
          echo "RUNNING V12 NAMING"
          echo "========================================"

          python scripts/name_charts_v12.py

      # ============================================================
      # 7. Run V13 classification
      # ============================================================
      - name: Run V13 classification
        shell: bash
        run: |
          echo "========================================"
          echo "RUNNING V13 CLASSIFICATION"
          echo "========================================"

          python scripts/classify_charts_v13.py

      # ============================================================
      # 8. Show V13 summary
      # ============================================================
      - name: Show V13 summary
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "V13 SUMMARY"
          echo "========================================"

          cat charts-summary-v13.json

      # ============================================================
      # 9. Show important sample pages
      # ============================================================
