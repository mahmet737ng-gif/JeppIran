name: Analyze Iran Airport Charts V11

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  analyze:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. CHECKOUT REPOSITORY + GIT LFS
      # ==========================================================

      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true


      # ==========================================================
      # 2. INSTALL PDF TOOLS
      # ==========================================================

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils


      # ==========================================================
      # 3. VERIFY PDF
      # ==========================================================

      - name: Verify PDF
        run: |
          echo "Checking Iran2620.pdf..."
          ls -lh Iran2620.pdf

          echo ""
          echo "PDF information:"
          pdfinfo Iran2620.pdf | head -20


      # ==========================================================
      # 4. EXTRACT EVERY PDF PAGE
      # ==========================================================

      - name: Extract PDF text
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          PAGES=$(pdfinfo Iran2620.pdf | awk '/^Pages:/ {print $2}')

          echo "Total PDF pages: $PAGES"

          for i in $(seq 1 "$PAGES"); do

            pdftotext \
              -f "$i" \
              -l "$i" \
              -layout \
              Iran2620.pdf \
              "extracted/page-$i.txt" \
              2>/dev/null || true

          done

          echo ""
          echo "Extraction finished."
          echo "Extracted pages: $(find extracted -type f | wc -l)"


      # ==========================================================
      # 5. RUN V9 CLASSIFIER
      # ==========================================================

      - name: Analyze charts V9
        shell: python
        run: |

          import json
          import re
          from pathlib import Path


          INPUT_DIR = Path("extracted")


          COUNTRY_PREFIXES = {
              "OI": "Iran",
              "OR": "Iraq",
              "OM": "United Arab Emirates",
              "OO": "Oman",
              "LT": "Turkey",
              "UD": "Armenia",
              "UG": "Georgia",
          }


          KNOWN_AIRPORTS = {
              "LTFM",

              "OIAA",
              "OIAM",
              "OIAW",
              "OIBB",
              "OIBK",
              "OIBP",
              "OICC",
              "OICI",
              "OIFM",
              "OIGG",
              "OIHH",
              "OIIE",
              "OIII",
              "OIIP",
              "OIKK",
              "OIMB",
              "OIMM",
              "OIMN",
              "OIMS",
              "OING",
              "OINZ",
              "OISS",
              "OITL",
              "OITR",
              "OITT",
              "OIYY",
              "OIZC",
              "OIZH",

              "OMDB",
              "OOMS",

              "ORBI",
              "ORNI",

              "UDYZ",

              "UGSB",
              "UGTB",
          }


          FALSE_ICAO = {
              "OVER",
              "LEFT",
              "LONG",
              "UNIT",
              "LLWS",
              "USED",
              "MUST",
              "LOST",
              "LOSS",
              "TURN",
              "TAKE",
              "AREA",
              "ACFT",
              "ELEV",
              "RWYS",
              "MAKE",
              "OMAN",
              "IRAN",
              "IRAQ",
              "ATIS",
              "EOBT",
              "PAPI",
              "RCLM",
              "ICAO",
              "JEPP",
              "ONLY",
              "ONTO",
              "OPIS",
          }


          CATEGORIES = [
              "Airport",
              "STAR",
              "SID",
              "Approach",
              "Other",
          ]


          def normalize(text):
              return text.upper().replace(
                  "\x0c",
                  "\n"
              )


          def header(text, count=40):
              return "\n".join(
                  normalize(text).splitlines()[:count]
              )


          def find_known_airports(text):

              t = normalize(text)

              found = []

              for airport in KNOWN_AIRPORTS:

                  if re.search(
                      r"\b" + re.escape(airport) + r"\b",
                      t
                  ):
                      found.append(airport)

              return found


          def find_airport(text):

              t = normalize(text)

              known = find_known_airports(t)

              if known:
                  return known[0]

              pattern = re.compile(
                  r"\b((?:OI|OR|OM|OO|LT|UD|UG)[A-Z]{2})"
                  r"\s*/\s*[A-Z]{3}\b"
              )

              for match in pattern.finditer(t):

                  code = match.group(1)

                  if code not in FALSE_ICAO:
                      return code

              return None


          def explicit_star(text):

              t = normalize(text)

              if re.search(
                  r"\.STAR\.",
                  t
              ):
                  return True

              if (
                  re.search(r"\bSTAR\b", t)
                  and
                  (
                      "ARRIVAL" in t
                      or
                      "ARRIVALS" in t
                  )
              ):
                  return True

              return False


          def explicit_sid(text):

              t = normalize(text)

              if re.search(
                  r"\.SID\.",
                  t
              ):
                  return True

              if (
                  re.search(r"\bSID\b", t)
                  and
                  (
                      "DEPARTURE" in t
                      or
                      "DEPARTURES" in t
                  )
              ):
                  return True

              return False


          def approach_score(text):

              t = normalize(text)

              score = 0

              phrases = [
                  (
                      "ACFT EXECUTING INSTRUMENT APPROACH PROCEDURE",
                      150
                  ),
                  (
                      "MISSED APPROACH",
                      60
                  ),
                  (
                      "INSTRUMENT APPROACH",
                      60
                  ),
                  (
                      "APPROACH PROCEDURE",
                      55
                  ),
                  (
                      "APPROACH CHART",
                      50
                  ),
                  (
                      "ILS APPROACH",
                      45
                  ),
                  (
                      "RNAV APPROACH",
                      45
                  ),
                  (
                      "RNP APPROACH",
                      45
                  ),
                  (
                      "VOR APPROACH",
                      45
                  ),
                  (
                      "NDB APPROACH",
                      45
                  ),
                  (
                      "LOC APPROACH",
                      45
                  ),
              ]

              for phrase, value in phrases:

                  if phrase in t:
                      score += value

              return score


          def airport_score(text):

              t = normalize(text)

              score = 0

              phrases = [
                  (
                      "AERODROME INFORMATION",
                      150
                  ),
                  (
                      "AERODROME CHART",
                      130
                  ),
                  (
                      "AIRPORT INFORMATION",
                      130
                  ),
                  (
                      "AIRPORT CHART",
                      120
                  ),
                  (
                      "AIRPORT",
                      20
                  ),
                  (
                      "AERODROME",
                      20
                  ),
                  (
                      "RUNWAY",
                      15
                  ),
                  (
                      "RWY",
                      10
                  ),
              ]

              for phrase, value in phrases:

                  if phrase in t:
                      score += value

              return score


          def chart_number(text):

              h = header(
                  text,
                  35
              )

              airport = bool(
                  re.search(
                      r"\b10-9[A-Z0-9.\-]*\b",
                      h
                  )
              )

              approach = bool(
                  re.search(
                      r"\b11-[A-Z0-9.\-]*\b",
                      h
                  )
              )

              if airport and not approach:
                  return "Airport"

              if approach and not airport:
                  return "Approach"

              return None


          def classify_anchor(text):

              t = normalize(text)

              if explicit_star(t):

                  return {
                      "category": "STAR",
                      "strength": 1000,
                      "reason": "explicit STAR",
                      "anchor": True
                  }


              if explicit_sid(t):

                  return {
                      "category": "SID",
                      "strength": 1000,
                      "reason": "explicit SID",
                      "anchor": True
                  }


              number = chart_number(t)

              if number == "Airport":

                  return {
                      "category": "Airport",
                      "strength": 900,
                      "reason": "header 10-9",
                      "anchor": True
                  }


              if number == "Approach":

                  return {
                      "category": "Approach",
                      "strength": 900,
                      "reason": "header 11",
                      "anchor": True
                  }


              approach = approach_score(t)
              airport = airport_score(t)


              if approach >= 100:

                  return {
                      "category": "Approach",
                      "strength": approach,
                      "reason": "strong approach",
                      "anchor": True
                  }


              if airport >= 120:

                  return {
                      "category": "Airport",
                      "strength": airport,
                      "reason": "strong airport",
                      "anchor": True
                  }


              if approach >= 50 and approach > airport:

                  return {
                      "category": "Approach",
                      "strength": approach,
                      "reason": "approach score",
                      "anchor": False
                  }


              if airport >= 50 and airport > approach:

                  return {
                      "category": "Airport",
                      "strength": airport,
                      "reason": "airport score",
                      "anchor": False
                  }


              return {
                  "category": "Other",
                  "strength": 0,
                  "reason": "weak/other",
                  "anchor": False
              }


          page_files = sorted(
              INPUT_DIR.glob("page-*.txt"),
              key=lambda p: int(
                  p.stem.split("-")[1]
              )
          )


          pages = []


          for path in page_files:

              page_no = int(
                  path.stem.split("-")[1]
              )

              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              airport = find_airport(text)

              classification = classify_anchor(text)

              pages.append({

                  "page": page_no,

                  "airport_raw": airport,

                  "airport": airport,

                  "text": text,

                  "category":
                      classification["category"],

                  "strength":
                      classification["strength"],

                  "reason":
                      classification["reason"],

                  "anchor":
                      classification["anchor"],

                  "fixed": False,
              })


          # ======================================================
          # REPAIR AIRPORT IDENTITY
          # ======================================================

          for _ in range(5):

              for i, page in enumerate(pages):

                  if page["airport"] is not None:
                      continue

                  previous = None
                  next_one = None


                  for j in range(
                      i - 1,
                      max(-1, i - 30),
                      -1
                  ):

                      if pages[j]["airport"] is not None:

                          previous = pages[j]["airport"]
                          break


                  for j in range(
                      i + 1,
                      min(len(pages), i + 31)
                  ):

                      if pages[j]["airport"] is not None:

                          next_one = pages[j]["airport"]
                          break


                  if previous and next_one:

                      if previous == next_one:
                          page["airport"] = previous

                  elif previous:

                      page["airport"] = previous

                  elif next_one:

                      page["airport"] = next_one


          # ======================================================
          # STAR / SID ARE STRONG
          # ======================================================

          for page in pages:

              if page["category"] in (
                  "STAR",
                  "SID"
              ):

                  page["fixed"] = True


          # ======================================================
          # VERIFIED BLOCKS
          # ======================================================

          VERIFIED = {

              "OIAW": [
                  (27, 28, "Airport"),
                  (29, 31, "STAR"),
                  (32, 37, "SID"),
                  (38, 40, "Airport"),
                  (41, 51, "Approach"),
              ],

              "OIII": [
                  (268, 280, "Airport"),
                  (281, 293, "STAR"),
                  (294, 303, "SID"),
                  (304, 308, "Airport"),
                  (309, 314, "Approach"),
              ],

              "OIMM": [
                  (361, 364, "Airport"),
                  (365, 376, "STAR"),
                  (377, 389, "SID"),
                  (390, 393, "Airport"),
                  (394, 403, "Approach"),
              ],

              "OIZC": [
                  (590, 590, "STAR"),
                  (591, 593, "SID"),
                  (594, 596, "Airport"),
                  (597, 601, "Approach"),
              ],
          }


          # ======================================================
          # APPLY VERIFIED BLOCKS
          # ======================================================

          for airport, ranges in VERIFIED.items():

              for start, end, expected in ranges:

                  for page in pages:

                      if page["airport"] != airport:
                          continue

                      if not (
                          start
                          <=
                          page["page"]
                          <=
                          end
                      ):
                          continue

                      page["category"] = expected
                      page["strength"] = 2000
                      page["reason"] = "verified block"
                      page["fixed"] = True


          # ======================================================
          # BUILD INDEX
          # ======================================================

          index = {}


          for page in pages:

              airport = page["airport"]

              if not airport:
                  continue

              category = page["category"]

              if category not in CATEGORIES:
                  category = "Other"


              if airport not in index:

                  index[airport] = {

                      "country":
                          COUNTRY_PREFIXES.get(
                              airport[:2],
                              "Unknown"
                          ),

                      "charts": {
                          category_name: []
                          for category_name in CATEGORIES
                      }
                  }


              index[airport]["charts"][category].append({

                  "page":
                      page["page"],

                  "score":
                      page["strength"],

                  "reason":
                      page["reason"]
              })


          for airport in index:

              for category in CATEGORIES:

                  index[airport]["charts"][category].sort(
                      key=lambda x: x["page"]
                  )


          # ======================================================
          # SAVE V9 INDEX
          # ======================================================

          Path(
              "charts-index-v9.json"
          ).write_text(

              json.dumps(
                  index,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          # ======================================================
          # BUILD V9 APP DATABASE
          # ======================================================

          app_data = {}


          for airport, info in index.items():

              app_data[airport] = {

                  "country":
                      info["country"],

                  "charts": {}
              }


              for category in [
                  "STAR",
                  "SID",
                  "Airport",
                  "Approach"
              ]:

                  app_data[airport]["charts"][category] = [

                      {
                          "page": item["page"]
                      }

                      for item in
                      info["charts"][category]
                  ]


          Path(
              "charts-app-v9.json"
          ).write_text(

              json.dumps(
                  app_data,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          # ======================================================
          # SUMMARY
          # ======================================================

          category_counts = {
              category: 0
              for category in CATEGORIES
          }


          for page in pages:

              category_counts[
                  page["category"]
              ] += 1


          airport_summary = {}


          for airport, info in index.items():

              airport_summary[airport] = {

                  "country":
                      info["country"],

                  "Airport":
                      len(
                          info["charts"]["Airport"]
                      ),

                  "STAR":
                      len(
                          info["charts"]["STAR"]
                      ),

                  "SID":
                      len(
                          info["charts"]["SID"]
                      ),

                  "Approach":
                      len(
                          info["charts"]["Approach"]
                      ),

                  "Other":
                      len(
                          info["charts"]["Other"]
                      ),
              }


          summary = {

              "version": "V9",

              "source":
                  "Iran2620.pdf",

              "pages":
                  len(pages),

              "category_counts":
                  category_counts,

              "airport_count":
                  len(index),

              "other_page_count":
                  category_counts["Other"],

              "airports":
                  airport_summary,
          }


          Path(
              "charts-summary-v9.json"
          ).write_text(

              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          print("")
          print("==========================================")
          print("V9 ANALYSIS COMPLETE")
          print("==========================================")
          print(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2
              )
          )


      # ==========================================================
      # 6. ADD CHART NAMES V11
      # ==========================================================

      - name: Add chart names V11
        shell: bash
        run: |
          python scripts/name_charts_v11.py


      # ==========================================================
      # 7. SHOW V11 SAMPLE NAMES
      # ==========================================================

      - name: Show V11 sample chart names
        shell: python
        run: |

          import json


          with open(
              "charts-app-v11.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          airports = [
              "OIAW",
              "OIII",
              "OIMM",
              "OIZC",
          ]


          for airport in airports:

              print("")
              print("=" * 60)
              print(airport)
              print("=" * 60)


              if airport not in data:

                  print(
                      "AIRPORT NOT FOUND"
                  )

                  continue


              charts = data[
                  airport
              ]["charts"]


              for category in [
                  "Airport",
                  "STAR",
                  "SID",
                  "Approach",
              ]:

                  print("")
                  print(
                      f"[{category}]"
                  )


                  items = charts.get(
                      category,
                      []
                  )


                  for item in items[:20]:

                      print(
                          f'Page {item.get("page")}: '
                          f'{item.get("name", "NO NAME")}'
                      )


      # ==========================================================
      # 8. UPLOAD RESULTS AS ARTIFACT
      # ==========================================================

      - name: Upload V11 results
        uses: actions/upload-artifact@v4
        with:
          name: JeppIran-V11-results
          path: |
            charts-index-v9.json
            charts-summary-v9.json
            charts-app-v9.json
            charts-index-v11.json
            charts-app-v11.json
