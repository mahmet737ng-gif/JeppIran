name: Analyze Iran Airport Charts V12

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  analyze:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Poppler
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Verify PDF
        shell: bash
        run: |
          ls -lh Iran2620.pdf
          pdfinfo Iran2620.pdf | head -30

      - name: Extract PDF text
        shell: bash
        run: |
          rm -rf pdf-text
          mkdir -p pdf-text

          PAGES=$(pdfinfo Iran2620.pdf | awk '/Pages:/ {print $2}')

          echo "PDF pages: $PAGES"

          for PAGE in $(seq 1 "$PAGES"); do
            pdftotext \
              -f "$PAGE" \
              -l "$PAGE" \
              -layout \
              Iran2620.pdf \
              "pdf-text/page-${PAGE}.txt"
          done

      - name: Run V9 chart classifier
        shell: python
        run: |
          import json
          import os
          import re

          PDF = "Iran2620.pdf"
          TEXT_DIR = "pdf-text"

          COUNTRY_PREFIXES = {
              "OI": "Iran",
              "OR": "Iraq",
              "OM": "United Arab Emirates",
              "OO": "Oman",
              "LT": "Turkey",
              "UD": "Armenia",
              "UG": "Georgia",
          }

          KNOWN_AIRPORTS = {
              "LTFM",
              "OIAA", "OIAM", "OIAW",
              "OIBB", "OIBK", "OIBP",
              "OICC", "OICI", "OIFM",
              "OIGG", "OIHH",
              "OIIE", "OIII", "OIIP",
              "OIKK",
              "OIMB", "OIMM", "OIMN", "OIMS",
              "OING", "OINZ",
              "OISS",
              "OITL", "OITR", "OITT",
              "OIYY",
              "OIZC", "OIZH",
              "OMDB", "OOMS",
              "ORBI", "ORNI",
              "UDYZ",
              "UGSB", "UGTB",
          }

          FALSE_ICAO = {
              "ONLY",
              "ONTO",
              "OPIS",
              "STAR",
              "SID",
          }

          def read_page(page):
              path = os.path.join(
                  TEXT_DIR,
                  f"page-{page}.txt"
              )

              try:
                  with open(
                      path,
                      "r",
                      encoding="utf-8",
                      errors="ignore"
                  ) as f:
                      return f.read()
              except Exception:
                  return ""

          def normalize(text):
              return re.sub(
                  r"\s+",
                  " ",
                  text.upper()
              ).strip()

          def find_airports(text):
              found = []

              pattern = re.compile(
                  r"\b((?:OI|OR|OM|OO|LT|UD|UG)[A-Z]{2})\s*/\s*[A-Z]{3}\b"
              )

              for match in pattern.findall(text):

                  if match in FALSE_ICAO:
                      continue

                  if match not in found:
                      found.append(match)

              return found

          def chart_number(text):

              lines = text.splitlines()

              for line in lines[:35]:

                  m = re.search(
                      r"\b(10-9[A-Z0-9.-]*|10-2[A-Z0-9.-]*|10-3[A-Z0-9.-]*|1[13]-[0-9A-Z.-]+)\b",
                      line.upper()
                  )

                  if m:
                      return m.group(1)

              return ""

          def classify(text):

              upper = text.upper()

              scores = {
                  "Airport": 0,
                  "STAR": 0,
                  "SID": 0,
                  "Approach": 0,
                  "Other": 0,
              }

              if ".STAR." in upper or " STAR " in upper:
                  scores["STAR"] += 70

              if ".SID." in upper or " SID " in upper:
                  scores["SID"] += 70

              if (
                  "ACFT EXECUTING INSTRUMENT APPROACH" in upper
                  or "INSTRUMENT APPROACH" in upper
                  or "MISSED APPROACH" in upper
              ):
                  scores["Approach"] += 70

              if (
                  "AIRPORT INFORMATION" in upper
                  or "AERODROME INFORMATION" in upper
                  or "AIRPORT CHART" in upper
                  or "AERODROME CHART" in upper
              ):
                  scores["Airport"] += 70

              number = chart_number(text)

              if number.startswith("10-9"):
                  scores["Airport"] += 80

              if number.startswith("10-2"):
                  scores["STAR"] += 80

              if number.startswith("10-3"):
                  scores["SID"] += 80

              if number.startswith("11-") or number.startswith("13-") or number.startswith("16-"):
                  scores["Approach"] += 80

              if re.search(
                  r"\bILS\b|\bLOC\b|\bVOR\b|\bNDB\b|\bRNAV\b|\bRNP\b",
                  upper
              ):
                  scores["Approach"] += 25

              if "ARRIVAL" in upper:
                  scores["STAR"] += 20

              if "DEPARTURE" in upper:
                  scores["SID"] += 20

              best = max(
                  scores,
                  key=scores.get
              )

              if scores[best] >= 40:
                  return best

              if scores["Other"] >= 60:
                  return "Other"

              return "Unknown"

          pages = {}

          pdf_pages = 991

          current_airport = None

          for page in range(1, pdf_pages + 1):

              text = read_page(page)

              airports = find_airports(text)

              if airports:
                  current_airport = airports[0]

              category = classify(text)

              pages[str(page)] = {
                  "page": page,
                  "category": category,
                  "airport": current_airport,
                  "text": text,
              }

          airport_data = {}

          for page_str, item in pages.items():

              airport = item["airport"]

              if not airport:
                  continue

              if airport not in airport_data:
                  airport_data[airport] = {
                      "country": COUNTRY_PREFIXES.get(
                          airport[:2],
                          ""
                      ),
                      "charts": {
                          "Airport": [],
                          "STAR": [],
                          "SID": [],
                          "Approach": [],
                          "Other": [],
                      }
                  }

              category = item["category"]

              if category not in airport_data[airport]["charts"]:
                  category = "Other"

              airport_data[airport]["charts"][category].append({
                  "page": item["page"],
                  "text": item["text"],
              })

          with open(
              "charts-index-v9.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  pages,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              "charts-app-v9.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  airport_data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          summary = {
              "source": PDF,
              "pages": pdf_pages,
              "airport_count": len(airport_data),
              "category_counts": {},
          }

          for airport in airport_data.values():
              for category, items in airport["charts"].items():
                  summary["category_counts"][category] = (
                      summary["category_counts"].get(category, 0)
                      + len(items)
                  )

          with open(
              "charts-summary-v9.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  summary,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

      - name: Run V12 chart naming
        shell: bash
        run: |
          python scripts/name_charts_v12.py

      - name: Show V12 samples
        shell: python
        run: |
          import json

          with open(
              "charts-app-v12.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          tests = {
              "OIAW": [29, 30, 31, 32, 33, 34, 35, 36, 37],
              "OIII": [281, 282, 283, 284, 285, 286, 287, 288, 289, 290, 291, 292, 293,
                       296, 297, 301, 302],
              "OIMM": [365, 366, 367, 368, 369, 370, 371, 372, 373, 374, 375, 376],
              "OIZC": [589, 590, 591, 592, 593],
          }

          print()
          print("=" * 70)
          print("V12 SAMPLE OUTPUT")
          print("=" * 70)

          for icao, pages in tests.items():

              print()
              print("=" * 70)
              print(icao)
              print("=" * 70)

              airport = data.get(icao, {})
              charts = airport.get("charts", {})

              for category, items in charts.items():

                  selected = [
                      item
                      for item in items
                      if item.get("page") in pages
                  ]

                  if not selected:
                      continue

                  print()
                  print(f"[{category}]")

                  for item in selected:
                      print(
                          f"Page {item.get('page')}: "
                          f"{item.get('name')}"
                      )

      - name: Upload V12 results
        uses: actions/upload-artifact@v4
        with:
          name: JeppIran-V12-results
          path: |
            charts-index-v9.json
            charts-summary-v9.json
            charts-app-v9.json
            charts-index-v12.json
            charts-app-v12.json
