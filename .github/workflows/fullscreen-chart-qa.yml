name: Validate immersive chart navigation

on:
  push:
    branches:
      - fix/fullscreen-chart-navigation-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewer-ux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate web JS and security-relevant fullscreen UI
        run: |
          node --check web/app.js
          node --check web/service-worker.js
          node --test tests/ipad-chart-ui-locked-v2621.test.cjs tests/fullscreen-airport-drawer.test.cjs tests/cdfa-ui-locked-v2621.test.cjs tests/aircraft-marker-locked.test.cjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android chart viewer and run unit tests
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jeppiran-fullscreen-android-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
