name: Generate LTFM Taxi Procedure Vectors
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/extract_ltfm_taxi_procedure_vectors.py
      - .github/workflows/generate-ltfm-taxi-vectors.yml
permissions:
  contents: write
concurrency:
  group: ltfm-taxi-vectors-v2621
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true
          fetch-depth: 0
      - name: Verify LFS airport chart bytes
        run: |
          git lfs pull --include=web/data/charts/LTFM.pdf
          python - <<'PY'
          from pathlib import Path
          p=Path("web/data/charts/LTFM.pdf")
          data=p.read_bytes()
          assert data[:5]==b"%PDF-", "LTFM.pdf is only an LFS pointer"
          assert len(data)>1000000
          print("source PDF bytes:",len(data))
          PY
      - name: Extract published vector strokes
        run: |
          python -m pip install -q 'pymupdf==1.26.4'
          python scripts/extract_ltfm_taxi_procedure_vectors.py web/data/charts/LTFM.pdf web/data/taxi-procedure-traces/LTFM.json
      - name: QA exact cycle and route contents
        run: |
          python - <<'PY'
          import json
          a=json.load(open('web/data/taxi-procedure-traces/LTFM.json'))
          p=a['procedures']
          assert len(p)>=35
          x=next(v for v in p if v['key']=='17R2F' and v['operation']=='DEPARTURE')
          assert x['taxiways']==['G','N2','D','B','B9A'],x['taxiways']
          assert len(x['printedSegments'])>=30
          assert all(v['printedSegments'] and v['sourceChart'].startswith('30-9') for v in p)
          assert all(v['nodeGeometryVerified'] is False for v in p)
          print('QA PASSED:',len(p),'procedure vector traces')
          PY
      - name: Commit only the precomputed procedure traces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/taxi-procedure-traces/LTFM.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(taxi): publish cached LTFM cycle 2621 procedure vectors [skip ci]'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
