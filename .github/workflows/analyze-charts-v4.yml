name: Analyze Charts V4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Analyze PDF
        shell: bash
        run: |
          set -e

          PDF="Iran2620.pdf"
          OUT="charts-index-v4.json"
          SUMMARY="charts-summary-v4.json"
          APP="charts-app-v4.json"

          if [ ! -f "$PDF" ]; then
            echo "ERROR: $PDF not found"
            exit 1
          fi

          PAGES=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')

          echo "========================================"
          echo "JeppIran Chart Analyzer V4"
          echo "PDF: $PDF"
          echo "Pages: $PAGES"
          echo "========================================"

          TMP=$(mktemp -d)

          python3 - "$PDF" "$OUT" "$SUMMARY" "$APP" "$PAGES" "$TMP" <<'PY'
          import sys
          import os
          import re
          import json
          import subprocess

          pdf = sys.argv[1]
          out_file = sys.argv[2]
          summary_file = sys.argv[3]
          app_file = sys.argv[4]
          pages = int(sys.argv[5])
          tmp = sys.argv[6]

          results = []

          # ============================================================
          # FALSE ICAO WORDS
          # ============================================================

          false_words = {
              "TAKE",
              "IRAN",
              "ELEV",
              "ATIS",
              "EOBT",
              "DOGS",
              "AREA",
              "ACFT",
              "MAKE",
              "TURN",
              "PAPI",
              "RCLM",
              "RWYS",
              "WILL",
              "LAND",
              "CDFA",
              "PANS",
              "VNAV",
              "LIEU",
              "APCH",
              "ONLY",
              "ONTO",
              "FROM",
              "WITH",
              "THIS",
              "THAT",
              "THEN",
              "WHEN",
              "WHERE",
              "HAVE",
              "BEEN",
              "YOUR",
              "THEM",
              "THEIR",
              "MUST",
              "MAYB",
              "NOTE",
              "FINAL",
              "MISSED",
              "CLIMB",
              "DESC",
              "DESCENT",
              "ARR",
              "DEPT",
              "PROC",
              "CHART",
              "ICAO",
              "JEPP",
              "JEPPESEN"
          }

          # ============================================================
          # ICAO VALIDATION
          # ============================================================

          def valid_icao(x):
              if not re.fullmatch(r"[A-Z]{4}", x):
                  return False

              if x in false_words:
                  return False

              # Dataset contains Iran, Turkey, Iraq,
              # Georgia, Armenia and UAE identifiers.
              if x[0] not in "OLUM":
                  return False

              return True

          # ============================================================
          # ICAO EXTRACTION
          # ============================================================

          def extract_icaos(text):
              found = []

              # Strong format:
              # OIAA/ABD
              # LTFM/IST
              for m in re.finditer(
                  r"\b([A-Z]{4})/[A-Z]{3}\b",
                  text
              ):
                  x = m.group(1)

                  if valid_icao(x) and x not in found:
                      found.append(x)

              # Explicit airport wording
              patterns = [
                  r"\bAIRPORT INFORMATION FOR\s+([A-Z]{4})\b",
                  r"\bAIRPORT\s+([A-Z]{4})\b",
                  r"\bAERODROME\s+([A-Z]{4})\b"
              ]

              for pat in patterns:
                  for m in re.finditer(pat, text):
                      x = m.group(1)

                      if valid_icao(x) and x not in found:
                          found.append(x)

              return found

          # ============================================================
          # NORMALIZATION
          # ============================================================

          def normalize(text):
              text = text.upper()
              text = text.replace("\r", "\n")
              text = re.sub(r"[ \t]+", " ", text)
              return text

          # ============================================================
          # TITLE EXTRACTION
          # ============================================================

          def title_from_text(text):
              lines = [
                  x.strip()
                  for x in text.splitlines()
                  if x.strip()
              ]

              # Strong SID title
              for line in lines:
                  if re.search(r"\.SID\.", line, re.I):
                      return line[:300]

              # Strong STAR title
              for line in lines:
                  if re.search(r"\.STAR\.", line, re.I):
                      return line[:300]

              # Explicit procedure titles
              for line in lines:
                  if any(
                      k in line
                      for k in [
                          "STANDARD INSTRUMENT DEPARTURE",
                          "STANDARD TERMINAL ARRIVAL",
                          "MISSED APPROACH",
                          "FINAL APPROACH",
                          "APPROACH",
                          "AERODROME CHART",
                          "AIRPORT INFORMATION"
                      ]
                  ):
                      return line[:300]

              # Jeppesen metadata/header
              for line in lines[:100]:
                  if "JEPPESEN" in line:
                      return line[:300]

              return lines[0][:300] if lines else ""

          # ============================================================
          # CATEGORY SCORING
          # ============================================================

          def score_page(text):

              t = normalize(text)

              scores = {
                  "Airport": 0,
                  "STAR": 0,
                  "SID": 0,
                  "Approach": 0,
                  "Other": 0
              }

              # --------------------------------------------------------
              # OTHER
              # --------------------------------------------------------

              if re.search(
                  r"REVISION LETTER|REVISION NOTICE|CHANGE NOTICE",
                  t
              ):
                  scores["Other"] += 120

              if re.search(
                  r"TERMINAL CHART CHANGE",
                  t
              ):
                  scores["Other"] += 120

              if re.search(
                  r"TABLE OF CONTENTS",
                  t
              ):
                  scores["Other"] += 120

              # --------------------------------------------------------
              # SID
              # --------------------------------------------------------

              if re.search(r"\.SID\.", t):
                  scores["SID"] += 150

              if "STANDARD INSTRUMENT DEPARTURE" in t:
                  scores["SID"] += 120

              if re.search(r"\bSID\b", t):
                  scores["SID"] += 50

              if re.search(r"\bDEPARTURE\b", t):
                  scores["SID"] += 20

              # --------------------------------------------------------
              # STAR
              # --------------------------------------------------------

              if re.search(r"\.STAR\.", t):
                  scores["STAR"] += 150

              if "STANDARD TERMINAL ARRIVAL" in t:
                  scores["STAR"] += 120

              if re.search(r"\bSTAR\b", t):
                  scores["STAR"] += 50

              if re.search(r"\bARRIVAL\b", t):
                  scores["STAR"] += 20

              # --------------------------------------------------------
              # APPROACH
              # --------------------------------------------------------

              if "APPROACH" in t:
                  scores["Approach"] += 80

              if re.search(r"\bAPCH\b", t):
                  scores["Approach"] += 50

              approach_words = [
                  "ILS",
                  "LOC",
                  "VOR",
                  "NDB",
                  "RNAV",
                  "RNP",
                  "MDA",
                  "DA",
                  "DH",
                  "CDFA",
                  "MISSED APPROACH",
                  "FINAL APPROACH"
              ]

              for word in approach_words:
                  if re.search(
                      r"\b" + re.escape(word) + r"\b",
                      t
                  ):
                      scores["Approach"] += 10

              if re.search(
                  r"ACFT EXECUTING INSTRUMENTAL APPROACH",
                  t
              ):
                  scores["Approach"] += 100

              # --------------------------------------------------------
              # AIRPORT
              # --------------------------------------------------------

              if "AIRPORT INFORMATION" in t:
                  scores["Airport"] += 150

              if "AERODROME CHART" in t:
                  scores["Airport"] += 150

              if "AIRPORT CHART" in t:
                  scores["Airport"] += 120

              # Strong Jeppesen airport header:
              # OIAA/ABD ... JEPPESEN
              if re.search(
                  r"\b[A-Z]{4}/[A-Z]{3}\b.*\bJEPPESEN\b",
                  t,
                  re.S
              ):
                  scores["Airport"] += 70

              airport_words = [
                  "ATIS",
                  "PAPI",
                  "RCLM",
                  "ELEV",
                  "RUNWAY",
                  "RWY",
                  "TAXIWAY",
                  "APRON"
              ]

              airport_hits = 0

              for word in airport_words:
                  if re.search(
                      r"\b" + re.escape(word) + r"\b",
                      t
                  ):
                      airport_hits += 1

              if airport_hits >= 5:
                  scores["Airport"] += 70
              elif airport_hits >= 3:
                  scores["Airport"] += 45
              elif airport_hits >= 2:
                  scores["Airport"] += 20

              return scores

          # ============================================================
          # PAGE ANALYSIS
          # ============================================================

          for page in range(1, pages + 1):

              txt = os.path.join(
                  tmp,
                  f"page-{page}.txt"
              )

              subprocess.run(
                  [
                      "pdftotext",
                      "-f",
                      str(page),
                      "-l",
                      str(page),
                      "-layout",
                      pdf,
                      txt
                  ],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              try:
                  with open(
                      txt,
                      "r",
                      encoding="utf-8",
                      errors="ignore"
                  ) as f:
                      raw = f.read()
              except Exception:
                  raw = ""

              text = normalize(raw)

              icaos = extract_icaos(text)
              title = title_from_text(text)
              scores = score_page(text)

              category = "Unknown"

              # --------------------------------------------------------
              # OTHER
              # --------------------------------------------------------

              if scores["Other"] >= 100:
                  category = "Other"

              else:

                  # Explicit strong categories first
                  if scores["SID"] >= 100:
                      category = "SID"

                  elif scores["STAR"] >= 100:
                      category = "STAR"

                  elif scores["Approach"] >= 80:
                      category = "Approach"

                  elif scores["Airport"] >= 100:
                      category = "Airport"

                  else:

                      best = max(
                          scores,
                          key=scores.get
                      )

                      if scores[best] >= 30:
                          category = best

              results.append({
                  "page": page,
                  "category": category,
                  "icao_candidates": icaos,
                  "title": title,
                  "scores": scores,
                  "airport_icao": (
                      icaos[0]
                      if icaos
                      else None
                  )
              })

              if page % 50 == 0:
                  print(
                      f"Processed {page}/{pages}"
                  )

          # ============================================================
          # CONTEXTUAL REPAIR
          # ============================================================

          strong_categories = {
              "SID",
              "STAR",
              "Approach",
              "Airport",
              "Other"
          }

          for i, item in enumerate(results):

              if item["category"] != "Unknown":
                  continue

              title = item["title"].upper()
              scores = item["scores"]

              # Explicit title
              if ".SID." in title:
                  item["category"] = "SID"
                  continue

              if ".STAR." in title:
                  item["category"] = "STAR"
                  continue

              # Neighbor context
              prev = (
                  results[i - 1]["category"]
                  if i > 0
                  else None
              )

              nxt = (
                  results[i + 1]["category"]
                  if i + 1 < len(results)
                  else None
              )

              if (
                  prev == nxt
                  and prev in strong_categories
              ):
                  item["category"] = prev
                  continue

              # Approach-heavy
              if (
                  scores["Approach"] >= 40
                  and scores["Approach"] >
                      scores["Airport"]
                  and scores["Approach"] >
                      scores["SID"]
                  and scores["Approach"] >
                      scores["STAR"]
              ):
                  item["category"] = "Approach"
                  continue

              # Airport-heavy
              if scores["Airport"] >= 50:
                  item["category"] = "Airport"
                  continue

          # ============================================================
          # CLEAN ICAO VALUES
          # ============================================================

          for item in results:

              item["icao_candidates"] = [
                  x
                  for x in item["icao_candidates"]
                  if valid_icao(x)
              ]

              if (
                  item["airport_icao"]
                  not in item["icao_candidates"]
              ):
                  item["airport_icao"] = (
                      item["icao_candidates"][0]
                      if item["icao_candidates"]
                      else None
                  )

          # ============================================================
          # SUMMARY
          # ============================================================

          category_counts = {}

          for item in results:

              category = item["category"]

              category_counts[category] = (
                  category_counts.get(category, 0) + 1
              )

          airport_map = {}

          for item in results:

              airport = item["airport_icao"]

              if not airport:
                  continue

              category = item["category"]

              airport_map.setdefault(
                  airport,
                  {}
              )

              airport_map[airport][category] = (
                  airport_map[airport].get(
                      category,
                      0
                  ) + 1
              )

          unknown_pages = [
              x["page"]
              for x in results
              if x["category"] == "Unknown"
          ]

          summary = {
              "source": os.path.basename(pdf),
              "pages": pages,
              "category_counts": category_counts,
              "airport_count": len(airport_map),
              "unknown_page_count": len(unknown_pages),
              "unknown_pages": unknown_pages,
              "airports": airport_map
          }

          # ============================================================
          # APP STRUCTURE
          # ============================================================

          app = {}

          for item in results:

              airport = item["airport_icao"]
              category = item["category"]

              if not airport:
                  continue

              if category not in {
                  "SID",
                  "STAR",
                  "Airport",
                  "Approach"
              }:
                  continue

              app.setdefault(
                  airport,
                  {
                      "SID": [],
                      "STAR": [],
                      "Airport": [],
                      "Approach": []
                  }
              )

              app[airport][category].append({
                  "page": item["page"],
                  "title": item["title"]
              })

          # ============================================================
          # WRITE OUTPUT FILES
          # ============================================================

          with open(
              out_file,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  results,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          with open(
              summary_file,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  summary,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          with open(
              app_file,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  app,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("========================================")
          print("V4 ANALYSIS COMPLETE")
          print("========================================")
          print(
              json.dumps(
                  summary,
                  indent=2,
                  ensure_ascii=False
              )
          )

          PY

      - name: Upload V4 analysis files
        uses: actions/upload-artifact@v4
        with:
          name: JeppIran-chart-analysis-v4
          path: |
            charts-index-v4.json
            charts-summary-v4.json
            charts-app-v4.json

      - name: Commit V4 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            charts-index-v4.json \
            charts-summary-v4.json \
            charts-app-v4.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add chart analysis V4"
            git push
          fi
