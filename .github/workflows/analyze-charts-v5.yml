name: V6

'on':
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3

      - name: Check PDF
        run: |
          echo "========================================"
          echo "JeppIran Chart Analyzer V6"
          echo "========================================"

          if [ ! -f "Iran2620.pdf" ]; then
            echo "ERROR: Iran2620.pdf not found"
            exit 1
          fi

          pdfinfo Iran2620.pdf | grep -E "Pages|File size"

      - name: Analyze charts
        shell: bash
        run: |
          cat > analyze_v6.py <<'PY'
          import json
          import os
          import re
          import subprocess
          import tempfile

          PDF = "Iran2620.pdf"

          OUT_INDEX = "charts-index-v6.json"
          OUT_SUMMARY = "charts-summary-v6.json"
          OUT_APP = "charts-app-v6.json"

          VALID_PREFIXES = ("O", "L", "U", "M")

          FALSE_WORDS = {
              "ONLY",
              "ONTO",
              "AREA",
              "ACFT",
              "MAKE",
              "TURN",
              "ELEV",
              "RWYS",
              "IRAN",
              "TAKE",
              "ATIS",
              "EOBT",
              "DOGS",
              "PAPI",
              "RCLM",
              "WILL",
              "LAND",
              "CDFA",
              "PANS",
              "VNAV",
              "LIEU",
              "APCH",
              "ICAO",
              "JEPPESEN",
              "CHART",
              "CHARTS",
              "PAGE",
              "DATE",
              "TIME",
              "TYPE",
              "AIRPORT",
              "APPROACH",
              "DEPARTURE",
              "ARRIVAL",
              "LEFT",
              "RIGHT",
              "LONG",
              "UNIT",
              "LLWS",
              "OVER",
              "LOST",
              "LOSS",
              "USED",
              "MUST",
              "OPIS"
          }

          def valid_icao(token):
              token = token.upper()

              return (
                  len(token) == 4
                  and token[0] in VALID_PREFIXES
                  and token.isalpha()
                  and token not in FALSE_WORDS
              )

          def find_icaos(text):
              text_upper = text.upper()

              result = []

              # Strong Jeppesen header:
              # OIAA/ABD
              # OIAW/AHW
              # LTFM/IST
              # etc.
              strong = re.findall(
                  r'\b([OLUM][A-Z0-9]{3})\s*/\s*[A-Z]{3}\b',
                  text_upper
              )

              for token in strong:
                  if valid_icao(token) and token not in result:
                      result.append(token)

              # Normal four-letter candidates
              tokens = re.findall(
                  r'\b[A-Z]{4}\b',
                  text_upper
              )

              for token in tokens:
                  if valid_icao(token) and token not in result:
                      result.append(token)

              return result

          def normalize_lines(text):
              lines = []

              for line in text.splitlines():
                  line = re.sub(
                      r'\s+',
                      ' ',
                      line
                  ).strip()

                  if line:
                      lines.append(line)

              return lines

          def extract_title(text):
              lines = normalize_lines(text)

              # 1. Explicit SID title
              for line in lines:
                  u = line.upper()

                  if (
                      ".SID." in u
                      or "STANDARD INSTRUMENT DEPARTURE" in u
                      or "INSTRUMENT DEPARTURE" in u
                  ):
                      return line[:300]

              # 2. Explicit STAR title
              for line in lines:
                  u = line.upper()

                  if (
                      ".STAR." in u
                      or "STANDARD TERMINAL ARRIVAL" in u
                      or "STANDARD ARRIVAL" in u
                  ):
                      return line[:300]

              # 3. Explicit approach title
              for line in lines:
                  u = line.upper()

                  if (
                      "APPROACH" in u
                      or "APCH" in u
                      or "ILS RWY" in u
                      or "RNAV RWY" in u
                      or "RNP RWY" in u
                      or "VOR RWY" in u
                      or "NDB RWY" in u
                  ):
                      return line[:300]

              # 4. Airport information
              for line in lines:
                  u = line.upper()

                  if "AIRPORT INFORMATION" in u:
                      return line[:300]

              # 5. Jeppesen airport header
              for line in lines:
                  u = line.upper()

                  if (
                      "JEPPESEN" in u
                      and re.search(
                          r'\b[OLUM][A-Z0-9]{3}\s*/\s*[A-Z]{3}\b',
                          u
                      )
                  ):
                      return line[:300]

              # 6. First useful line
              for line in lines[:40]:
                  if len(line) >= 8:
                      return line[:300]

              return ""

          def explicit_category_from_title(title):
              u = title.upper()

              # HIGHEST PRIORITY

              if (
                  ".SID." in u
                  or "STANDARD INSTRUMENT DEPARTURE" in u
                  or "INSTRUMENT DEPARTURE" in u
                  or re.search(r'\bSID\b', u)
              ):
                  return "SID"

              if (
                  ".STAR." in u
                  or "STANDARD TERMINAL ARRIVAL" in u
                  or "STANDARD ARRIVAL" in u
                  or re.search(r'\bSTAR\b', u)
              ):
                  return "STAR"

              if (
                  "APPROACH" in u
                  or "APCH" in u
                  or "ILS RWY" in u
                  or "RNAV RWY" in u
                  or "RNP RWY" in u
                  or "VOR RWY" in u
                  or "NDB RWY" in u
              ):
                  return "Approach"

              if "AIRPORT INFORMATION" in u:
                  return "Airport"

              return None

          def score_category(text, title):
              t = text.upper()
              h = title.upper()

              scores = {
                  "Airport": 0,
                  "STAR": 0,
                  "SID": 0,
                  "Approach": 0,
                  "Other": 0
              }

              # --------------------------------------------------
              # OTHER
              # --------------------------------------------------
              # IMPORTANT:
              # Do NOT use generic words such as:
              # CHANGES
              # EFFECTIVE DATE
              # CONTENTS
              # because they can appear inside real charts.
              #
              # Only very strong non-chart indicators.
              # --------------------------------------------------

              strong_other_patterns = [
                  "REVISION NOTICE",
                  "REVISION SUMMARY",
                  "TABLE OF CONTENTS",
                  "TERMINAL CHART DATA CYCLE",
                  "LIST OF EFFECTIVE PAGES",
                  "NOT FOR NAVIGATION"
              ]

              for p in strong_other_patterns:
                  if p in t:
                      scores["Other"] += 80

              # --------------------------------------------------
              # SID
              # --------------------------------------------------

              sid_patterns = [
                  ".SID.",
                  "STANDARD INSTRUMENT DEPARTURE",
                  "INSTRUMENT DEPARTURE",
                  "DEPARTURE PROCEDURE",
                  "DEPARTURES"
              ]

              for p in sid_patterns:
                  if p in t:
                      scores["SID"] += 40

              if ".SID." in h:
                  scores["SID"] += 80

              if "STANDARD INSTRUMENT DEPARTURE" in h:
                  scores["SID"] += 80

              # --------------------------------------------------
              # STAR
              # --------------------------------------------------

              star_patterns = [
                  ".STAR.",
                  "STANDARD TERMINAL ARRIVAL",
                  "STANDARD ARRIVAL",
                  "ARRIVAL PROCEDURE",
                  "ARRIVALS"
              ]

              for p in star_patterns:
                  if p in t:
                      scores["STAR"] += 40

              if ".STAR." in h:
                  scores["STAR"] += 80

              if "STANDARD TERMINAL ARRIVAL" in h:
                  scores["STAR"] += 80

              # --------------------------------------------------
              # APPROACH
              # --------------------------------------------------

              approach_patterns = [
                  "APPROACH",
                  "APCH",
                  "ILS",
                  "LOC RWY",
                  "VOR RWY",
                  "NDB RWY",
                  "RNAV",
                  "RNP",
                  "PAPI",
                  "MDA",
                  "DA/H",
                  "DH",
                  "CDFA",
                  "MISSED APPROACH",
                  "FINAL APPROACH",
                  "ACFT EXECUTING INSTRUMENTAL APPROACH"
              ]

              for p in approach_patterns:
                  if p in t:
                      scores["Approach"] += 10

              if "ACFT EXECUTING INSTRUMENTAL APPROACH" in h:
                  scores["Approach"] += 80

              if "MISSED APPROACH" in t:
                  scores["Approach"] += 30

              if "FINAL APPROACH" in t:
                  scores["Approach"] += 25

              if re.search(
                  r'\bILS\b.*\bRWY\b',
                  t
              ):
                  scores["Approach"] += 30

              # --------------------------------------------------
              # AIRPORT
              # --------------------------------------------------

              airport_patterns = [
                  "AIRPORT INFORMATION",
                  "AERODROME CHART",
                  "AIRPORT CHART",
                  "GROUND MOVEMENT",
                  "TAXIWAY",
                  "APRON",
                  "RUNWAY",
                  "RWY",
                  "ATIS",
                  "PAPI",
                  "RCLM"
              ]

              for p in airport_patterns:
                  if p in t:
                      scores["Airport"] += 6

              # Strong Jeppesen airport header
              if re.search(
                  r'\b[OLUM][A-Z0-9]{3}\s*/\s*[A-Z]{3}\b.*JEPPESEN',
                  t
              ):
                  scores["Airport"] += 45

              # Operational airport information
              operational = [
                  "ATIS",
                  "PAPI",
                  "RCLM",
                  "ELEV",
                  "RUNWAY",
                  "TAXIWAY",
                  "APRON"
              ]

              operational_count = sum(
                  1
                  for p in operational
                  if p in t
              )

              if operational_count >= 5:
                  scores["Airport"] += 30

              elif operational_count >= 3:
                  scores["Airport"] += 15

              return scores

          def choose_category(scores, title):
              # ---------------------------------------------
              # FIRST: explicit title always wins
              # ---------------------------------------------

              explicit = explicit_category_from_title(
                  title
              )

              if explicit:
                  return explicit, 0.99

              # ---------------------------------------------
              # Strong non-chart page
              # ---------------------------------------------

              if (
                  scores["Other"] >= 80
                  and max(
                      scores["STAR"],
                      scores["SID"],
                      scores["Approach"],
                      scores["Airport"]
                  ) < 60
              ):
                  return "Other", 0.95

              # ---------------------------------------------
              # Rank chart categories
              # ---------------------------------------------

              chart_scores = {
                  "Airport": scores["Airport"],
                  "STAR": scores["STAR"],
                  "SID": scores["SID"],
                  "Approach": scores["Approach"]
              }

              ranked = sorted(
                  chart_scores.items(),
                  key=lambda x: x[1],
                  reverse=True
              )

              best_category, best_score = ranked[0]
              second_score = ranked[1][1]

              if best_score <= 0:
                  if scores["Other"] > 0:
                      return "Other", 0.75

                  return "Unknown", 0.0

              # Clear winner
              if best_score >= 70:
                  confidence = min(
                      0.95,
                      0.70 +
                      (best_score - second_score) / 200.0
                  )

                  return (
                      best_category,
                      round(confidence, 3)
                  )

              # Moderate winner
              if best_score >= 35:
                  if best_score - second_score >= 10:
                      return (
                          best_category,
                          0.80
                      )

              # Other only if no useful chart evidence
              if (
                  scores["Other"] >= 80
                  and best_score < 35
              ):
                  return "Other", 0.90

              return "Unknown", 0.0

          print("Reading PDF...")

          info = subprocess.check_output(
              ["pdfinfo", PDF],
              text=True
          )

          match = re.search(
              r"Pages:\s+(\d+)",
              info
          )

          if not match:
              raise RuntimeError(
                  "Unable to determine page count"
              )

          pages = int(match.group(1))

          print(f"Total pages: {pages}")

          results = []

          with tempfile.TemporaryDirectory() as tmp:

              for page in range(1, pages + 1):

                  txt_file = os.path.join(
                      tmp,
                      f"{page}.txt"
                  )

                  subprocess.run(
                      [
                          "pdftotext",
                          "-f",
                          str(page),
                          "-l",
                          str(page),
                          "-layout",
                          PDF,
                          txt_file
                      ],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      check=False
                  )

                  try:
                      with open(
                          txt_file,
                          "r",
                          encoding="utf-8",
                          errors="ignore"
                      ) as f:
                          text = f.read()
                  except FileNotFoundError:
                      text = ""

                  icaos = find_icaos(text)

                  title = extract_title(text)

                  scores = score_category(
                      text,
                      title
                  )

                  category, confidence = choose_category(
                      scores,
                      title
                  )

                  airport = (
                      icaos[0]
                      if icaos
                      else None
                  )

                  results.append({
                      "page": page,
                      "airport_icao": airport,
                      "category": category,
                      "confidence": confidence,
                      "title": title,
                      "icao_candidates": icaos[:10],
                      "scores": scores
                  })

                  if page % 25 == 0:
                      print(
                          f"Processed {page}/{pages}"
                      )

          # --------------------------------------------------
          # AIRPORT CONTEXT PASS
          # --------------------------------------------------

          last_airport = None

          for item in results:

              if item["airport_icao"]:
                  last_airport = item["airport_icao"]

              elif last_airport:
                  item["airport_icao"] = last_airport

          # Backward context for pages before first airport
          next_airport = None

          for item in reversed(results):

              if item["airport_icao"]:
                  next_airport = item["airport_icao"]

              elif next_airport:
                  item["airport_icao"] = next_airport

          # --------------------------------------------------
          # CATEGORY CONTEXT REPAIR
          # --------------------------------------------------

          for i, item in enumerate(results):

              if item["category"] != "Unknown":
                  continue

              if i <= 0 or i >= len(results) - 1:
                  continue

              prev_item = results[i - 1]
              next_item = results[i + 1]

              if (
                  prev_item["category"]
                  == next_item["category"]
                  and prev_item["airport_icao"]
                  == next_item["airport_icao"]
                  and prev_item["category"]
                  in {
                      "SID",
                      "STAR",
                      "Approach",
                      "Airport"
                  }
              ):
                  item["category"] = (
                      prev_item["category"]
                  )

                  item["airport_icao"] = (
                      prev_item["airport_icao"]
                  )

                  item["confidence"] = 0.75

          # --------------------------------------------------
          # SUMMARY
          # --------------------------------------------------

          counts = {
              "Airport": 0,
              "STAR": 0,
              "SID": 0,
              "Approach": 0,
              "Unknown": 0,
              "Other": 0
          }

          airports = {}

          for item in results:

              category = item["category"]

              counts[category] += 1

              airport = item["airport_icao"]

              if not airport:
                  continue

              airports.setdefault(
                  airport,
                  {
                      "Airport": 0,
                      "STAR": 0,
                      "SID": 0,
                      "Approach": 0,
                      "Unknown": 0,
                      "Other": 0
                  }
              )

              airports[airport][category] += 1

          summary = {
              "source": PDF,
              "pages": pages,
              "category_counts": counts,
              "airport_count": len(airports),
              "unknown_page_count": counts["Unknown"],
              "other_page_count": counts["Other"],
              "airports": airports
          }

          # --------------------------------------------------
          # APP DATA
          # --------------------------------------------------

          app_airports = {}

          for item in results:

              airport = item["airport_icao"]
              category = item["category"]

              if not airport:
                  continue

              if category not in {
                  "Airport",
                  "STAR",
                  "SID",
                  "Approach"
              }:
                  continue

              app_airports.setdefault(
                  airport,
                  {
                      "Airport": [],
                      "STAR": [],
                      "SID": [],
                      "Approach": []
                  }
              )

              app_airports[
                  airport
              ][category].append({
                  "page": item["page"],
                  "title": item["title"],
                  "confidence": item["confidence"]
              })

          app = {
              "app": "JeppIran",
              "source_pdf": PDF,
              "categories": [
                  "Airport",
                  "STAR",
                  "SID",
                  "Approach"
              ],
              "airports": app_airports
          }

          # --------------------------------------------------
          # WRITE FILES
          # --------------------------------------------------

          with open(
              OUT_INDEX,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              OUT_SUMMARY,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  summary,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              OUT_APP,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  app,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # --------------------------------------------------
          # PRINT FINAL SUMMARY
          # --------------------------------------------------

          print("")
          print("========================================")
          print("V6 ANALYSIS COMPLETE")
          print("========================================")

          print(
              json.dumps(
                  summary,
                  ensure_ascii=False,
                  indent=2
              )
          )

          PY

          python3 analyze_v6.py

      - name: Upload V6 analysis
        uses: actions/upload-artifact@v4
        with:
          name: JeppIran-chart-analysis-v6
          path: |
            charts-index-v6.json
            charts-summary-v6.json
            charts-app-v6.json
