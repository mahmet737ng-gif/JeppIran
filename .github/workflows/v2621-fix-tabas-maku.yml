name: Publish V2621 Tabas and Maku chart ownership fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2621-fix-tabas-maku.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jeppiran-v2621-tabas-maku-fix
  cancel-in-progress: false

jobs:
  fix-chart-bundles:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout unchanged V2621 source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install controlled PDF tool
        run: python -m pip install PyMuPDF==1.26.6
      - name: Rebuild ONLY four ownership-affected airport PDFs without cropping
        run: python scripts/v2621_fix_tabas_maku.py
      - name: Publish four PDFs on a NEW release, keep existing cycle/georefs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=charts-V2621-tabas-maku-fix-1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "JEPPIRAN V2621 Tabas/Maku index corrections" --notes "Four airport PDFs only (OIMB,OIMT,OITT,OITU), source pages 642 and 851-853 reassigned to their printed ICAO. Same 1642 chart pages, full frames unchanged, original print-header text removed, no georef/simulator changes. NOT FOR ACTUAL NAVIGATION."
          fi
          gh release upload "$tag" v2621-tabas-maku-fix/airports/*.pdf v2621-tabas-maku-fix/audit.json --clobber
          test "$(gh release view "$tag" --json assets --jq '[.assets[]|select(.name|endswith(".pdf"))]|length')" -eq 4
          test "$(gh release view "$tag" --json assets --jq '[.assets[]|select(.name=="OIMB.pdf" or .name=="OIMT.pdf" or .name=="OITT.pdf" or .name=="OITU.pdf")]|length')" -eq 4
      - name: Publish corrected index and manifest only after release is complete
        run: |
          set -euo pipefail
          cp v2621-tabas-maku-fix/charts-current.json app/src/main/assets/charts-current.json
          cp v2621-tabas-maku-fix/charts-manifest.json app/src/main/assets/charts-manifest.json
          python - <<'PY'
          from pathlib import Path
          p=Path('web/service-worker.js')
          s=p.read_text()
          old='jeppiran-pwa-v2621-adc-qa1'
          assert old in s
          p.write_text(s.replace(old,'jeppiran-pwa-v2621-tabas-maku-1'))
          # Do not alter PDF cache: its asset URLs are per-airport bundled by
          # GitHub Pages, and SHA/version changes are in the updated manifest.
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/charts-current.json app/src/main/assets/charts-manifest.json web/service-worker.js
          git diff --cached --quiet && { echo 'No index changes to publish'; exit 1; }
          git commit -m 'Correct Tabas ADC and Maku STAR/SID ownership, reindex four airport bundles'
          git push origin HEAD:main
