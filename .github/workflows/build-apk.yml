name: Build JeppIran APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JeppIran-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish permanent Chrome download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cp app/build/outputs/apk/debug/app-debug.apk             JeppIran-latest-debug.apk

          if ! gh release view jeppiran-test >/dev/null 2>&1; then
            gh release create jeppiran-test               --title "JEPPIRAN Test APK"               --notes "Latest installable JEPPIRAN Android test build."
          fi

          gh release upload jeppiran-test             JeppIran-latest-debug.apk             --clobber
