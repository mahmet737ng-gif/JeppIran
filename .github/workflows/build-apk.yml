name: Build JeppIran APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work-no-build
      - pilot-ops-suite

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore persistent JEPPIRAN test signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jeppiran-signing
          key: jeppiran-test-signing-v1

      - name: Create signing key on first run
        if: steps.signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jeppiran-signing"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/jeppiran-signing/jeppiran-test.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=JEPPIRAN Test, OU=Taregh Msr, O=JEPPIRAN, C=IR"

      - name: Configure stable signing and version
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/jeppiran-signing/jeppiran-test.jks"
          test -s "$KEYSTORE"

          echo "JEPPIRAN_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "JEPPIRAN_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "JEPPIRAN_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "JEPPIRAN_KEY_PASSWORD=android" >> "$GITHUB_ENV"

          # Build JeppIran APK run 279 is public version 1.0. Every later
          # workflow run advances the visible decimal sequence:
          # 1.0 ... 1.9, 2.0 ... 2.9, and so on.
          VERSION_ORDINAL=$((GITHUB_RUN_NUMBER - 279))
          if [ "$VERSION_ORDINAL" -lt 0 ]; then
            echo "Unexpected workflow run number: $GITHUB_RUN_NUMBER" >&2
            exit 1
          fi
          VERSION_MAJOR=$((1 + VERSION_ORDINAL / 10))
          VERSION_MINOR=$((VERSION_ORDINAL % 10))
          VERSION_NAME="${VERSION_MAJOR}.${VERSION_MINOR}"

          VERSION_CODE=$((262000 + GITHUB_RUN_NUMBER))
          echo "JEPPIRAN_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "JEPPIRAN_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "JEPPIRAN_APK_PATH=app/build/outputs/apk/debug/${VERSION_NAME}.apk" >> "$GITHUB_ENV"

      - name: Set up Python for georeferencing
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare briefing and chart data
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/chart-georef.json

          python -m pip install --quiet PyMuPDF
          python scripts/build_approach_briefings.py \
            --pdf Iran2620.pdf \
            --index app/src/main/assets/charts-current.json \
            --output app/src/main/assets/approach-briefings.json
          test -s app/src/main/assets/approach-briefings.json

      - name: Test and build signed APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Verify APK signing
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Apply numeric APK filename
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk "$JEPPIRAN_APK_PATH"
          test -s "$JEPPIRAN_APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.JEPPIRAN_VERSION_NAME }}
          path: ${{ env.JEPPIRAN_APK_PATH }}

      - name: Package final project
        shell: bash
        run: |
          set -euo pipefail
          zip -r JeppIran-final-project.zip . \
            -x '.git/*' \
            -x '.gradle/*' \
            -x 'app/build/*' \
            -x 'build/*' \
            -x '*.jks' \
            -x '*.keystore'

      - name: Upload final project
        uses: actions/upload-artifact@v4
        with:
          name: JeppIran-final-project
          path: JeppIran-final-project.zip

      - name: Upload georeferencing audit
        uses: actions/upload-artifact@v4
        with:
          name: JeppIran-final-georef-audit
          path: |
            app/src/main/assets/chart-georef.json
            docs/georeferencing/georef-audit.json

      - name: Publish permanent in-app delta update
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE="$JEPPIRAN_APK_PATH"
          APK_RELEASE="${JEPPIRAN_VERSION_NAME}.apk"
          UPDATE_JSON="app-update.json"
          PREVIOUS_DIR="$RUNNER_TEMP/jeppiran-previous-update"
          PREVIOUS_JSON="$PREVIOUS_DIR/app-update.json"
          PREVIOUS_APK="$PREVIOUS_DIR/previous.apk"

          mkdir -p "$PREVIOUS_DIR"

          if ! gh release view jeppiran-test >/dev/null 2>&1; then
            gh release create jeppiran-test \
              --title "JEPPIRAN Test APK" \
              --notes "Latest signed installable JEPPIRAN Android test build."
          fi

          gh release download jeppiran-test \
            --pattern "app-update.json" \
            --dir "$PREVIOUS_DIR" \
            --clobber >/dev/null 2>&1 || true

          PREVIOUS_VERSION_CODE=""
          PREVIOUS_APK_NAME=""

          if [ -s "$PREVIOUS_JSON" ]; then
            PREVIOUS_VERSION_CODE="$(python - "$PREVIOUS_JSON" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              data = json.load(fh)
          print(data.get("versionCode", ""))
          PY
          )"

            PREVIOUS_APK_URL="$(python - "$PREVIOUS_JSON" <<'PY'
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              data = json.load(fh)
          print(data.get("apkUrl", ""))
          PY
          )"

            if [ -n "$PREVIOUS_APK_URL" ]; then
              PREVIOUS_APK_NAME="$(basename "$PREVIOUS_APK_URL")"

              gh release download jeppiran-test \
                --pattern "$PREVIOUS_APK_NAME" \
                --dir "$PREVIOUS_DIR" \
                --clobber >/dev/null 2>&1 || true

              if [ -s "$PREVIOUS_DIR/$PREVIOUS_APK_NAME" ]; then
                cp "$PREVIOUS_DIR/$PREVIOUS_APK_NAME" "$PREVIOUS_APK"
              fi
            fi
          fi

          cp "$APK_SOURCE" "$APK_RELEASE"

          APK_SHA256="$(sha256sum "$APK_RELEASE" | awk '{print $1}')"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PATCH_NAME=""
          PATCH_SHA256=""
          PATCH_SIZE=""
          PREVIOUS_SHA256=""

          if [ -s "$PREVIOUS_APK" ] && \
             [ -n "$PREVIOUS_VERSION_CODE" ] && \
             [ "$PREVIOUS_VERSION_CODE" -lt "$JEPPIRAN_VERSION_CODE" ]; then

            PREVIOUS_SHA256="$(sha256sum "$PREVIOUS_APK" | awk '{print $1}')"

            sudo apt-get update -qq
            sudo apt-get install -y -qq bsdiff

            PATCH_NAME="JeppIran-${PREVIOUS_VERSION_CODE}-to-${JEPPIRAN_VERSION_CODE}.bsdiff"

            bsdiff \
              "$PREVIOUS_APK" \
              "$APK_RELEASE" \
              "$PATCH_NAME"

            PATCH_SHA256="$(sha256sum "$PATCH_NAME" | awk '{print $1}')"
            PATCH_SIZE="$(stat -c%s "$PATCH_NAME")"
          fi

          export APK_RELEASE
          export APK_SHA256
          export PUBLISHED_AT
          export UPDATE_JSON
          export PREVIOUS_JSON
          export PREVIOUS_VERSION_CODE
          export PREVIOUS_SHA256
          export PATCH_NAME
          export PATCH_SHA256
          export PATCH_SIZE

          python <<'PY'
          import json
          import os

          update_json = os.environ["UPDATE_JSON"]
          previous_json = os.environ["PREVIOUS_JSON"]

          previous = {}
          if os.path.isfile(previous_json):
              try:
                  with open(previous_json, "r", encoding="utf-8") as fh:
                      previous = json.load(fh)
              except Exception:
                  previous = {}

          patches = previous.get("patches", [])
          if not isinstance(patches, list):
              patches = []

          from_code = os.environ.get("PREVIOUS_VERSION_CODE", "").strip()
          from_sha = os.environ.get("PREVIOUS_SHA256", "").strip()
          patch_name = os.environ.get("PATCH_NAME", "").strip()
          patch_sha = os.environ.get("PATCH_SHA256", "").strip()
          patch_size = os.environ.get("PATCH_SIZE", "").strip()

          if from_code and from_sha and patch_name and patch_sha and patch_size:
              new_record = {
                  "fromVersionCode": int(from_code),
                  "toVersionCode": int(os.environ["JEPPIRAN_VERSION_CODE"]),
                  "fromSha256": from_sha,
                  "toSha256": os.environ["APK_SHA256"],
                  "patchUrl": (
                      "https://github.com/mahmet737ng-gif/JeppIran/"
                      "releases/download/jeppiran-test/" + patch_name
                  ),
                  "patchSha256": patch_sha,
                  "patchSizeBytes": int(patch_size),
              }

              patches = [
                  p for p in patches
                  if not (
                      isinstance(p, dict)
                      and p.get("fromVersionCode") == new_record["fromVersionCode"]
                      and p.get("toVersionCode") == new_record["toVersionCode"]
                  )
              ]
              patches.append(new_record)

          patches = sorted(
              (
                  p for p in patches
                  if isinstance(p, dict)
                  and isinstance(p.get("fromVersionCode"), int)
                  and isinstance(p.get("toVersionCode"), int)
              ),
              key=lambda p: (p["fromVersionCode"], p["toVersionCode"]),
          )

          output = {
              "versionCode": int(os.environ["JEPPIRAN_VERSION_CODE"]),
              "versionName": os.environ["JEPPIRAN_VERSION_NAME"],
              "apkUrl": (
                  "https://github.com/mahmet737ng-gif/JeppIran/"
                  "releases/download/jeppiran-test/" + os.environ["APK_RELEASE"]
              ),
              "sha256": os.environ["APK_SHA256"],
              "publishedAt": os.environ["PUBLISHED_AT"],
              "updateMode": "delta-preferred",
              "patches": patches,
          }

          with open(update_json, "w", encoding="utf-8") as fh:
              json.dump(output, fh, indent=2)
              fh.write("\n")
          PY

          gh release upload jeppiran-test \
            "$APK_RELEASE" \
            --clobber

          if [ -n "$PATCH_NAME" ] && [ -s "$PATCH_NAME" ]; then
            gh release upload jeppiran-test \
              "$PATCH_NAME" \
              --clobber
          fi

          gh release upload jeppiran-test \
            "$UPDATE_JSON" \
            --clobber
