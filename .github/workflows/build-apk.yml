name: Build JeppIran APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare stable JEPPIRAN signing
        env:
          JEPPIRAN_KEYSTORE_B64: ${{ secrets.JEPPIRAN_TEST_KEYSTORE_B64 }}
          JEPPIRAN_STORE_PASSWORD_SECRET: ${{ secrets.JEPPIRAN_TEST_STORE_PASSWORD }}
          JEPPIRAN_KEY_ALIAS_SECRET: ${{ secrets.JEPPIRAN_TEST_KEY_ALIAS }}
          JEPPIRAN_KEY_PASSWORD_SECRET: ${{ secrets.JEPPIRAN_TEST_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${JEPPIRAN_KEYSTORE_B64:-}" ] ||              [ -z "${JEPPIRAN_STORE_PASSWORD_SECRET:-}" ] ||              [ -z "${JEPPIRAN_KEY_ALIAS_SECRET:-}" ] ||              [ -z "${JEPPIRAN_KEY_PASSWORD_SECRET:-}" ]; then
            echo "::error::Stable JEPPIRAN signing secrets are not configured. Refusing to create an APK that cannot update the installed app."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/jeppiran-test.jks"
          printf '%s' "$JEPPIRAN_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"

          echo "JEPPIRAN_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "JEPPIRAN_KEYSTORE_PASSWORD=$JEPPIRAN_STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "JEPPIRAN_KEY_ALIAS=$JEPPIRAN_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
          echo "JEPPIRAN_KEY_PASSWORD=$JEPPIRAN_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"

          VERSION_CODE=$((262000 + GITHUB_RUN_NUMBER))
          echo "JEPPIRAN_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "JEPPIRAN_VERSION_NAME=V2620-test.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JeppIran-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish permanent Chrome download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cp app/build/outputs/apk/debug/app-debug.apk JeppIran-latest-debug.apk

          if ! gh release view jeppiran-test >/dev/null 2>&1; then
            gh release create jeppiran-test               --title "JEPPIRAN Test APK"               --notes "Latest installable JEPPIRAN Android test build."
          fi

          gh release upload jeppiran-test             JeppIran-latest-debug.apk             --clobber
