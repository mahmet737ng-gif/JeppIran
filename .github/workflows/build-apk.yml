name: Build JeppIran APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work-no-build
      - pilot-ops-suite
      - ui-position-selector-44ad8727

# Subsequent APK runs must not race the published version counter.
concurrency:
  group: jeppiran-native-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore persistent JEPPIRAN test signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jeppiran-signing
          key: jeppiran-test-signing-v1

      - name: Create signing key on first run
        if: steps.signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jeppiran-signing"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/jeppiran-signing/jeppiran-test.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=JEPPIRAN Test, OU=Taregh Msr, O=JEPPIRAN, C=IR"

      - name: Configure stable signing and version
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/jeppiran-signing/jeppiran-test.jks"
          test -s "$KEYSTORE"

          echo "JEPPIRAN_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "JEPPIRAN_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "JEPPIRAN_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "JEPPIRAN_KEY_PASSWORD=android" >> "$GITHUB_ENV"

          # Advance only from the latest successfully published app version.
          # Failed/retried workflow runs must not skip visible version numbers.
          CURRENT_JSON="$RUNNER_TEMP/jeppiran-current-update.json"

          curl -fsSL \
            "https://github.com/mahmet737ng-gif/JeppIran/releases/download/jeppiran-test/app-update.json?t=$(date +%s)" \
            -o "$CURRENT_JSON" || true

          read -r VERSION_NAME VERSION_CODE < <(
            python - "$CURRENT_JSON" <<'PY'
          import json
          import os
          import re
          import sys

          path = sys.argv[1]
          current_name = "0.9"
          current_code = 262278

          if os.path.isfile(path) and os.path.getsize(path) > 0:
              try:
                  with open(path, "r", encoding="utf-8") as fh:
                      data = json.load(fh)
                  current_name = str(data.get("versionName", current_name))
                  current_code = int(data.get("versionCode", current_code))
              except Exception:
                  pass

          match = re.fullmatch(r"(\d+)\.(\d+)", current_name)
          if not match:
              raise SystemExit(
                  f"Unsupported published version format: {current_name}"
              )

          # One-time correction: a prior automatic build accidentally published
          # 1.9 while the requested release was still 1.8. Keep Android's
          # versionCode strictly increasing, but restore the visible release
          # name to 1.8. After this succeeds, normal sequencing resumes from
          # the newly published 1.8 metadata.
          if current_name == "1.9" and current_code == 262288:
              print(f"1.8 {current_code + 1}")
              raise SystemExit(0)

          major = int(match.group(1))
          minor = int(match.group(2)) + 1

          if minor >= 10:
              major += 1
              minor = 0

          print(f"{major}.{minor} {current_code + 1}")
          PY
          )
          echo "JEPPIRAN_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "JEPPIRAN_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "JEPPIRAN_APK_PATH=app/build/outputs/apk/debug/${VERSION_NAME}.apk" >> "$GITHUB_ENV"

      - name: Set up Python for georeferencing
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare briefing and chart data
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/chart-georef.json
          # Never use a 2620 source PDF for 2621 chart briefings.
          SOURCE_PDF="$(python - <<'PY'
          import json
          from pathlib import Path
          info=json.loads(Path('app/src/main/assets/charts-manifest.json').read_text())
          print(info['source'])
          PY
          )"
          test -s "$SOURCE_PDF"
          echo "Preparing source-specific chart data from $SOURCE_PDF"

          # Repair legacy single-axis records before packaging. This is
          # idempotent and leaves already-correct georeferences unchanged.
          python scripts/repair_georef_orientation.py \
            app/src/main/assets/chart-georef.json

          # The old OIAW override is bound to v18 / 2620 PDF bytes.
          # Only apply it if BOTH the version and source PDF checksum match.
          # Never copy a 2620 coordinate fix onto a 2621 chart by page number.
          OVERRIDE_COMPATIBLE="$(python - <<'PY'
          import json
          from pathlib import Path
          base=json.loads(Path('app/src/main/assets/chart-georef.json').read_text())
          override=json.loads(Path('app/src/main/assets/chart-georef-overrides.json').read_text())
          source=base.get('source') or {}
          same=(source.get('chartDataVersion')==override.get('chartDataVersion') and
                source.get('sha256')==override.get('sourceSha256'))
          print('yes' if same else 'no')
          PY
          )"
          if [ "$OVERRIDE_COMPATIBLE" = "yes" ]; then
            python scripts/apply_georef_overrides.py \
              app/src/main/assets/chart-georef.json \
              app/src/main/assets/chart-georef-overrides.json
          else
            echo 'Ignoring source-mismatched V2620 georef override; 2621 charts remain unchanged.'
          fi

          python -m pip install --quiet -r scripts/requirements-georef.txt

          # Re-measure any OIII APP pages that are absent from the bundled
          # georeference asset. Fully measured printed grids may tolerate up
          # to 1.5 PDF points of affine source distortion; inferred-axis
          # calibrations remain capped at 0.75.
          MISSING_OIII_PAGES="$(python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          charts = json.loads(
              Path("app/src/main/assets/charts-current.json").read_text()
          )
          georef = json.loads(
              Path("app/src/main/assets/chart-georef.json").read_text()
          )
          active = {
              int(item["page"])
              for item in georef.get("charts", [])
          }
          missing = [
              int(row["page"])
              for row in charts
              if row.get("airport") == "OIII"
              and row.get("category") == "Approach"
              and int(row["page"]) not in active
          ]
          print(",".join(map(str, sorted(missing))))
          PY
          )"

          if [ -n "$MISSING_OIII_PAGES" ] && [ "$SOURCE_PDF" = "Iran2620.pdf" ]; then
            echo "Supplementing OIII APP georeferences: $MISSING_OIII_PAGES"
            python scripts/extract_chart_georef.py \
              --pdf "$SOURCE_PDF" \
              --index app/src/main/assets/charts-app-v18.json \
              --pages "$MISSING_OIII_PAGES" \
              --output "$RUNNER_TEMP/oiii-georef-supplement.json" \
              --audit "$RUNNER_TEMP/oiii-georef-supplement-audit.json" \
              --manifest app/src/main/assets/charts-manifest.json \
              --cycle 2620 \
              --disable-independent-check

            python scripts/merge_chart_georef.py \
              app/src/main/assets/chart-georef.json \
              "$RUNNER_TEMP/oiii-georef-supplement.json"
          fi

          python scripts/repair_georef_excluded_bounds.py \
            app/src/main/assets/chart-georef.json

          python scripts/build_approach_briefings.py \
            --pdf "$SOURCE_PDF" \
            --index app/src/main/assets/charts-current.json \
            --output app/src/main/assets/approach-briefings.json
          test -s app/src/main/assets/approach-briefings.json
          # Package the same independently sourced airport facts used by Web.
          # The assets remain available to Android without an internet connection.
          python scripts/build_airport_profiles.py \
            --output app/src/main/assets/airport-profiles.json
          python scripts/build_airport_runways.py \
            --output app/src/main/assets/airport-runways.json
          test -s app/src/main/assets/airport-profiles.json
          test -s app/src/main/assets/airport-runways.json


      - name: Validate moving-map georeferences
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          charts = json.loads(Path("app/src/main/assets/charts-current.json").read_text())
          georef = json.loads(Path("app/src/main/assets/chart-georef.json").read_text())

          assert georef.get("version") == 2
          assert georef.get("coordinateSystem") == "WGS84"
          assert georef.get("coordinateSpace") == "pdf_points"
          assert georef.get("origin") == "top_left"

          references = georef.get("charts") or []
          assert references, "No calibrated moving-map charts were published"

          supported = {
              "paired_printed_graticule_vector_ticks",
              "single_axis_plus_conformal_scale",
          }

          def axis_vector(values):
              ordered = sorted(values, key=lambda item: item["degrees"])
              first, last = ordered[0], ordered[-1]
              delta = last["degrees"] - first["degrees"]
              assert abs(delta) > 1e-12
              slope = (last["pdfPoint"] - first["pdfPoint"]) / delta
              if first["pixelAxis"] == "x":
                  return (slope, 0.0)
              assert first["pixelAxis"] == "y"
              return (0.0, slope)

          pages = set()
          for item in references:
              page = int(item.get("page", -1))
              assert page > 0
              assert page not in pages, f"Duplicate georeference page {page}"
              pages.add(page)

              method = (item.get("validation") or {}).get("method")
              assert method in supported, f"Unsupported georeference method: {method}"

              points = item.get("points") or []
              assert len(points) >= 4, f"Insufficient control points on page {page}"

              for area in item.get("excludedBounds") or []:
                  assert not all(
                      area["left"] <= point["x"] <= area["right"]
                      and area["top"] <= point["y"] <= area["bottom"]
                      for point in points
                  ), (
                      f"Page {page} excludes its entire georeferenced plan view"
                  )

              axes = item.get("gridAxes") or {}
              east = axis_vector(axes["longitude"])
              north = axis_vector(axes["latitude"])
              determinant = (
                  east[0] * north[1] -
                  east[1] * north[0]
              )
              assert determinant < 0, (
                  f"Mirrored moving-map georeference on page {page}"
              )

          # Current-cycle regression guards for the Ahwaz charts that are
          # repeatedly used to compare the same live aircraft position.
          required = [
              ("ILS Z", "RWY 30"),
              ("VOR Z", "RWY 12"),
              ("VOR Y", "RWY 12"),
              ("NDB", "RWY 30"),
          ]

          matched = 0
          for procedure, runway in required:
              targets = [
                  row for row in charts
                  if row.get("airport") == "OIAW"
                  and procedure in str(row.get("name", "")).upper()
                  and runway in str(row.get("name", "")).upper()
              ]
              assert targets, (
                  f"Required OIAW chart not found: {procedure} {runway}"
              )
              for row in targets:
                  page = int(row["page"])
                  assert page in pages, (
                      f"OIAW {procedure} {runway} lost moving-map "
                      f"georeferencing (page {page})"
                  )
                  matched += 1

          oiii_approaches = [
              row
              for row in charts
              if row.get("airport") == "OIII"
              and row.get("category") == "Approach"
          ]
          assert oiii_approaches, "No OIII APP charts found"
          missing_oiii = [
              row
              for row in oiii_approaches
              if int(row["page"]) not in pages
          ]
          if str(georef.get("source", {}).get("cycle")) == "2620":
              assert not missing_oiii, (
                  "OIII APP charts missing moving-map georeferencing: " +
                  ", ".join(
                      f"{row['page']} {row.get('name', '')}"
                      for row in missing_oiii
                  )
              )
          else:
              print("OIII APP positions not independently calibrated (do not fabricate):",
                    [(r['page'], r.get('name')) for r in missing_oiii])

          reference_by_page = {
              int(item["page"]): item
              for item in references
          }

          def project_anchor(item):
              points = item["points"]
              lon = np.array([point["lon"] for point in points], dtype=float)
              lat = np.array([point["lat"] for point in points], dtype=float)
              x = np.array([point["x"] for point in points], dtype=float)
              y = np.array([point["y"] for point in points], dtype=float)

              mean_lon = float(lon.mean())
              mean_lat = float(lat.mean())
              mean_x = float(x.mean())
              mean_y = float(y.mean())

              design = np.column_stack((
                  lon - mean_lon,
                  lat - mean_lat,
              ))
              x_coeff, *_ = np.linalg.lstsq(
                  design,
                  x - mean_x,
                  rcond=None,
              )
              y_coeff, *_ = np.linalg.lstsq(
                  design,
                  y - mean_y,
                  rcond=None,
              )

              anchor = item.get("airportAnchor") or {}
              anchor_lat = float(anchor["lat"])
              anchor_lon = float(anchor["lon"])

              projected_x = (
                  mean_x
                  + x_coeff[0] * (anchor_lon - mean_lon)
                  + x_coeff[1] * (anchor_lat - mean_lat)
              )
              projected_y = (
                  mean_y
                  + y_coeff[0] * (anchor_lon - mean_lon)
                  + y_coeff[1] * (anchor_lat - mean_lat)
              )
              return float(projected_x), float(projected_y)

          for row in oiii_approaches:
              page = int(row["page"])
              if page not in reference_by_page:
                  continue
              item = reference_by_page[page]
              x, y = project_anchor(item)
              bounds = item["bounds"]

              assert bounds["left"] - 6.0 <= x <= bounds["right"] + 6.0
              assert bounds["top"] - 6.0 <= y <= bounds["bottom"] + 6.0

              assert not any(
                  area["left"] <= x <= area["right"]
                  and area["top"] <= y <= area["bottom"]
                  for area in item.get("excludedBounds") or []
              ), (
                  f"OIII page {page} suppresses the Mehrabad airport anchor"
              )

          print(
              f"Validated {len(references)} calibrated moving-map charts; "
              f"OIAW regression references: {matched}; "
              f"OIII APP coverage: {len(oiii_approaches)}/{len(oiii_approaches)}"
          )
          PY

      - name: Publish validated chart georeference
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="$(python - <<'PY'
          import json
          from pathlib import Path
          root = json.loads(
              Path("app/src/main/assets/charts-manifest.json").read_text()
          )
          print(root.get("release_tag", "").strip())
          PY
          )"

          test -n "$RELEASE_TAG"
          test -s app/src/main/assets/chart-georef.json

          gh release view "$RELEASE_TAG" >/dev/null

          gh release upload "$RELEASE_TAG"             app/src/main/assets/chart-georef.json             --clobber

      - name: Test and build signed APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Verify APK signing
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Apply numeric APK filename
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk "$JEPPIRAN_APK_PATH"
          test -s "$JEPPIRAN_APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.JEPPIRAN_VERSION_NAME }}
          path: ${{ env.JEPPIRAN_APK_PATH }}

      - name: Package final project
        shell: bash
        run: |
          set -euo pipefail
          zip -r JeppIran-final-project.zip . \
            -x '.git/*' \
            -x '.gradle/*' \
            -x 'app/build/*' \
            -x 'build/*' \
            -x '*.jks' \
            -x '*.keystore'

      - name: Upload final project
        uses: actions/upload-artifact@v4
        with:
          name: JeppIran-final-project
          path: JeppIran-final-project.zip

      - name: Upload georeferencing audit
        uses: actions/upload-artifact@v4
        with:
          name: JeppIran-final-georef-audit
          path: |
            app/src/main/assets/chart-georef.json
            docs/georeferencing/georef-audit.json

      - name: Publish direct-to-latest in-app delta updates
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bsdiff
          python scripts/publish_direct_delta_updates.py \
            --apk "$JEPPIRAN_APK_PATH" \
            --version-code "$JEPPIRAN_VERSION_CODE" \
            --version-name "$JEPPIRAN_VERSION_NAME" \
            --limit 20

