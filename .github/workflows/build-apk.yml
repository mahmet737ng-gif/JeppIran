name: Build JeppIran APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work-no-build
      - pilot-ops-suite

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore persistent JEPPIRAN test signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jeppiran-signing
          key: jeppiran-test-signing-v1

      - name: Create signing key on first run
        if: steps.signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jeppiran-signing"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/jeppiran-signing/jeppiran-test.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=JEPPIRAN Test, OU=Taregh Msr, O=JEPPIRAN, C=IR"

      - name: Configure stable signing and version
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/jeppiran-signing/jeppiran-test.jks"
          test -s "$KEYSTORE"

          echo "JEPPIRAN_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "JEPPIRAN_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "JEPPIRAN_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "JEPPIRAN_KEY_PASSWORD=android" >> "$GITHUB_ENV"

          VERSION_CODE=$((262000 + GITHUB_RUN_NUMBER))
          echo "JEPPIRAN_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "JEPPIRAN_VERSION_NAME=V2620-test.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Set up Python for georeferencing
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare briefing and chart data
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/chart-georef.json

          python -m pip install --quiet PyMuPDF
          python scripts/build_approach_briefings.py \
            --pdf Iran2620.pdf \
            --index app/src/main/assets/charts-current.json \
            --output app/src/main/assets/approach-briefings.json
          test -s app/src/main/assets/approach-briefings.json

      - name: Test and build signed APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Verify APK signing
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JeppIran-final-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Package final project
        shell: bash
        run: |
          set -euo pipefail
          zip -r JeppIran-final-project.zip . \
            -x '.git/*' \
            -x '.gradle/*' \
            -x 'app/build/*' \
            -x 'build/*' \
            -x '*.jks' \
            -x '*.keystore'

      - name: Upload final project
        uses: actions/upload-artifact@v4
        with:
          name: JeppIran-final-project
          path: JeppIran-final-project.zip

      - name: Upload georeferencing audit
        uses: actions/upload-artifact@v4
        with:
          name: JeppIran-final-georef-audit
          path: |
            app/src/main/assets/chart-georef.json
            docs/georeferencing/georef-audit.json

      - name: Publish permanent in-app update
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          APK_RELEASE="JeppIran-latest-debug.apk"
          UPDATE_JSON="app-update.json"

          cp "$APK_SOURCE" "$APK_RELEASE"

          APK_SHA256="$(sha256sum "$APK_RELEASE" | awk '{print $1}')"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          cat > "$UPDATE_JSON" <<EOF
          {
            "versionCode": ${JEPPIRAN_VERSION_CODE},
            "versionName": "${JEPPIRAN_VERSION_NAME}",
            "apkUrl": "https://github.com/mahmet737ng-gif/JeppIran/releases/download/jeppiran-test/JeppIran-latest-debug.apk",
            "sha256": "${APK_SHA256}",
            "publishedAt": "${PUBLISHED_AT}"
          }
          EOF

          if ! gh release view jeppiran-test >/dev/null 2>&1; then
            gh release create jeppiran-test \
              --title "JEPPIRAN Test APK" \
              --notes "Latest signed installable JEPPIRAN Android test build."
          fi

          gh release upload jeppiran-test \
            "$APK_RELEASE" \
            "$UPDATE_JSON" \
            --clobber
